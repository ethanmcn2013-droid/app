/* ═══════════════════════════════════════════════════════════════════
   DIRECTION B · THE APPROACH

   Thesis: the artifact does not exist to inform, it exists to make a day
   feel like it is coming. So the organising object is not a list, it is
   a DISTANCE. One vertical measure where a pixel is a real unit of time:
   two weeks apart looks two weeks apart, and the seven days between the
   menu tasting and the invitations look exactly half of it. The day is a
   horizon that never moves. Everything else approaches it.

   The ground is ink. This is the direction that argues with the operator
   light-lock, deliberately and on the record (see DIRECTIONS.md §B). The
   argument: a wedding link is opened in the evening, on a phone, in bed,
   and a white page at that moment is a flashlight. The print state
   inverts, because you cannot hand someone a black page off a home
   printer, and that inversion is the one impossibility this direction
   admits.

   Contrast discipline: on ink, paper at 0.46 is the lowest alpha any
   text may use (4.65:1). Indigo on ink is 2.99:1, so in this direction
   indigo NEVER sets type — it is a rule and a mark, nothing else. That
   constraint is what stops the accent becoming wallpaper here.
   ═══════════════════════════════════════════════════════════════════ */

  min-height: 32px;
  padding: 6px 12px;
  border: 1px solid var(--fore-16);
  border-radius: 6px;
  font-size: 15px;
  line-height: 1.4;
  color: var(--fore);
  transition: border-color var(--t-base) var(--ease), background-color var(--t-base) var(--ease);
}
.b-act:hover { border-color: var(--fore-46); background: var(--fore-06); }
.b-act[data-primary="true"] { background: var(--fore); color: var(--back); border-color: var(--fore); }
.b-act[data-primary="true"]:hover { background: var(--fore-90); }
.b-grab {
  min-height: 28px;
  padding: 0 8px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.5;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--fore-62);
  transition: background-color var(--t-base) var(--ease);
}
.b-grab:hover { background: var(--fore-06); }

/* ── the editor ───────────────────────────────────────────────────
   The date control moves the item ON the measure while you hold it.
   That is the whole reason this direction puts editing here: changing a
   date is not filling in a field, it is moving something nearer. */
/* The editor floats above the measure rather than pushing it: on an
   absolutely-positioned measure, pushing would move every date under it,
   and a control that appears to move six other dates is a control
   nobody will touch. It gets an opaque ground so nothing reads through. */
.b-item[data-editing="true"] { z-index: 2; }
.b-edit {
  position: relative;
  z-index: 2;
  background: var(--back);
  margin: 12px 0 0;
  padding: 16px;
  border: 1px solid var(--fore-16);
  border-radius: 8px;
  background: var(--fore-06);
  display: grid;
  gap: 12px;
  line-height: 1.5;
}
.b-label {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--fore-62);
}
.b-input {
  width: 100%;
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid var(--fore-28);
  border-radius: 6px;
  background: var(--back);
  color: var(--fore);
  font-size: 17px;
  line-height: 1.4;
}
.b-input[data-mono="true"] { font-family: var(--mono); font-size: 15px; letter-spacing: 0.04em; }
.b-stepRow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.b-step {
  min-width: 40px;
  min-height: 40px;
  border: 1px solid var(--fore-28);
  border-radius: 6px;
  color: var(--fore);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.4;
  text-align: center;
  transition: background-color var(--t-base) var(--ease);
}
.b-step:hover { background: var(--fore-06); }
.b-stepRead {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: 0.06em;
  color: var(--fore);
}
.b-seg { display: inline-flex; border: 1px solid var(--fore-28); border-radius: 6px; overflow: hidden; }
.b-seg button {
  min-height: 34px;
  padding: 6px 12px;
  font-size: 15px;
  line-height: 1.4;
  color: var(--fore-72);
  transition: background-color var(--t-base) var(--ease), color var(--t-base) var(--ease);
}
.b-seg button + button { border-left: 1px solid var(--fore-28); }
.b-seg button[aria-pressed="true"] { background: var(--fore); color: var(--back); }
.b-editActs { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.b-undo {
  margin: 20px 0 0;
  padding: 10px 12px;
  border: 1px solid var(--fore-16);
  border-radius: 6px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  font-size: 15px;
  line-height: 1.5;
  color: var(--fore-72);
}
.b-undo button {
  min-height: 28px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 15px;
  line-height: 1.5;
  color: var(--fore);
  text-decoration: underline;
  text-decoration-color: var(--fore-28);
  text-underline-offset: 3px;
}
.b-undo kbd { font-family: var(--mono); font-size: 11px; line-height: 1.4; color: var(--fore-62); }

/* ── the empty field ──────────────────────────────────────────────
   Nothing is further away than a day with no date. One question. */
.b-empty { padding: 80px 22px 90px; }
[data-medium="sheet"] .b-empty, [data-medium="full"] .b-empty { padding: 120px 56px 130px; }
.b-emptyTitle { font-size: 38px; font-weight: 600; line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 12px; color: var(--fore); }
[data-medium="sheet"] .b-emptyTitle, [data-medium="full"] .b-emptyTitle { font-size: 64px; }
.b-emptyBody { font-size: 17px; line-height: 1.5; color: var(--fore-62); margin: 0 0 28px; max-width: 34ch; }
.b-emptyForm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ── publish ──────────────────────────────────────────────────────
   The ceremony is not a form. It is the card itself, held up, before
   anyone has seen it. */
/* A 43-character share token cannot shrink, so its row sets the
   min-content width of the whole column unless every box between it and
   the grid is told it may be narrower than its contents. */
.b-press { display: grid; gap: 28px; }
.b-press > * { min-width: 0; }
@media (min-width: 901px) {
  [data-medium="full"] .b-press { grid-template-columns: 320px minmax(0, 1fr); gap: 64px; align-items: start; }
}
.b-pressTitle { font-size: 38px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; margin: 0 0 12px; color: var(--fore); }
[data-medium="full"] .b-pressTitle { font-size: 48px; }
.b-pressBody { font-size: 17px; line-height: 1.55; color: var(--fore-62); margin: 0 0 20px; max-width: 46ch; }
.b-linkRow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--fore-16);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
  color: var(--fore);
  overflow: hidden;
  margin: 0 0 16px;
}
.b-linkRow { min-width: 0; }
.b-linkRow span { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-note { font-size: 13px; line-height: 1.55; color: var(--fore-62); margin: 16px 0 0; }

/* ── the card, as it lands in a chat ──────────────────────────────
   A black card in a white chat app is the whole first impression, and
   it is the strongest argument this direction has. */
/* LITERAL, not laddered: the chat app is somebody else's surface and it
   is light whatever ground we chose. Everything from here to the end of
   the unfurl block is deliberately outside the fore/back system. */
.b-chat { padding: 24px 16px; background: var(--paper); }
.b-bubble {
  max-width: 300px;
  margin: 0 0 10px;
  padding: 10px 12px;
  border-radius: 16px;
  background: var(--ink-06);
  border: 1px solid var(--ink-10);
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
}
/* display: block, and it matters. An anchor is inline by default, and on
   a non-replaced inline element max-width does nothing, the background
   paints only around the line boxes and the border-radius paints nothing
   at all. Inside the chat the card looked right for the wrong reason —
   the chat ground is white — and on the publish screen it vanished. */
.b-unfurl { display: block; max-width: 300px; border: 1px solid var(--ink-16); border-radius: 12px; overflow: hidden; background: var(--paper); }
.b-og {
  aspect-ratio: 1200 / 630;
  background: var(--back);
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  line-height: 1.4;
}
.b-ogWho { font-family: var(--mono); font-size: 11px; line-height: 1.4; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fore-62); margin: 0; }
.b-ogNum { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 48px; line-height: 0.9; letter-spacing: -0.04em; color: var(--fore); margin: 0; }
.b-ogDate { font-family: var(--mono); font-size: 11px; line-height: 1.4; letter-spacing: 0.13em; text-transform: uppercase; color: var(--fore-62); margin: 6px 0 0; }
.b-unfurlMeta { padding: 10px 12px; }
.b-unfurlTitle { font-size: 15px; font-weight: 600; line-height: 1.35; margin: 0 0 3px; color: var(--ink); }
.b-unfurlHost { font-size: 12px; line-height: 1.4; color: var(--ink-62); margin: 0; }

/* ── the day ──────────────────────────────────────────────────────
   The number reaches zero, and a number that reads 0 is a worse
   sentence than the word. The measure has nothing left to measure, so
   it goes. */
.b-dayWrap { padding: 80px 22px 90px; text-align: center; }
[data-medium="sheet"] .b-dayWrap, [data-medium="full"] .b-dayWrap { padding: 130px 56px 140px; }
.b-dayToday { font-family: var(--mono); font-size: 12px; line-height: 1.4; letter-spacing: 0.3em; text-transform: uppercase; color: var(--fore-62); margin: 0 0 26px; }
.b-dayNames { font-size: 48px; font-weight: 600; line-height: 1.02; letter-spacing: -0.035em; color: var(--fore); margin: 0 0 16px; }
[data-medium="sheet"] .b-dayNames, [data-medium="full"] .b-dayNames { font-size: 96px; }
.b-dayDate { font-size: 20px; line-height: 1.4; color: var(--fore-72); margin: 0 0 40px; }
.b-dayRule { height: 1px; background: var(--accent); margin: 0 auto 24px; max-width: 200px; }
.b-dayNote { font-size: 15px; line-height: 1.6; color: var(--fore-62); margin: 0; }

/* ── ended ────────────────────────────────────────────────────────  */
.b-ended { padding: 72px 22px 80px; }
[data-medium="sheet"] .b-ended, [data-medium="full"] .b-ended { padding: 110px 56px 120px; }
.b-endedTitle { font-size: 30px; font-weight: 600; line-height: 1.12; letter-spacing: -0.025em; color: var(--fore); margin: 0 0 14px; }
.b-endedBody { font-size: 17px; line-height: 1.55; color: var(--fore-62); margin: 0 0 24px; max-width: 40ch; }

/* ── loading ──────────────────────────────────────────────────────
   The measure cannot be drawn before the dates arrive: a skeleton with
   invented tick positions would be a picture of a plan that does not
   exist. So the frame reserves the horizon at its real height and says
   plainly that the rest is coming. */
.b-skel { background: var(--fore-10); border-radius: 4px; }

/* ═══ the ground decision ═════════════════════════════════════════
   This direction was drawn on ink and the operator light-lock says
   Signal Studio surfaces are light. Rather than argue that in prose, the
   ground is a named decision with two ratified values, and both are
   built. `ink` is the direction as designed: a link opened in the
   evening on a phone, where a white page is a flashlight. `paper` is the
   same composition inverted — the measure, the horizon, the proportions
   and the type all survive the flip; what it loses is the black card
   that stops a thumb in a chat app.

   There is no block of overrides here on purpose. Everything in this
   file is written against --fore and --back (shell.css), so the ground
   decision is the nine-line ladder flip and nothing else. Print forces
   paper, because you cannot hand somebody an ink page off a home
   printer, and that is the one impossibility this direction admits.

   Two things stay literal whatever the ground is, and they are marked
   where they appear: the chat app the unfurl card lands in, which is
   somebody else's light surface, and the card's own metadata rows. */

/* ═══ the spacing decision ════════════════════════════════════════
   `measured` is the thesis: a pixel is a real unit of time, so the
   fortnight of nothing before the menu tasting is a fortnight of nothing
   on the screen. `even` sets the same items at one rhythm and is here
   because the honest cost of `measured` is holes, and the panel should
   be able to look at both rather than take the lab's word for it. The
   renderer computes both; only one is ever laid out. */
[data-spacing="even"] .b-measure { height: auto !important; }
/* relative, not static: the count and the tick are positioned against the
   item, and a static item hands them the measure as their containing
   block instead — which puts every tick on top of the first one. */
[data-spacing="even"] .b-item { position: relative; left: auto; right: auto; top: auto !important; margin: 0 0 26px; }
[data-spacing="even"] .b-item:last-child { margin-bottom: 0; }
[data-spacing="even"] .b-item[data-anchor="true"] { margin-top: 34px; }
/* ── print ────────────────────────────────────────────────────────
   The one place this direction inverts. Stated, not hidden. */
/* Print is no longer a colour special case — it is the ground decision,
   forced. What it does still own is its own measure: A4 is 1123px and
   fixed, so the type steps down one and the scale steps down with it.
   Proportion between one gap and the next is untouched. */
.b-print { padding: 56px 64px 44px; line-height: 1.5; }
.b-print .b-title { font-size: 17px; }
.b-print .b-away { font-size: 15px; }
.b-print .b-two { display: grid; gap: 40px; }
@media (min-width: 901px) {
  .b-print .b-two { grid-template-columns: 280px minmax(0, 1fr); align-items: start; }
}
