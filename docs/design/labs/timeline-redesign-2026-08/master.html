  border-radius: 6px;
  background: var(--ink-04);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink);
  overflow: hidden;
}
.a-link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-pressActs { display: flex; flex-wrap: wrap; gap: 10px; }
.a-note { font-size: 13px; line-height: 1.55; color: var(--ink-62); margin: 0; }

/* ── the empty sheet ──────────────────────────────────────────────
   One instruction, once. Everything else on this screen is a
   consequence of answering it. */
.a-empty { padding: 64px 22px 72px; }
[data-medium="sheet"] .a-empty, [data-medium="full"] .a-empty { padding: 96px 64px 104px; }
.a-emptyRule { height: 1px; background: var(--ink-16); margin: 0 0 26px; }
.a-emptyTitle { font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.025em; margin: 0 0 10px; }
[data-medium="sheet"] .a-emptyTitle, [data-medium="full"] .a-emptyTitle { font-size: 48px; }
.a-emptyBody { font-size: 17px; line-height: 1.5; color: var(--ink-72); margin: 0 0 26px; max-width: 34ch; }
.a-emptyForm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.a-emptyLater { margin: 30px 0 0; font-size: 13px; line-height: 1.55; color: var(--ink-62); }

/* ── the day ──────────────────────────────────────────────────────
   On the morning itself the sheet stops being a plan. Everything on it
   has happened except one line, so the sheet says that and gets out of
   the way. */
.a-dayMast { text-align: center; padding: 40px 0 30px; border-bottom: 1px solid var(--ink-16); }
.a-dayKicker {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 18px;
}
.a-dayNames { font-size: 38px; font-weight: 600; line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 12px; }
[data-medium="sheet"] .a-dayNames, [data-medium="full"] .a-dayNames { font-size: 64px; }
.a-dayDate { font-size: 17px; line-height: 1.4; color: var(--ink-72); margin: 0; }
.a-dayLine { padding: 30px 0; text-align: center; }
.a-dayLineTitle { font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 8px; }
.a-dayLineNote { font-size: 15px; line-height: 1.5; color: var(--ink-72); margin: 0; }

/* ── the unfurl card ──────────────────────────────────────────────
   The first impression is an image nobody has opened yet. For a printed
   programme the honest card is the head of the sheet, torn off. */
.a-chat { padding: 24px 16px; background: var(--ink-06); }
.a-bubble {
  max-width: 300px;
  margin: 0 0 10px;
  padding: 10px 12px;
  border-radius: 16px;
  background: var(--paper);
  border: 1px solid var(--ink-10);
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
}
.a-unfurl {
  max-width: 300px;
  border: 1px solid var(--ink-16);
  border-radius: 12px;
  overflow: hidden;
  background: var(--paper);
}
.a-og {
  aspect-ratio: 1200 / 630;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-bottom: 1px solid var(--ink-16);
  line-height: 1.4;
}
.a-ogNames { font-size: 24px; font-weight: 600; line-height: 1.1; letter-spacing: -0.025em; margin: 0 0 6px; }
.a-ogDate {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-62);
  margin: 0;
}
.a-ogRule { height: 1px; background: var(--ink-16); margin: 12px 0; }
.a-ogDays {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.4;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink);
  margin: 0;
}
.a-unfurlMeta { padding: 10px 12px; }
.a-unfurlTitle { font-size: 14px; font-weight: 600; line-height: 1.35; margin: 0 0 3px; }
.a-unfurlHost { font-size: 12px; line-height: 1.4; color: var(--ink-62); margin: 0; }

/* ── ended ────────────────────────────────────────────────────────
   A dead link is still a surface someone is standing on. It states what
   happened, keeps what is still true, and offers the one move left. */
.a-ended { padding: 56px 22px 60px; }
[data-medium="sheet"] .a-ended, [data-medium="full"] .a-ended { padding: 88px 64px 92px; }
.a-endedTitle { font-size: 27px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px; }
.a-endedBody { font-size: 17px; line-height: 1.5; color: var(--ink-72); margin: 0 0 26px; max-width: 40ch; }

/* ── loading ──────────────────────────────────────────────────────
   The frame promises exactly what will arrive: a masthead, the groups
   this plan actually has, one row apiece. No shimmer, no invented
   sections, no second row of a group that will only ever have one. */
.a-skel { background: var(--ink-06); border-radius: 4px; }
.a-skelRow {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 0 14px;
  padding: 11px 0;
  border-bottom: 1px solid var(--ink-06);
}
[data-medium="sheet"] .a-skelRow, [data-medium="full"] .a-skelRow {
  grid-template-columns: 118px 1fr;
  padding: 14px 0;
}

/* ══ b.css ══════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════
   DIRECTION B · THE APPROACH

   Thesis: the artifact does not exist to inform, it exists to make a day
   feel like it is coming. So the organising object is not a list, it is
   a DISTANCE. One vertical measure where a pixel is a real unit of time:
   two weeks apart looks two weeks apart, and the seven days between the
   menu tasting and the invitations look exactly half of it. The day is a
   horizon that never moves. Everything else approaches it.

   The ground is ink. This is the direction that argues with the operator
   light-lock, deliberately and on the record (see DIRECTIONS.md §B). The
   argument: a wedding link is opened in the evening, on a phone, in bed,
   and a white page at that moment is a flashlight. The print state
   inverts, because you cannot hand someone a black page off a home
   printer, and that inversion is the one impossibility this direction
   admits.

   Contrast discipline: on ink, paper at 0.46 is the lowest alpha any
   text may use (4.65:1). Indigo on ink is 2.99:1, so in this direction
   indigo NEVER sets type — it is a rule and a mark, nothing else. That
   constraint is what stops the accent becoming wallpaper here.
   ═══════════════════════════════════════════════════════════════════ */

[data-v="b"] { --focus: var(--paper); --page-wash: var(--ink); }

.b-field {
  background: var(--ink);
  color: var(--paper);
  padding: 26px 22px 30px;
  line-height: 1.5;
}
[data-medium="sheet"] .b-field, [data-medium="full"] .b-field { padding: 48px 56px 56px; }

/* ── the horizon ──────────────────────────────────────────────────
   Whose day, how far, which day. In that order, because on a phone in
   a dark room the number is what the eye lands on and the number is
   useless without the two facts beside it. */
.b-who {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-62);
  margin: 0 0 22px;
}
.b-count { display: flex; align-items: baseline; gap: 12px; margin: 0 0 10px; }
.b-num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 96px;
  line-height: 0.86;
  letter-spacing: -0.045em;
  color: var(--paper);
}
[data-medium="sheet"] .b-num, [data-medium="full"] .b-num { font-size: 148px; }
.b-unit {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.4;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--paper-62);
}
.b-when {
  font-size: 20px;
  font-weight: 400;
  line-height: 1.3;
  letter-spacing: -0.015em;
  color: var(--paper);
  margin: 0 0 4px;
}
[data-medium="sheet"] .b-when, [data-medium="full"] .b-when { font-size: 27px; }
.b-sub { font-size: 15px; line-height: 1.5; color: var(--paper-62); margin: 0; }

/* Today is the one thing indigo is spent on at the top of the page: a
   full-bleed hairline the whole surface hangs from. */
.b-todayRule {
  height: 1px;
  background: var(--accent);
  margin: 26px 0 0;
}
.b-todayLabel {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--paper-62);
  margin: 8px 0 0;
}
/* The first real gap on the measure is a fortnight of nothing, and a
   fortnight of nothing is a fact worth saying out loud rather than a
   hole for the reader to wonder about. */
.b-gapNote { font-size: 15px; line-height: 1.5; color: var(--paper-62); margin: 14px 0 0; }

/* ── the measure ──────────────────────────────────────────────────
   A pixel is nine days divided by nine: --px-per-day is the only number
   in this file that decides composition, and every position below is
   computed from the real dates through it. Nothing here is hand-placed,
   so nothing here can lie about how far away something is. */
.b-measure {
  position: relative;
  margin: 14px 0 0;
  padding: 0 0 0 96px;   /* 62 for the count, a 34px lane, then the rail */
  line-height: 1.5;
}
[data-medium="sheet"] .b-measure, [data-medium="full"] .b-measure { padding-left: 124px; }
/* The column header is what lets the count column be a bare number.
   One label, once, and every figure under it has one grammar. */
.b-measureHead {
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.4;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--paper-62);
  margin: 22px 0 0;
  width: 62px;
  text-align: right;
}
[data-medium="sheet"] .b-measureHead, [data-medium="full"] .b-measureHead { width: 84px; }
.b-rail {
  position: absolute;
  left: 76px;
  top: 6px;
  bottom: 0;
  width: 1px;
  background: var(--paper-16);
}
[data-medium="sheet"] .b-rail, [data-medium="full"] .b-rail { left: 100px; }

.b-item { position: absolute; left: 96px; right: 0; line-height: 1.5; }
[data-medium="sheet"] .b-item, [data-medium="full"] .b-item { left: 124px; }
.b-away {
  position: absolute;
  left: -96px;
  top: 2px;
  width: 62px;
  text-align: right;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 15px;
  line-height: 1.4;
  color: var(--paper-72);
}
[data-medium="sheet"] .b-away, [data-medium="full"] .b-away { left: -124px; width: 84px; font-size: 17px; }
.b-tick {
  position: absolute;
  left: -23px;
  top: 6px;
  width: 7px;
  height: 7px;
  border-radius: 999px;
  border: 1px solid var(--paper-46);
  background: var(--ink);
}
[data-medium="sheet"] .b-tick, [data-medium="full"] .b-tick { left: -27px; }
/* Titles are allowed two lines and no more, and the scale above is set
   so two lines still cannot collide with the item below. The clamp is
   word-safe and keeps the whole string in the accessible name. */
.b-title {
  font-size: 18px;
  font-weight: 400;
  line-height: 1.3;
  letter-spacing: -0.015em;
  color: var(--paper);
  margin: 0 0 3px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
[data-medium="sheet"] .b-title, [data-medium="full"] .b-title { font-size: 24px; }
.b-date {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.5;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--paper-62);
  margin: 0;
}

/* The next thing is the only item that gets the accent, and it gets it
   as a filled mark. Filled means "this one", and it is the only filled
   mark on the surface. */
.b-item[data-lead="true"] .b-tick { background: var(--accent); border-color: var(--accent); width: 9px; height: 9px; left: -24px; top: 5px; }
[data-medium="sheet"] .b-item[data-lead="true"] .b-tick,
[data-medium="full"] .b-item[data-lead="true"] .b-tick { left: -28px; }
.b-item[data-lead="true"] .b-away { color: var(--paper); }
.b-item[data-lead="true"] .b-title { font-weight: 600; }

/* The day itself is the horizon the measure ends on: a wider rule right
   across the surface, so the eye can see where it is going. */
.b-item[data-anchor="true"] .b-title { font-weight: 600; }
.b-item[data-anchor="true"]::before {
  content: "";
  position: absolute;
  left: -23px;
  right: 0;
  top: -16px;
  height: 1px;
  background: var(--paper-28);
}
[data-medium="sheet"] .b-item[data-anchor="true"]::before,
[data-medium="full"] .b-item[data-anchor="true"]::before { left: -27px; }

/* ── behind you ───────────────────────────────────────────────────
   The past is not deleted and it is not given equal weight. It sits
   under the measure, stated in a sentence, and opens if anyone wants
   it. Two things that already happened do not deserve a third of a
   phone screen. */
.b-behind {
  margin: 40px 0 0;
  padding: 20px 0 0;
  border-top: 1px solid var(--paper-16);
  line-height: 1.5;
}
.b-behindLabel {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--paper-62);
  margin: 0 0 10px;
}
.b-behindRow { display: flex; gap: 14px; align-items: baseline; padding: 8px 0; line-height: 1.5; }
.b-behindDate {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 11px;
  line-height: 1.6;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--paper-46);
  width: 76px;
  flex: none;
}
.b-behindTitle { font-size: 15px; line-height: 1.5; color: var(--paper-72); margin: 0; }
.b-behindTitle[data-cancelled="true"] { text-decoration: line-through; text-decoration-color: var(--paper-28); }
.b-behindNote { font-size: 15px; line-height: 1.5; color: var(--paper-62); margin: 0; }
[data-past="folded"] .b-behindRow { display: none; }
[data-past="folded"] .b-behindNote { display: block; }
[data-past="listed"] .b-behindNote { display: none; }

/* accent=structure spends the indigo a second time, on the rail below
   today, so the eye can see which part of the measure is still ahead. */
[data-accent="structure"] .b-rail { background: var(--accent); opacity: 0.5; }

.b-foot {
  margin: 34px 0 0;
  padding: 16px 0 0;
  border-top: 1px solid var(--paper-16);
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.5;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--paper-62);
}

/* ── desk ─────────────────────────────────────────────────────────
   At desk width the horizon stops scrolling. The number and the day
   hold the left, the approach runs down the right, and the reader can
   see both at once — which is the one thing a phone cannot give them. */
.b-two { display: grid; gap: 32px; }
[data-medium="sheet"] .b-two { grid-template-columns: 300px minmax(0, 1fr); gap: 48px; align-items: start; }
[data-medium="full"] .b-two { grid-template-columns: 360px minmax(0, 1fr); gap: 64px; align-items: start; }
/* The horizon does not scroll away. The number is the reason the reader
   is on this page; losing it two screens down would be losing the page. */
.b-stick { position: sticky; top: 24px; }

/* ── owner chrome ─────────────────────────────────────────────────
   Same ground, one bar. The owner is standing in the same room as the
   guest; the difference is that the owner can move things. */
.b-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding: 0 0 16px;
  margin: 0 0 24px;
  border-bottom: 1px solid var(--paper-16);
}
.b-where {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.5;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--paper-62);
}
.b-switch {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 32px;
  padding: 4px 10px;
  border: 1px solid var(--paper-16);
  border-radius: 6px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--paper);
  transition: border-color var(--t-base) var(--ease);
}
.b-switch:hover { border-color: var(--paper-46); }
.b-switch span { font-family: var(--mono); font-size: 11px; line-height: 1.4; letter-spacing: 0.09em; color: var(--paper-62); }
.b-spacer { flex: 1 1 auto; }
.b-act {
  min-height: 32px;
  padding: 6px 12px;
  border: 1px solid var(--paper-16);
  border-radius: 6px;
  font-size: 14px;
  line-height: 1.4;
  color: var(--paper);
  transition: border-color var(--t-base) var(--ease), background-color var(--t-base) var(--ease);
}
.b-act:hover { border-color: var(--paper-46); background: var(--paper-06); }
.b-act[data-primary="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.b-act[data-primary="true"]:hover { background: var(--paper-90); }
.b-grab {
  min-height: 28px;
  padding: 0 8px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.5;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--paper-62);
  transition: background-color var(--t-base) var(--ease);
}
.b-grab:hover { background: var(--paper-06); }

/* ── the editor ───────────────────────────────────────────────────
   The date control moves the item ON the measure while you hold it.
   That is the whole reason this direction puts editing here: changing a
   date is not filling in a field, it is moving something nearer. */
/* The editor floats above the measure rather than pushing it: on an
   absolutely-positioned measure, pushing would move every date under it,
   and a control that appears to move six other dates is a control
   nobody will touch. It gets an opaque ground so nothing reads through. */
.b-item[data-editing="true"] { z-index: 2; }
.b-edit {
  position: relative;
  z-index: 2;
  background: var(--ink);
  margin: 12px 0 0;
  padding: 16px;
  border: 1px solid var(--paper-16);
  border-radius: 8px;
  background: var(--paper-06);
  display: grid;
  gap: 12px;
  line-height: 1.5;
}
.b-label {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--paper-62);
}
.b-input {
  width: 100%;
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid var(--paper-28);
  border-radius: 6px;
  background: var(--ink);
  color: var(--paper);
  font-size: 17px;
  line-height: 1.4;
}
.b-input[data-mono="true"] { font-family: var(--mono); font-size: 15px; letter-spacing: 0.04em; }
.b-stepRow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.b-step {
  min-width: 40px;
  min-height: 40px;
  border: 1px solid var(--paper-28);
  border-radius: 6px;
  color: var(--paper);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.4;
  text-align: center;
  transition: background-color var(--t-base) var(--ease);
}
.b-step:hover { background: var(--paper-06); }
.b-stepRead {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: 0.06em;
  color: var(--paper);
}
.b-seg { display: inline-flex; border: 1px solid var(--paper-28); border-radius: 6px; overflow: hidden; }
.b-seg button {
  min-height: 34px;
  padding: 6px 12px;
  font-size: 14px;
  line-height: 1.4;
  color: var(--paper-72);
  transition: background-color var(--t-base) var(--ease), color var(--t-base) var(--ease);
}
.b-seg button + button { border-left: 1px solid var(--paper-28); }
.b-seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
.b-editActs { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.b-undo {
  margin: 20px 0 0;
  padding: 10px 12px;
  border: 1px solid var(--paper-16);
  border-radius: 6px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  font-size: 14px;
  line-height: 1.5;
  color: var(--paper-72);
}
.b-undo button {
  min-height: 28px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 14px;
  line-height: 1.5;
  color: var(--paper);
  text-decoration: underline;
  text-decoration-color: var(--paper-28);
  text-underline-offset: 3px;
}
.b-undo kbd { font-family: var(--mono); font-size: 11px; line-height: 1.4; color: var(--paper-62); }

/* ── the empty field ──────────────────────────────────────────────
   Nothing is further away than a day with no date. One question. */
.b-empty { padding: 80px 22px 90px; }
[data-medium="sheet"] .b-empty, [data-medium="full"] .b-empty { padding: 120px 56px 130px; }
.b-emptyTitle { font-size: 38px; font-weight: 600; line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 12px; color: var(--paper); }
[data-medium="sheet"] .b-emptyTitle, [data-medium="full"] .b-emptyTitle { font-size: 64px; }
.b-emptyBody { font-size: 17px; line-height: 1.5; color: var(--paper-62); margin: 0 0 28px; max-width: 34ch; }
.b-emptyForm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ── publish ──────────────────────────────────────────────────────
   The ceremony is not a form. It is the card itself, held up, before
   anyone has seen it. */
.b-press { display: grid; gap: 28px; }
[data-medium="full"] .b-press { grid-template-columns: 320px minmax(0, 1fr); gap: 64px; align-items: start; }
.b-pressTitle { font-size: 38px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; margin: 0 0 12px; color: var(--paper); }
[data-medium="full"] .b-pressTitle { font-size: 48px; }
.b-pressBody { font-size: 17px; line-height: 1.55; color: var(--paper-62); margin: 0 0 20px; max-width: 46ch; }
.b-linkRow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--paper-16);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
  color: var(--paper);
  overflow: hidden;
  margin: 0 0 16px;
}
.b-linkRow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-note { font-size: 13px; line-height: 1.55; color: var(--paper-62); margin: 16px 0 0; }

/* ── the card, as it lands in a chat ──────────────────────────────
   A black card in a white chat app is the whole first impression, and
   it is the strongest argument this direction has. */
/* A chat app is a light surface. On an ink-grounded direction the chat
   ground has to be opaque paper, or the tint composites over black and
   the card is being shown in a room that does not exist. */
.b-chat { padding: 24px 16px; background: var(--paper); }
.b-bubble {
  max-width: 300px;
  margin: 0 0 10px;
  padding: 10px 12px;
  border-radius: 16px;
  background: var(--ink-06);
  border: 1px solid var(--ink-10);
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
}
.b-unfurl { max-width: 300px; border: 1px solid var(--ink-16); border-radius: 12px; overflow: hidden; background: var(--paper); }
.b-og {
  aspect-ratio: 1200 / 630;
  background: var(--ink);
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  line-height: 1.4;
}
.b-ogWho { font-family: var(--mono); font-size: 10px; line-height: 1.4; letter-spacing: 0.2em; text-transform: uppercase; color: var(--paper-62); margin: 0; }
.b-ogNum { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 48px; line-height: 0.9; letter-spacing: -0.04em; color: var(--paper); margin: 0; }
.b-ogDate { font-family: var(--mono); font-size: 10px; line-height: 1.4; letter-spacing: 0.13em; text-transform: uppercase; color: var(--paper-62); margin: 6px 0 0; }
.b-unfurlMeta { padding: 10px 12px; }
.b-unfurlTitle { font-size: 14px; font-weight: 600; line-height: 1.35; margin: 0 0 3px; color: var(--ink); }
.b-unfurlHost { font-size: 12px; line-height: 1.4; color: var(--ink-62); margin: 0; }

/* ── the day ──────────────────────────────────────────────────────
   The number reaches zero, and a number that reads 0 is a worse
   sentence than the word. The measure has nothing left to measure, so
   it goes. */
.b-dayWrap { padding: 80px 22px 90px; text-align: center; }
[data-medium="sheet"] .b-dayWrap, [data-medium="full"] .b-dayWrap { padding: 130px 56px 140px; }
.b-dayToday { font-family: var(--mono); font-size: 12px; line-height: 1.4; letter-spacing: 0.3em; text-transform: uppercase; color: var(--paper-62); margin: 0 0 26px; }
.b-dayNames { font-size: 48px; font-weight: 600; line-height: 1.02; letter-spacing: -0.035em; color: var(--paper); margin: 0 0 16px; }
[data-medium="sheet"] .b-dayNames, [data-medium="full"] .b-dayNames { font-size: 96px; }
.b-dayDate { font-size: 20px; line-height: 1.4; color: var(--paper-72); margin: 0 0 40px; }
.b-dayRule { height: 1px; background: var(--accent); margin: 0 auto 24px; max-width: 200px; }
.b-dayNote { font-size: 15px; line-height: 1.6; color: var(--paper-62); margin: 0; }

/* ── ended ────────────────────────────────────────────────────────  */
.b-ended { padding: 72px 22px 80px; }
[data-medium="sheet"] .b-ended, [data-medium="full"] .b-ended { padding: 110px 56px 120px; }
.b-endedTitle { font-size: 30px; font-weight: 600; line-height: 1.12; letter-spacing: -0.025em; color: var(--paper); margin: 0 0 14px; }
.b-endedBody { font-size: 17px; line-height: 1.55; color: var(--paper-62); margin: 0 0 24px; max-width: 40ch; }

/* ── loading ──────────────────────────────────────────────────────
   The measure cannot be drawn before the dates arrive: a skeleton with
   invented tick positions would be a picture of a plan that does not
   exist. So the frame reserves the horizon at its real height and says
   plainly that the rest is coming. */
.b-skel { background: var(--paper-10); border-radius: 4px; }

/* ── print ────────────────────────────────────────────────────────
   The one place this direction inverts. Stated, not hidden. */
.b-print { background: var(--paper); color: var(--ink); padding: 56px 64px 44px; line-height: 1.5; }
.b-print .b-who { color: var(--ink-62); }
.b-print .b-num, .b-print .b-when, .b-print .b-title, .b-print .b-dayNames { color: var(--ink); }
.b-print .b-unit, .b-print .b-sub, .b-print .b-date, .b-print .b-behindLabel, .b-print .b-foot { color: var(--ink-62); }
.b-print .b-rail { background: var(--ink-16); }
.b-print .b-tick { border-color: var(--ink-46); background: var(--paper); }
.b-print .b-item[data-lead="true"] .b-tick { background: var(--accent); border-color: var(--accent); }
.b-print .b-away { color: var(--ink-62); }
.b-print .b-behind { border-top-color: var(--ink-16); }
.b-print .b-behindDate { color: var(--ink-62); }
.b-print .b-behindTitle, .b-print .b-behindNote { color: var(--ink-72); }
.b-print .b-foot { border-top-color: var(--ink-16); }
.b-print .b-todayRule { background: var(--accent); }
.b-print .b-todayLabel { color: var(--ink-62); }
.b-print .b-item[data-anchor="true"]::before { background: var(--ink-28); }

/* ══ c.css ══════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════
   DIRECTION C · THE ANSWER

   Thesis: a guest opening this link once, on a phone, while doing
   something else, is not reading a plan. They are asking one question —
   what is next, and when is the day — and everything else on the screen
   is in the way of the answer. So the artifact leads with the ANSWER,
   full bleed, and the plan lives underneath it for anyone who wants it.

   The material argument: the accent stops being a mark and becomes a
   surface. One indigo field, once, in the whole product, carrying the
   one thing that is next. Nowhere else in Signal Studio is allowed to
   use indigo as a ground after this. That is either the strongest use
   of an accent in the three directions or the one that breaks the
   register, and the panel should say which.

   What it sacrifices: scannability of the whole plan at a glance, and
   the owner has to trust that a guest will scroll. If a guest never
   scrolls, this direction has decided that is fine.

   Contrast discipline on the indigo field: white is 6.3:1 and passes at
   every size; white at 0.90 is 5.4:1 and passes; white at 0.72 is
   3.98:1 and does NOT, so it never sets type here. On paper the ink
   ladder from Direction A applies unchanged.
   ═══════════════════════════════════════════════════════════════════ */

[data-v="c"] { --focus: var(--ink); --page-wash: var(--ink-04); }

/* ── the answer ───────────────────────────────────────────────────  */
.c-answer {
  background: var(--accent);
  color: var(--paper);
  padding: 40px 24px 32px;
  display: flex;
  flex-direction: column;
  gap: 30px;
  min-height: 560px;
  line-height: 1.5;
}
[data-medium="sheet"] .c-answer, [data-medium="full"] .c-answer {
  padding: 56px 64px 48px;
  min-height: 0;
}
.c-who {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-90);
  margin: 0;
}
.c-label {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-90);
  margin: 0 0 14px;
}
.c-headline {
  font-size: 34px;
  font-weight: 600;
  line-height: 1.06;
  letter-spacing: -0.03em;
  color: var(--paper);
  margin: 0 0 14px;
}
[data-medium="sheet"] .c-headline, [data-medium="full"] .c-headline { font-size: 64px; }
.c-line { font-size: 17px; line-height: 1.45; color: var(--paper); margin: 0; }
[data-medium="sheet"] .c-line, [data-medium="full"] .c-line { font-size: 20px; }
.c-lineQuiet { font-size: 17px; line-height: 1.45; color: var(--paper-90); margin: 4px 0 0; }
.c-answerBody { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; }
.c-rule { height: 1px; background: var(--paper-28); }

/* The day is the second fact on the card and it never moves: a guest who
   only ever reads this one surface still leaves knowing the date. */
.c-dayBlock { display: grid; gap: 6px; }
.c-dayLabel {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-90);
  margin: 0;
}
.c-dayValue { font-size: 24px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; color: var(--paper); margin: 0; }
[data-medium="sheet"] .c-dayValue, [data-medium="full"] .c-dayValue { font-size: 30px; }
.c-dayAway {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  line-height: 1.5;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--paper-90);
  margin: 0;
}

/* The way down. It is a real control with a real name, at the bottom
   edge where a thumb already is, and it says how much is under it —
   because "there is more" without a number is a guess. */
.c-more {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 48px;
  padding: 12px 0 0;
  border-top: 1px solid var(--paper-28);
  font-size: 15px;
  line-height: 1.5;
  color: var(--paper);
  width: 100%;
}
.c-more span:last-child {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--paper-90);
}

/* ── the plan underneath ──────────────────────────────────────────  */
.c-plan { background: var(--paper); color: var(--ink); padding: 30px 24px 28px; line-height: 1.5; }
[data-medium="sheet"] .c-plan, [data-medium="full"] .c-plan { padding: 48px 64px 44px; }
.c-planLabel {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-62);
  margin: 0 0 4px;
}
.c-planNote { font-size: 15px; line-height: 1.55; color: var(--ink-72); margin: 0 0 20px; }
/* One column, always. A two-column plan orphans its own condition
   headings — "Coming up" printed above nothing while its rows sit in
   the other column — and that was worth losing the density for. */
.c-planGrid { display: grid; gap: 0; max-width: 720px; }
.c-planRow {
  display: grid;
  grid-template-columns: 96px 1fr;
  gap: 0 14px;
  align-items: baseline;
  padding: 11px 0;
  border-bottom: 1px solid var(--ink-06);
  line-height: 1.5;
}
.c-planDate {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  line-height: 1.6;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-62);
  white-space: nowrap;
}
.c-planTitle { font-size: 16px; line-height: 1.35; color: var(--ink); margin: 0; }
.c-planRow[data-state="covered"] .c-planTitle { color: var(--ink-72); }
.c-planRow[data-state="cancelled"] .c-planTitle {
  color: var(--ink-72);
  text-decoration: line-through;
  text-decoration-color: var(--ink-28);
}
.c-planRow[data-lead="true"] .c-planTitle { font-weight: 600; }
.c-planRow[data-lead="true"] .c-planDate { color: var(--ink); }
/* The one mark the plan carries: the row the answer above is about. A
   guest who scrolls should be able to find their place in one look. */
.c-planRow[data-lead="true"] { border-bottom-color: var(--ink-16); box-shadow: inset 3px 0 0 var(--accent); padding-left: 12px; }
.c-planGrid .c-planRow[data-lead="true"] { margin-left: -12px; }
.c-planCondition {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-62);
  margin: 22px 0 8px;
  padding: 0 0 8px;
  border-bottom: 1px solid var(--ink-16);
}
.c-planCondition:first-child { margin-top: 0; }
[data-past="folded"] .c-planRow[data-past="true"] { display: none; }
[data-past="folded"] .c-planFold { display: block; }
.c-planFold { display: none; font-size: 15px; line-height: 1.5; color: var(--ink-72); padding: 11px 0 0; }
[data-accent="structure"] .c-planTodayRule {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  padding: 10px 0 2px;
}
.c-planTodayRule { display: none; }
[data-accent="structure"] .c-planTodayRule::after { content: ""; flex: 1; height: 1px; background: var(--accent); }

.c-foot {
  margin: 26px 0 0;
  padding: 14px 0 0;
  border-top: 1px solid var(--ink-16);
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.5;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-62);
}

/* ── owner chrome ─────────────────────────────────────────────────
   The owner is never shown a version of the plan the guest does not
   get. The answer card sits on the left at real phone width, live, and
   the plan the owner edits is on the right. Editing a row changes the
   card while you look at it, which is the only feedback that matters:
   what will they see first. */
.c-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding: 0 0 16px;
  margin: 0 0 24px;
  border-bottom: 1px solid var(--ink-16);
}
.c-where {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.5;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-62);
}
.c-switch {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 32px;
  padding: 4px 10px;
  border: 1px solid var(--ink-16);
  border-radius: 6px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.4;
  background: var(--paper);
  transition: border-color var(--t-base) var(--ease);
}
.c-switch:hover { border-color: var(--ink-28); }
.c-switch span { font-family: var(--mono); font-size: 11px; line-height: 1.4; letter-spacing: 0.08em; color: var(--ink-62); }
.c-spacer { flex: 1 1 auto; }
.c-act {
  min-height: 32px;
  padding: 6px 12px;
  border: 1px solid var(--ink-16);
  border-radius: 6px;
  font-size: 14px;
  line-height: 1.4;
  color: var(--ink);
  background: var(--paper);
  transition: border-color var(--t-base) var(--ease), background-color var(--t-base) var(--ease);
}
.c-act:hover { border-color: var(--ink-28); background: var(--ink-04); }
.c-act[data-primary="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.c-act[data-primary="true"]:hover { background: var(--ink-90); }

.c-studio { display: grid; gap: 28px; }
[data-medium="full"] .c-studio { grid-template-columns: 390px minmax(0, 1fr); gap: 56px; align-items: start; }
.c-preview { border: 1px solid var(--ink-16); border-radius: 16px; overflow: hidden; }
.c-previewLabel {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-62);
  margin: 0 0 10px;
}
.c-editorHead { font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 6px; }
.c-editorNote { font-size: 15px; line-height: 1.55; color: var(--ink-72); margin: 0 0 20px; }

.c-ownerRow { grid-template-columns: 96px 1fr auto; }
.c-vis {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-62);
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  padding: 0 6px;

}
.c-vis:hover { background: var(--ink-06); }

.c-edit {
  grid-column: 1 / -1;
  margin: 10px 0 2px;
  padding: 16px;
  background: var(--ink-04);
  border: 1px solid var(--ink-16);
  border-radius: 8px;
  display: grid;
  gap: 12px;
  line-height: 1.5;
}
.c-label2 {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-62);
}
.c-input {
  width: 100%;
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid var(--ink-28);
  border-radius: 6px;
  background: var(--paper);
  font-size: 17px;
  line-height: 1.4;
  color: var(--ink);
}
.c-input[data-mono="true"] { font-family: var(--mono); font-size: 15px; letter-spacing: 0.04em; }
.c-seg { display: inline-flex; border: 1px solid var(--ink-28); border-radius: 6px; overflow: hidden; }
.c-seg button {
  min-height: 34px;
  padding: 6px 12px;
  font-size: 14px;
  line-height: 1.4;
  color: var(--ink-72);
  background: var(--paper);

.c-seg button + button { border-left: 1px solid var(--ink-28); }
.c-seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.c-editActs { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.c-undo {
  margin: 18px 0 0;
  padding: 10px 12px;
  border: 1px solid var(--ink-16);
  border-radius: 6px;
  background: var(--paper);

  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  font-size: 14px;

}
.c-undo button {
  min-height: 28px;

.c-undo kbd { font-family: var(--mono); font-size: 11px; line-height: 1.4; color: var(--ink-62); }

/* ── empty ────────────────────────────────────────────────────────
   An answer card with no answer in it. The card is still there, because
   the card is the product: the owner is filling in what a guest will
   read, not filling in a database. */
.c-empty { background: var(--accent); color: var(--paper); padding: 48px 24px 40px; min-height: 460px; display: flex; flex-direction: column; justify-content: center; line-height: 1.5; }
.c-emptyTitle { font-size: 34px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; color: var(--paper); margin: 0 0 12px; }
.c-emptyBody { font-size: 17px; line-height: 1.5; color: var(--paper-90); margin: 0 0 26px; }
.c-emptyInput {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--paper-46);
  border-radius: 6px;
  background: var(--accent);
  color: var(--paper);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.4;
}
.c-emptyAct {
  min-height: 44px;
  margin: 12px 0 0;
  padding: 10px 16px;
  border-radius: 6px;
  background: var(--paper);
  color: var(--accent);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.4;
}

/* ── publish ──────────────────────────────────────────────────────  */
.c-press { display: grid; gap: 28px; }
[data-medium="full"] .c-press { grid-template-columns: 390px minmax(0, 1fr); gap: 56px; align-items: start; }
.c-pressTitle { font-size: 38px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; margin: 0 0 12px; }
[data-medium="full"] .c-pressTitle { font-size: 48px; }
.c-pressBody { font-size: 17px; line-height: 1.55; color: var(--ink-72); margin: 0 0 20px; max-width: 46ch; }
.c-linkRow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--ink-16);
  border-radius: 6px;
  background: var(--ink-04);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink);
  overflow: hidden;
  margin: 0 0 16px;
}
.c-linkRow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-note { font-size: 13px; line-height: 1.55; color: var(--ink-62); margin: 16px 0 0; }

/* ── unfurl ───────────────────────────────────────────────────────  */
.c-chat { padding: 24px 16px; background: var(--ink-06); }
.c-bubble {
  max-width: 300px;
  margin: 0 0 10px;
  padding: 10px 12px;
  border-radius: 16px;
