/* ═══════════════════════════════════════════════════════════════════
   DIRECTION B · THE APPROACH

   Thesis: the artifact does not exist to inform, it exists to make a day
   feel like it is coming. So the organising object is a DISTANCE, not a
   list: one vertical measure on which a pixel is a real unit of time.

   Three structural rules this file keeps, all paid for by the panel:

   1. THE PHONE IS THE BASE. Every value here is the phone value and the
      desk values live inside @media (min-width: 701px). Written the
      other way round, a media query adds no specificity, so fifteen
      phone declarations never applied at any width.

      --back (shell.css), so the ground decision is a nine-line ladder
      flip and print — which forces paper — comes out of the same
      mechanism.

      in shell.css is size-bound, and applying it by hand left 24px sans
      rendering at two different letterfits and eight prose blocks with
      no tracking at all. A size that appears without its step is a bug.

   (4.65:1) and indigo never sets a word (2.99:1); on paper, ink at 0.62
   is the floor (5.34:1) and 0.46 is 3.1:1 and sets nothing at all.
   ═══════════════════════════════════════════════════════════════════ */

[data-ground="paper"] { --focus: var(--accent); --page-wash: var(--ink-04); }

/* ── the horizon ──────────────────────────────────────────────────
   Whose day, how far, which day. In that order, because on a phone in
   a dark room the number is what the eye lands on and the number is
   useless without the two facts beside it. */
/* The size step is already the ceremonial one; the ink was the
   machine's. The one owner-written string on the page now carries full
   ink, which is how this palette makes hierarchy - and the count keeps
   every size it had, so round 2's ruling stands. */
.b-who {
  font-family: var(--mono);
  font-size: var(--size-labelWide);
  font-weight: 400;
  line-height: var(--lead-label);
  letter-spacing: var(--track-labelWide);
  text-transform: uppercase;
  color: var(--fore);
  margin: 0 0 var(--gap-item);
}
/* The publish screen's own captions are the machine speaking. */

.b-count { display: flex; align-items: baseline; gap: var(--gap-snug); margin: 0 0 var(--gap-snug); }
.b-num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--size-count);
  line-height: var(--lead-display);
  letter-spacing: var(--track-display-96);
  color: var(--fore);
  /* Optical, not mathematical: the mono numeral carries about 0.05em of
     side bearing, so the largest object on the page was the only thing
     hanging out of the one column this layout has. */
  margin-left: -0.05em;
}
.b-unit {

  font-size: var(--size-label);

/* From 701 to 1279 the field is one wide track, and the single indigo
   mark on the owner's screen ran the full 1068px of it - reading as a

  /* The count is a readout of the row, so it travels with the words it
     names. A transform rather than a margin: this element is absolutely
     positioned, so a margin would resolve against the containing block
     and the number would stay put.
     Deliberately NOT transitioned. The row's own top is animated
     because position is the quantity; the push is collision avoidance,
     not a quantity, and .b-copy takes it as an untransitioned margin.
     Giving the count a duration the words do not have put the pair 8px
     apart for the length of every move - the same defect this fix
     exists to remove, wearing a nicer easing. They move as one object
     or they are not one object. */
  transform: translateY(var(--push, 0px));
}
.b-tick {
  position: absolute;
  left: -23px;
  top: 6px;
  width: 7px;
  height: 7px;
  border-radius: 999px;
  border: 1px solid var(--fore-46);
  background: var(--back);
}
/* The TICK sits on the true pixel, always, because the tick is the
   position. The count is a label on the words and goes with them; when
   the two are more than a hair apart a leader says which mark belongs to
   which row, drawn as a brighter stretch of the rail itself rather than
   a second line beside it - the rail-to-copy gutter is 20px and a
   vertical of up to 157px standing in it reads as a second rail. */
.b-item[data-crowded="true"]::after {
  content: "";
  position: absolute;
  left: -20px;
  top: 9px;
  width: 1px;
  height: var(--push, 0px);
  background: linear-gradient(to bottom, var(--fore-46), var(--fore-16));
  pointer-events: none;
}
[data-medium="sheet"] .b-item[data-crowded="true"]::after,
[data-medium="full"] .b-item[data-crowded="true"]::after { left: -24px; }
/* The leader is geometry, and a forced palette may repaint a fill but
   cannot flatten it. It says nothing a reader has not already been
   told in words, so it never reaches the accessibility tree. */
@media (forced-colors: active) {
  .b-item[data-crowded="true"]::after { background: CanvasText; }
}
/* Bound to the track, the wash behind a moment ran 944px at 1279 and
   544px at 1280 - a selection whose width was an accident of the
   window. */
.b-copy {
  max-width: 544px; margin-top: var(--push, 0px); position: relative; }
/* The row BOX is not a target; the things drawn inside it are. .b-item
   is pinned to its true pixel while --push moves its words clear, so a
   crowded row's empty upper band lay across the row above it and, being
   later in the DOM, swallowed that row's Edit control - one press of -7
   to put two moments on a day and the earlier row stopped answering the
   pointer at every width. Unscoped deliberately: push is written by
   script after layout, and a rule keyed on [data-crowded] could fall
   out of step with it. */
.b-item { pointer-events: none; }
.b-item .b-copy, .b-item .b-away, .b-item .b-tick { pointer-events: auto; }/* A guest row carries no control, so a trimmed title's remainder can
   be reached by nobody: the screen reader gets the whole sentence and
   the finger gets an ellipsis. Only the owner's rows, which open, may
   trim. */
[data-state="phone"] .b-title,
[data-state="desk"] .b-title,
[data-state="day"] .b-title,
[data-state="print"] .b-title {
  -webkit-line-clamp: none;
  overflow: visible;
}

.b-title {
  font-size: var(--size-lead);
  font-weight: 400;
  line-height: var(--lead-head);
  letter-spacing: var(--track-body);
  color: var(--fore);
  margin: 0 0 3px;
  text-wrap: balance;
  /* A safety net only. The word-safe trim in render-core.js decides the
     break; this stops a pre-settle frame spilling a third line. */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.b-date {
  font-family: var(--mono);
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
  margin: 0;
}

/* The next thing is the only item that gets the accent, as a filled
   mark. Filled means "this one", and it is the only filled mark here. */
.b-item[data-lead="true"] .b-tick {
  background: var(--accent);
  border-color: var(--accent);
  width: 9px;
  height: 9px;
  left: -24px;
  top: 5px;
}
.b-item[data-lead="true"] .b-away { color: var(--fore); }
.b-item[data-lead="true"] .b-title { font-weight: 600; }
.b-item[data-anchor="true"] .b-title { font-weight: 600; }
.b-item[data-anchor="true"]::before {
  content: "";
  position: absolute;
  left: -23px;
  right: 0;
  top: -16px;
  height: 1px;
  background: var(--fore-28);
}

/* ── two moments on one day ───────────────────────────────────────
   A real wedding holds several things on one date. One mark, one count,
   the rows stacked under it and divided by a hairline — done by
   attribute, never by re-parenting, because moving the subtree that
   holds the focused stepper kills the gesture for a keyboard user.
   visibility, not display, so nothing reflows and the row is still
   found by every query that looks for it. */
.b-item[data-stack="follow"] .b-away,
.b-item[data-stack="follow"] .b-tick { visibility: hidden; }
.b-item[data-stack="follow"] .b-copy {
  border-top: 1px solid var(--fore-16);
  padding-top: var(--gap-snug);
}
.b-item[data-stack="lead"] .b-copy { padding-bottom: var(--gap-snug); }

/* A moment guests will never see is drawn one rung quieter. 0.62, not
   0.46: over paper 0.46 is 3.1:1 and sets nothing. Status by ink
   density and fill, never by hue. */
.b-item[data-visibility="hidden"] .b-title,
.b-item[data-visibility="hidden"] .b-date,
.b-item[data-visibility="hidden"] .b-away { color: var(--fore-62); }
.b-item[data-visibility="hidden"] .b-title { font-weight: 400; }
.b-item[data-visibility="hidden"] .b-tick { border-style: dashed; }

/* ── the row as a control ─────────────────────────────────────────
   The badge stays the visible mark and its hit area covers the row, so
   the thing that looks like the object is the thing you can press. */
.b-grab {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  padding: 0 var(--gap-tight);
  margin-left: calc(-1 * var(--gap-tight));
  margin-top: 4px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
  /* A hairline underline is what declares it a control at rest. Dropping
     its ink instead would make the only pressable thing in the row the
     dimmest text on it. */
  text-decoration: underline;
  text-decoration-color: var(--fore-16);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  transition: background-color var(--t-base) var(--ease), color var(--t-base) var(--ease);
}
.b-item:not([data-editing="true"]) .b-grab::after { content: ""; position: absolute; inset: 0; }
.b-item:hover .b-grab, .b-item:focus-within .b-grab {
  color: var(--fore);
  background: var(--fore-06);
  text-decoration-color: var(--fore-46);
}
/* Only a row that OPENS may answer the pointer. The guest surfaces -
   the screens the company is judged by - drew a halo under every row,
   none of which carries a control or does anything when pressed, so the
   one place the product promises nothing was the place it promised
   most. :focus-within is already dead on a guest row; :hover and
   :active were the whole lie. */
.b-item:has(.b-grab):hover .b-copy, .b-item:has(.b-grab):focus-within .b-copy {
  background: var(--fore-04);
  box-shadow: 0 0 0 12px var(--fore-04);
  border-radius: 4px;
  transition: background-color var(--t-fast) var(--ease);
}
.b-item[data-crowded="true"] .b-copy { box-shadow: 0 0 0 12px var(--back); background: var(--back); border-radius: 4px; }
.b-item[data-editing="true"] .b-copy {
  box-shadow: 0 0 0 12px var(--fore-06);
  background: var(--fore-06);
  border-radius: 4px;
}

/* ── behind you ───────────────────────────────────────────────────
   Stated in a sentence, listed in full if asked for — and the asking is
   a control the reader has, not a console knob. The sentence closes the
   block: opening with it meant the last thing a guest read on the
   wedding morning was a cancelled hotel search. */
/* One rhythm for every rule-topped section: forty above the rule,
   twenty under it. It was declared here and then broken by the footer
   on every state and by the morning's live block, so three siblings on
   the same screen stood at 70, 40 and 34. */
.b-behind { margin: var(--gap-section) 0 0; padding: var(--gap-item) 0 0; border-top: 1px solid var(--fore-16); line-height: var(--lead-body); }
.b-behindSummary {
  display: flex;
  align-items: baseline;
  gap: var(--gap-snug);
  /* 44px is the floor for a thing a thumb presses, and this is the only
     control a guest is given. The negative margin lets the pressable
     band run the full width of the measure without moving the text. */
  min-height: 44px;
  padding: var(--gap-tight);
  margin: 0 calc(-1 * var(--gap-tight));
  border-radius: 4px;
  cursor: pointer;
  list-style: none;
  transition: background var(--t-fast) var(--ease);
}
.b-behindSummary::-webkit-details-marker { display: none; }
/* Drawn the way the row control is drawn, because it IS a control: a
   hairline under the words at rest, the same tint behind them on hover.
   Set identically to the inert section captions, nobody pressed it. */
.b-behindSummary .b-behindLabel {
  border-bottom: 1px solid var(--fore-16);
  padding-bottom: 2px;
}
.b-behindSummary:hover { background: var(--fore-06); }
.b-behindSummary:hover .b-behindLabel { border-bottom-color: var(--fore-46); }
/* Open and closed said in type, in the mono label register, at full
   strength so the mark separates from the label beside it. */
.b-behindSummary::after {
  content: "+";
  font-family: var(--mono);
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  color: var(--fore);
  margin-left: auto;
}
.b-behindDetails[open] .b-behindSummary::after { content: "\2212"; }
.b-behindLabel {
  font-family: var(--mono);
  font-weight: 400;
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
  margin: 0;
}
.b-behindCount {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
}
.b-behindDetails[open] .b-behindCount { color: var(--fore); }
/* The state stays in words on the row. The control beside it names the
   action it performs instead, because SHOWN was a status word sitting
   where a status badge sits, on a button that opened an editor. */
.b-hiddenMark {
  font-family: var(--mono);
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
  margin: var(--gap-tight) 0 0;
}
.b-item[data-visibility="shown"] .b-hiddenMark { display: none; }
/* Where the past is listed in full there is no disclosure at all, so
   the heading and the count are a plain head rather than the inside of
   a control. Same metrics, no affordance. */
.b-behindHead {
  display: flex;
  align-items: baseline;
  gap: var(--gap-snug);
  min-height: 44px;
  padding: var(--gap-tight) 0;
}
.b-behindHead .b-behindCount { color: var(--fore); }
.b-behindRows { padding: var(--gap-tight) 0 0; }
/* A cancelled row has no date, and the empty lane went on reserving
   96px, so the machine's status label took 125px while the couple's own
   words were starved to 96 and broke to a one-word second line. */
.b-behindRow { display: flex; flex-wrap: wrap; gap: var(--gap-snug) var(--gap-line); align-items: baseline; padding: var(--gap-tight) 0; line-height: var(--lead-body); }
.b-behindDate:empty { display: none; }
.b-behindDate {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
  /* 96, not 76: SAT 22 AUG is 84px at this letterfit, so every
     two-digit day was breaking the weekday off its own date. nowrap
     makes a future overrun a visible collision the gate can catch
     rather than a silent second line. */
  width: 96px;
  white-space: nowrap;
  flex: none;
}
.b-behindTitle { font-size: var(--size-body); line-height: var(--lead-body); letter-spacing: var(--track-body); color: var(--fore-72); margin: 0; min-width: 0; }
.b-behindTitle[data-cancelled="true"] { text-decoration: line-through; text-decoration-color: var(--fore-28); }
/* A line drawn through 15px text at 28% is not a statement. The row
   says what it is, in the label register, and the accessible name gets
   it for free because it is text in the row. */
.b-behindState {
  font-family: var(--mono);
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
  margin-left: auto;
  flex: none;
}
.b-behindNote {
  font-size: var(--size-body);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore-62);
  margin: var(--gap-snug) 0 0;
  max-width: 46ch;
  text-wrap: balance;
}
/* The record room asks for everything at once, and print must never
   put a collapsed control on paper. */
/* display: block on a child of a CLOSED <details> does nothing -
   Chromium hides the content through ::details-content, so the two
   rules that used to sit here were inert and the record room showed
   LESS of the past than the room that folds it. The disclosure is now
   opened in the DOM by the renderer, and this rule only takes away a
   control nobody needs once it is open. */
[data-past="listed"] .b-behindSummary { display: none; }
/* One closing at a time. Where the rows are on screen the sentence
   restated a title twelve pixels above it; where they are folded the
   sentence is the only account of the past there is. */
.b-behindNote[data-when="open"] { display: none; }
.b-behindDetails[open] ~ .b-behindNote[data-when="folded"] { display: none; }
.b-behindDetails[open] ~ .b-behindNote[data-when="open"] { display: block; }
[data-past="listed"] .b-behindNote[data-when="folded"] { display: none; }
[data-past="listed"] .b-behindNote[data-when="open"] { display: block; }

/* The past on the wedding morning, in the product's own language: the
   same rail, the same ticks, the same mono date beside the person's
   words, running downward from today into the closed months at two
   pixels a day. Quieter than what is ahead, and carrying no accent -
   nothing behind you is the next thing. */
.b-backWrap { margin: var(--gap-item) 0 0; }
.b-back { margin-top: var(--gap-tight); }
.b-back .b-tick { border-color: var(--fore-28); }
.b-back .b-item[data-lead="true"] .b-tick {
  background: var(--back);
  border-color: var(--fore-28);
  width: 7px;
  height: 7px;
  left: -23px;
  top: 6px;
}
.b-back .b-item[data-lead="true"] .b-away { color: var(--fore-62); }
.b-back .b-item[data-lead="true"] .b-title { font-weight: 400; }
.b-back .b-item[data-anchor="true"] .b-title { font-weight: 400; }
.b-back .b-item[data-anchor="true"]::before { display: none; }
.b-back .b-away { color: var(--fore-62); }
.b-back .b-title { color: var(--fore-72); }
/* Anything with no date at all cannot stand on a measure of days, so
   it is stated under it rather than placed at a distance that would be
   a guess. */
.b-behindOff { margin: var(--gap-line) 0 0; }
.b-behindOffRow {
  font-size: var(--size-body);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore-62);
  margin: 0;
}

/* accent=structure spends the indigo a second time, on the rail. */
[data-accent="structure"] .b-rail { background: var(--accent); opacity: 0.5; }

/* The page opens on a full-measure rule and has to close on one. */
.b-foot {
  overflow-wrap: anywhere;
  margin: var(--gap-section) 0 0;
  padding: var(--gap-item) 0 0;
  border-top: 1px solid var(--fore-16);
  display: flex;
  flex-wrap: wrap;
  gap: var(--gap-hair) var(--gap-item);
  justify-content: space-between;
  font-family: var(--mono);
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
}

.b-two { display: grid; gap: var(--gap-block); }

/* ── owner chrome ─────────────────────────────────────────────────
   Stacked on a phone, a row where there is room. */
.b-bar {
  display: grid;
  justify-items: start;
  gap: var(--gap-control);
  padding: 0 0 var(--gap-line);
  margin: 0 0 var(--gap-item);
  border-bottom: 1px solid var(--fore-16);
}
.b-bar .b-spacer { display: none; }
.b-bar .b-barActs { display: flex; width: 100%; gap: var(--gap-tight); }
.b-bar .b-barActs .b-act { flex: 0 1 auto; justify-content: center; text-align: center; min-width: 0; }
.b-where {
  font-family: var(--mono);
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
}
/* Text, not a pill. It carried the same border colour, radius and
   height band as .b-act and sat beside three real buttons drawn
   identically, so the bar read as four controls of which one was dead -
   and on the 390 stack the false one sat 43px above the three true
   ones. Stripped of the chrome it reads as what it is: the place, then
   the project, then the actions. */
.b-switch {
  display: inline-flex;
  align-items: baseline;
  gap: var(--gap-tight);
  font-size: var(--size-body);
  font-weight: 600;
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore);
}
.b-switch span {
  font-family: var(--mono);
  /* 400, explicitly. It inherited 600 from .b-switch and there is no
     Geist Mono 600 file, so the browser synthesised one - a fourth face
     in a system the lock caps at three. The gate checked families and
     weights on separate lists and so could not see the pair. Zero
     visual cost: the advance is byte-identical at both weights. */
  font-weight: 400;
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
}
.b-spacer { flex: 1 1 auto; }
.b-barActs { display: flex; gap: var(--gap-control); flex-wrap: wrap; align-items: center; line-height: var(--lead-body); }
.b-act {
  min-height: 32px;
  padding: var(--gap-tight) var(--gap-snug);
  border: 1px solid var(--fore-16);
  border-radius: 6px;
  font-size: var(--size-body);
  line-height: var(--lead-label);
  letter-spacing: var(--track-body);
  color: var(--fore);
  transition: border-color var(--t-base) var(--ease), background-color var(--t-base) var(--ease);
}
.b-act:hover { border-color: var(--fore-46); background: var(--fore-06); }
.b-act[data-primary="true"] { background: var(--fore); color: var(--back); border-color: var(--fore); }
.b-act[data-primary="true"]:hover { background: var(--fore-90); }
/* Not built is not a button. A focusable promise is worse than silence. */
.b-inert {
  font-family: var(--mono);
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
}
/* The way back out of a preview, outside the artifact it is previewing,
   so what a guest gets is untouched. */
.b-previewStrip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap-snug);
  padding: 0 0 var(--gap-line);
  margin: 0 0 var(--gap-line);
  border-bottom: 1px solid var(--fore-16);
}
/* Written against the FORE ladder, not against ink: on the ink ground
   the literal painted #111 on #111 and the owner's only way back out of
   the preview was invisible. */
.b-previewStrip .b-where { color: var(--fore-62); }
.b-previewStrip .b-act { color: var(--fore); border-color: var(--fore-16); }

/* On a phone there is no hover, so until now the primary gesture had
   no answer at all until the sheet arrived - and the only thing marking
   a press was the browser's own tap highlight, an unowned fourth hue
   nobody chose. State here is ink density, so a press is one step
   denser than a hover. Declared AFTER the hover rules, or equal
   specificity loses. */
.b-grab,
.b-act,
.b-step,
.b-behindSummary,
.b-undoAct { -webkit-tap-highlight-color: transparent; }
/* Press is scoped the same way, and given the ring its plate always
   had: a pressed row used to paint a 10% plate inside a 4% halo. */
.b-item:has(.b-grab):active .b-copy { background: var(--fore-10); box-shadow: 0 0 0 12px var(--fore-10); }
.b-grab:active { background: var(--fore-10); }
.b-act:active,
.b-step:active,
.b-behindSummary:active,
.b-undoAct:active { background: var(--fore-10); }
.b-act[data-primary="true"]:active { background: var(--fore-72); }

/* ── the editor ───────────────────────────────────────────────────
   Opaque, and beside the plan rather than over it: in the rail at desk
   width, a sheet on the bottom edge below that. Reserving a gutter
   inside the measure column starved the titles to 144px; hanging the
   panel off the item took the button you were pressing with it. */
.b-edit {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  z-index: 3;
  max-height: 72dvh;
  overflow-y: auto;
  padding: var(--gap-line);
  border: 1px solid var(--fore-28);
  border-radius: 8px;
  background-color: var(--back);
  background-image: linear-gradient(var(--fore-06), var(--fore-06));
  display: grid;
  gap: var(--gap-snug);
  line-height: var(--lead-body);
}
.b-edit:focus-visible { outline-offset: -2px; }
.b-editHost:empty { display: none; }
.b-label {
  font-family: var(--mono);
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
}
.b-input {
  width: 100%;
  min-height: 40px;
  padding: var(--gap-tight) var(--gap-snug);
  border: 1px solid var(--fore-28);
  border-radius: 6px;
  background: var(--back);
  color: var(--fore);
  font-size: var(--size-lead);
  line-height: var(--lead-label);
  letter-spacing: var(--track-body);
}
/* Declared, not inherited, and at 0.62 — the user-agent grey is 3.1:1
   on the paper ground and the placeholder was the only statement of the
   date format on the screen. */
.b-input::placeholder { color: var(--fore-62); opacity: 1; }
.b-input[aria-invalid="true"] { border-color: var(--fore); }
.b-input[data-mono="true"] { font-family: var(--mono); font-size: var(--size-body); letter-spacing: var(--track-data); }
.b-hint {
  font-size: var(--size-data);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore-62);
  margin: var(--gap-snug) 0 0;
  min-height: 20px;
}

.b-stepRow { display: grid; gap: var(--gap-control); }
.b-stepBtns { display: flex; align-items: center; gap: var(--gap-control); flex-wrap: wrap; }
.b-step {
  min-width: 44px;
  min-height: 40px;
  border: 1px solid var(--fore-28);
  border-radius: 6px;
  color: var(--fore);
  font-family: var(--mono);
  font-size: var(--size-body);
  line-height: var(--lead-label);
  letter-spacing: var(--track-data);
  text-align: center;
  transition: background-color var(--t-base) var(--ease);
}
.b-step:hover { background: var(--fore-06); }
/* 0.62, not 0.46: on the paper ground 0.46 is 3.1:1. */
.b-step[aria-disabled="true"] { color: var(--fore-62); border-color: var(--fore-16); }
.b-stepRead {
  text-wrap: balance;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--size-body);
  line-height: var(--lead-label);
  letter-spacing: var(--track-data);
  color: var(--fore);
  /* Two lines reserved. Unreserved, the first press collapsed it from
     45px to 23px and moved every control below it by 22px. */
  min-height: 45px;
}
.b-ceiling {
  font-size: var(--size-data);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore-62);
  margin: 0;
  min-height: 20px;
  max-width: 46ch;
}
/* No overflow clip: the buttons fill this plate edge to edge, so a
   focus ring drawn outside a button landed inside the clip and was
   never painted at all - the visibility control had no visible focus
   for a keyboard owner. The corners move to the children instead; 5px
   matches the plate, because 5 is not a step on the declared radii
   ladder and the ladder is a mechanical lock, not a preference. */
.b-seg { display: inline-flex; border: 1px solid var(--fore-28); border-radius: 6px; }
.b-seg button:first-child { border-radius: 6px 0 0 6px; }
.b-seg button:last-child { border-radius: 0 6px 6px 0; }
.b-seg button {
  min-height: 34px;
  padding: var(--gap-tight) var(--gap-snug);
  font-size: var(--size-body);
  line-height: var(--lead-label);
  letter-spacing: var(--track-body);
  color: var(--fore-72);
  transition: background-color var(--t-base) var(--ease), color var(--t-base) var(--ease);
}
.b-seg button + button { border-left: 1px solid var(--fore-28); }
.b-seg button[aria-pressed="true"] { background: var(--fore); color: var(--back); }
.b-editActs { display: flex; gap: var(--gap-control); align-items: center; flex-wrap: wrap; }
/* On its own line, after a rule. It sat ten pixels to the right of the
   safe action at two and a half times its width. Separated, not hidden:
   deleting a moment from a draft is ordinary editing, and in a palette
   with no red, position is what carries consequence. */
.b-editDanger { padding: var(--gap-snug) 0 0; border-top: 1px solid var(--fore-16); }
/* The one destructive control on the surface. Its indent is reserved
   at rest and the border grows outward, so the label cannot jump
   sideways under the arriving cursor - and the keyboard gets exactly
   what the pointer gets, which it did not. */
.b-editDanger .b-act {
  border-color: transparent;
  color: var(--fore-72);
  padding-left: var(--gap-snug);
  margin-left: calc(var(--gap-snug) * -1);
}
.b-editDanger .b-act:hover,
.b-editDanger .b-act:focus-visible { border-color: var(--fore-46); color: var(--fore); }

/* One reversibility surface, one node, and it travels to wherever the
   change is being made. It used to render a thousand pixels below the
   button that filled it. */
.b-undo {
  margin: var(--gap-item) 0 0;
  padding: var(--gap-snug) var(--gap-snug);
  border: 1px solid var(--fore-16);
  border-radius: 6px;
  background-color: var(--back);
  display: flex;
  flex-wrap: wrap;
  gap: var(--gap-tight) var(--gap-line);
  align-items: center;
  font-size: var(--size-body);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore-72);
}
.b-undo[data-empty="true"] { display: none; }
/* Inside the panel the bar is taken out of the flow and its band is
   reserved at the top, so filling it — or growing to a second line —
   cannot move the stepper the owner is about to press again. Round 1
   paid for those buttons holding still under the pointer. */
/* No position here: the base rule is already position: fixed, which is
   a positioned ancestor for the bar below, and re-declaring it as
   relative silently turned the phone sheet back into a block in flow. */
/* 88, measured: the bar's bottom edge sits 85px below the panel top
   when it wraps to two lines. */
.b-edit { padding-top: 88px; }  /* off-ladder: measure geometry */
.b-edit .b-undo {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  margin: 0;
  border: 0;
  border-bottom: 1px solid var(--fore-16);
  border-radius: 0;
  padding: 0 0 var(--gap-snug);
  min-height: 50px;
  align-items: flex-start;
}
.b-edit .b-undo[data-empty="true"] { display: flex; visibility: hidden; }
.b-undoAct {
  min-height: 28px;
  padding: 2px var(--gap-tight);
  border-radius: 4px;
  font-size: var(--size-body);
  /* The leading its six sibling controls carry. This stood at 1.5
     against their 1.4 and no gate could reach it: the bar is invisible
     in every state the measured audit used to visit. The owner-undone
     state put it inside the perimeter and this was the first thing the
     perimeter found. */
  line-height: var(--lead-label);
  letter-spacing: var(--track-body);
  color: var(--fore);
  text-decoration: underline;
  text-decoration-color: var(--fore-28);
  text-underline-offset: 3px;
}
/* The keycap joins the data register its six neighbours were moved to
   in round 6. It was the one string left on the section-head letterfit
   while sitting in sentence case, which is a setting that exists
   nowhere else in the product - and it sat where the measured gate has
   never been able to look, because the bar is invisible in all twelve
   states the audit visits. */
.b-undo kbd { font-family: var(--mono); font-size: var(--size-label); line-height: var(--lead-label); letter-spacing: var(--track-data); color: var(--fore-62); }

/* ── the empty field ──────────────────────────────────────────────  */
.b-empty { padding: var(--gap-major) 0 var(--gap-major); }
.b-emptyTitle {
  font-size: var(--size-titleWide);
  font-weight: 600;
  line-height: var(--lead-title);
  letter-spacing: var(--track-head);
  color: var(--fore);
  margin: 0 0 var(--gap-snug);
  text-wrap: balance;
}
/* balance, not pretty: pretty only suppresses a widow and never
   evens the rag, so these two- and three-line leads ragged 381/226,
   481/220 and 326/140. Every one of them is four lines or fewer,
   which is exactly where balance applies. The print gap note stays
   pretty - it is one line and balance would do nothing. */
.b-emptyBody {
  font-size: var(--size-lead);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore-62);
  margin: 0 0 var(--gap-block);
  max-width: 34ch;
  text-wrap: balance;
}
.b-emptyForm { display: flex; flex-wrap: wrap; gap: var(--gap-control); align-items: center; }

/* ── publish ──────────────────────────────────────────────────────  */
.b-press { display: grid; gap: var(--gap-block); }
/* A 43-character share token cannot shrink, so every box between it and
   the grid has to be told it may be narrower than its contents. */
.b-press > * { min-width: 0; }
.b-pressTitle {
  font-size: var(--size-titleWide);
  font-weight: 600;
  line-height: var(--lead-title);
  letter-spacing: var(--track-head);
  color: var(--fore);
  margin: 0 0 var(--gap-snug);
  text-wrap: balance;
}
.b-pressBody {
  font-size: var(--size-lead);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore-62);
  margin: 0 0 var(--gap-item);
  max-width: 46ch;
  text-wrap: balance;
}
.b-linkRow {
  display: flex;
  align-items: center;
  gap: var(--gap-control);
  min-width: 0;
  padding: var(--gap-snug) var(--gap-snug);
  border: 1px solid var(--fore-16);
  border-radius: 6px;
  font-family: var(--mono);
  /* 13, not 12: the ladder is size-bound, and 12 is the ceremonial
     label step. A share token is data and takes the data step. */
  font-size: var(--size-data);
  line-height: var(--lead-body);
  letter-spacing: var(--track-data);
  color: var(--fore);
  overflow: hidden;
  margin: 0 0 var(--gap-line);
}
.b-linkRow .b-linkField {
  display: block;
  min-width: 0;
  min-height: 28px;
  padding: var(--gap-hair) 0;
  flex: 1 1 auto;
  overflow-wrap: anywhere;
  border-radius: 4px;
  cursor: text;
}
/* The selection is a system colour, and this palette does not admit
   one. */
::selection { background: var(--fore-16); color: var(--fore); }
/* The owner's surface was byte-identical before and after publishing,
   so nothing ever told them people were holding a copy of the plan they
   were still editing. */
.b-shared {
  font-size: var(--size-data);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore-62);
  margin: 0 0 var(--gap-item);
}
.b-live {
  font-size: var(--size-data);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore);
  margin: var(--gap-snug) 0 0;
  min-height: 20px;
}
.b-note {
  font-size: var(--size-data);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore-62);
  margin: var(--gap-tight) 0 0;
  max-width: 52ch;
  text-wrap: balance;
}

/* ── the card, as it lands in a chat ──────────────────────────────
   LITERAL, not laddered: the chat app is somebody else's surface and it
   is light whatever ground we chose. */
/* On the owner's own screen the chat plate needs an edge, or on the
   paper ground it is a white card on a white field. */
.b-chat { padding: var(--gap-block) var(--gap-line); background: var(--paper); }
.b-chatPlate { border: 1px solid var(--fore-16); border-radius: 12px; }
.b-bubble {
  max-width: 300px;
  margin: 0 0 var(--gap-snug);
  padding: var(--gap-snug) var(--gap-snug);
  border-radius: 16px;
  background: var(--ink-06);
  border: 1px solid var(--ink-10);
  font-size: var(--size-body);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--ink);
}
/* display: block, and it matters. An anchor is inline by default, so
   max-width does nothing, the background paints only around the line
   boxes and the border-radius paints nothing at all. */
.b-unfurl {
  display: block;
  max-width: 300px;
  border: 1px solid var(--ink-16);
  border-radius: 12px;
  overflow: hidden;
  background: var(--paper);
}
/* The card is rasterised and lands in somebody else's chat client, so
   it cannot follow this lab's ground decision: written against the
   ladder it painted white on white in the paper room and ink on ink on
   the publish screen. Fixed tokens, both on palette. */
.b-og {
  aspect-ratio: 1200 / 630;
  background: var(--ink);
  padding: var(--gap-item);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  line-height: var(--lead-label);
}
.b-ogWho {
  font-family: var(--mono);
  font-size: var(--size-labelWide);
  line-height: var(--lead-label);
  letter-spacing: var(--track-labelWide);
  text-transform: uppercase;
  color: var(--paper-62);
  margin: 0;
}
.b-ogNum {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--size-card);
  line-height: var(--lead-display);
  letter-spacing: var(--track-display-64);
  color: var(--paper);
  margin: 0 0 0 -0.05em;
}
/* The arrived card. Figures are mono, words are not - the same rule the
   morning follows. */
.b-ogWord {
  font-weight: 600;
  font-size: var(--size-card);
  line-height: var(--lead-display);
  letter-spacing: var(--track-display-64);
  color: var(--paper);
  margin: 0;
}
/* Sentence case, in the text face. As a second uppercase mono stamp it
   was the widest line on the card and the couple's own date read as a
   machine label. */
.b-ogDate {
  font-size: var(--size-body);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--paper-72);
  margin: var(--gap-hair) 0 0;
  text-wrap: balance;
}
.b-unfurlMeta { padding: var(--gap-snug) var(--gap-snug); }
.b-unfurlTitle { font-size: var(--size-body); font-weight: 600; line-height: var(--lead-body); letter-spacing: var(--track-body); margin: 0 0 3px; color: var(--ink); }
.b-unfurlHost { font-size: var(--size-labelWide); line-height: var(--lead-label); letter-spacing: var(--track-body); color: var(--ink-62); margin: 0; }

/* ── the day ──────────────────────────────────────────────────────
   The count is a countdown, and a countdown that has arrived is a word,
   not a zero — so the word takes the count's slot rather than being
   demoted to a micro-label while the couple's name is promoted into the
   display register. */
/* No second inset: the field already carries 22px, and doubling it set
   the masthead on a 300px measure inside a 344px page. */
.b-dayWrap { padding: var(--gap-major) 0 0; text-align: center; }
.b-dayWrap .b-who { margin: 0 0 var(--gap-item); }
/* Figures are mono; words are not. "Today" set in the code face opened
   on a monospaced T with a hole beside it and closed on a letterfit
   crushed for tabular figures. */
.b-dayCount {
  font-family: var(--sans);
  font-weight: 600;
  font-size: var(--size-count);
  line-height: var(--lead-display);
  letter-spacing: var(--track-dayCount);
  color: var(--fore);
  margin: 0 0 var(--gap-line);
}
.b-dayDate {
  font-size: var(--size-date);
  line-height: var(--lead-date);
  letter-spacing: var(--track-body);
  color: var(--fore);
  margin: 0 0 var(--gap-section);
  text-wrap: balance;
}
/* Was indigo, and was dividing nothing. The accent moved to the block
   below; what is left here is the same hairline every other section
   rule in the product is drawn with. */
.b-dayRule { height: 1px; background: var(--fore-16); margin: 0 auto var(--gap-block); width: 200px; }
/* A countdown that has run out is a sentence, not a negative number.
   It is set at the ceremonial step rather than the display step: there
   is nothing left to count. */
.b-passed {
  font-size: var(--size-title);
  font-weight: 600;
  line-height: var(--lead-head);
  letter-spacing: var(--track-head);
  color: var(--fore);
  margin: 0 0 var(--gap-snug);
  text-wrap: balance;
}
.b-dayNote {
  font-size: var(--size-body);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore-62);
  margin: 0;
  text-wrap: balance;
}
/* The morning's live block carries the one indigo on the screen. It
   used to be spent on a 200px hairline dividing two lines of the same
   block; a mark means something when it marks the thing that is
   happening. */
.b-dayNow {
  margin: var(--gap-section) 0 0;
  padding: var(--gap-item) 0 0;
  border-top: 1px solid var(--accent);
}
.b-dayNowTitle {
  font-size: var(--size-head);
  font-weight: 600;
  line-height: var(--lead-head);
  letter-spacing: var(--track-head);
  color: var(--fore);
  margin: var(--gap-tight) 0 0;
}

/* ── ended ────────────────────────────────────────────────────────  */
/* The field already carries the inset. Doubling it put the last screen
   a guest can see on a 300px measure inside a 344px page - the exact
   defect the morning above records as fixed. */
.b-ended { padding: var(--gap-major) 0 var(--gap-major); }
.b-endedTitle {
  font-size: var(--size-title);
  font-weight: 600;
  line-height: var(--lead-head);
  letter-spacing: var(--track-head);
  color: var(--fore);
  margin: 0 0 var(--gap-line);
  text-wrap: balance;
}
.b-endedBody {
  font-size: var(--size-lead);
  line-height: var(--lead-body);
  letter-spacing: var(--track-body);
  color: var(--fore-62);
  margin: 0 0 var(--gap-item);
  max-width: 40ch;
  text-wrap: balance;
}

/* ── loading ──────────────────────────────────────────────────────  */
.b-skel { background: var(--fore-10); border-radius: 4px; }

/* ── print ────────────────────────────────────────────────────────  */
/* A4 is a fixed physical artifact, so its column count must be a fact
   about the paper and not about the browser window that happened to
   preview it. Composed at 1024 and at 1440 this is now one document. */
/* A4 is 210 by 297 millimetres and the sheet is now told so. Without a
   @page rule the keepsake honoured A4's width and nothing else, so it
   printed as two sheets - the second carrying an orphaned rail stub, the
   link and the footer, naming neither the couple nor the day. */
@page { size: A4; margin: 0; }
@media print {
  /* The lab's own furniture is not part of the artifact, and its stage
     padding was leaking onto the paper - taking the sheet's content box
     under the threshold that gives it two columns, so the document that
     printed was never the document anyone reviewed. */
  .tl-page { padding: 0; }
  .tl-caption { display: none; }
  [data-medium="sheet"] .tl-stage { max-width: none; }
}
/* Nothing may be cut in half by the edge of a page. */
.b-print .b-item, .b-print .b-behindRow, .b-print .b-behind { break-inside: avoid; }
/* On paper the past column is 220px, and a wrapping flex row put its
   three rows on three different left edges. On the sheet the date sits
   on its own line above the title it dates; on screen the row stays as
   it is, where it is correct. */
.b-print .b-behindRow { display: block; }
.b-print .b-behindDate { display: block; width: auto; }
.b-print .b-behindState { display: block; margin-left: 0; }
.b-print { padding: var(--gap-block) var(--gap-item) var(--gap-block); line-height: var(--lead-body); container-type: inline-size; }
/* Set as data, at the data step, with the case left alone: the token is
   case-sensitive and the footer beside it is uppercase, so the only
   route back from paper used to be one nobody could type. */
.b-printLink { margin: var(--gap-section) 0 0; }
.b-printLinkLabel {
  font-family: var(--mono);
  font-size: var(--size-label);
  line-height: var(--lead-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fore-62);
  margin: 0 0 var(--gap-tight);
}
/* Broken where it can be read rather than where the box runs out: the
   token is case-sensitive and 43 characters long, and it used to wrap
   mid-string with nothing saying the line continued. */
.b-printLinkUrl {
  font-family: var(--mono);
  font-size: var(--size-data);
  line-height: var(--lead-body);
  letter-spacing: var(--track-data);
  text-transform: none;
  overflow-wrap: anywhere;
  word-break: break-all;
  color: var(--fore);
  margin: 0;
  max-width: 28ch;
}
.b-ownerField { padding-top: var(--gap-item); }
.b-ownerField .b-bar { margin-bottom: var(--gap-item); }
.b-ownerField .b-who { margin-bottom: var(--gap-line); }
.b-ownerField .b-count { margin-bottom: var(--gap-tight); }
.b-ownerField .b-todayRule { margin-top: var(--gap-item); }
.b-ownerField .b-todayLabel { margin-top: var(--gap-tight); }
.b-ownerField .b-gapNote { margin-top: var(--gap-snug); }
.b-ownerField .b-measure { margin-top: var(--gap-snug); }

@container (min-width: 600px) {
  .b-print .b-two { grid-template-columns: 220px minmax(0, 1fr); gap: var(--gap-section); align-items: start; }
}
.b-print .b-title { font-size: var(--size-lead); letter-spacing: var(--track-body); }

/* ═══ desk and up ═════════════════════════════════════════════════
   Everything above is the phone. These are the only rules that raise
   it, inside a min-width query so a narrow screen can never lose to
   them on specificity. Every raise carries its tracking. */
@media (min-width: 701px) {
  /* The desk has the room, so it keeps the air. */
  .b-ownerField { padding-top: var(--gap-section); }
  .b-ownerField .b-bar { margin-bottom: var(--gap-block); }
  .b-ownerField .b-who { margin-bottom: var(--gap-item); }
  .b-ownerField .b-count { margin-bottom: var(--gap-snug); }
  .b-ownerField .b-todayRule { margin-top: var(--gap-block); }
  .b-ownerField .b-todayLabel { margin-top: var(--gap-tight); }
  .b-ownerField .b-gapNote { margin-top: var(--gap-line); }
  .b-ownerField .b-measure { margin-top: var(--gap-line); }
  .b-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap-tight) var(--gap-line); }
  .b-bar .b-spacer { display: block; flex: 1 1 auto; }
  .b-bar .b-barActs { display: flex; width: auto; gap: var(--gap-control); }
  .b-bar .b-barActs .b-act[data-primary="true"] { grid-column: auto; }
  [data-medium="sheet"] .b-field, [data-medium="full"] .b-field { padding: var(--gap-section) var(--gap-major) var(--gap-major); }
  /* The size steps and the letterfit steps with it. Raising the count
     to 148 while leaving the 96px step on it meant the largest object
     in the product wore the wrong grade everywhere it matters most. */
  [data-medium="sheet"] .b-num, [data-medium="full"] .b-num {
    font-size: var(--size-countWide);
    letter-spacing: var(--track-display-148);
  }
  [data-medium="sheet"] .b-when, [data-medium="full"] .b-when { font-size: var(--size-title); letter-spacing: var(--track-head); }
  [data-medium="sheet"] .b-measure, [data-medium="full"] .b-measure { padding-left: 124px; }  /* off-ladder: measure geometry */
  [data-medium="sheet"] .b-measureHead, [data-medium="full"] .b-measureHead { width: 84px; }
  /* The 20px above this head is the only air between the gap note and
     the measure when the field is ONE track, so it is taken back only
     where the columns actually stand side by side - scoped to the
     column's own first block, because the head's parent is the wrapper
     measure() returns and at desk that wrapper carries no class. */
  [data-medium="full"] .b-two > * > *:first-child > .b-measureHead { margin-top: 0; }
  [data-medium="sheet"] .b-rail, [data-medium="full"] .b-rail { left: 100px; }
  [data-medium="sheet"] .b-item, [data-medium="full"] .b-item { left: 124px; }
  [data-medium="sheet"] .b-origin, [data-medium="full"] .b-origin { left: 124px; }
  [data-medium="sheet"] .b-away, [data-medium="full"] .b-away { left: -124px; width: 84px; font-size: var(--size-lead); }
  [data-medium="sheet"] .b-tick, [data-medium="full"] .b-tick { left: -27px; }
  [data-medium="sheet"] .b-origin::before, [data-medium="full"] .b-origin::before { left: -27px; }
  [data-medium="sheet"] .b-item[data-lead="true"] .b-tick,
  [data-medium="full"] .b-item[data-lead="true"] .b-tick { left: -28px; }
  [data-medium="sheet"] .b-item[data-anchor="true"]::before,
  [data-medium="full"] .b-item[data-anchor="true"]::before { left: -27px; }
  [data-medium="sheet"] .b-title, [data-medium="full"] .b-title { font-size: var(--size-head); letter-spacing: var(--track-head); }
  /* No side padding: the empty block is the only thing on the page and
     it used to be indented 56px from the very margin the bar above it
     and the foot below it stand on. */
  [data-medium="sheet"] .b-empty, [data-medium="full"] .b-empty { padding: 110px 0 120px; }  /* off-ladder: measure geometry */
  [data-medium="sheet"] .b-emptyTitle, [data-medium="full"] .b-emptyTitle { max-width: 20ch; }
  [data-medium="sheet"] .b-emptyTitle, [data-medium="full"] .b-emptyTitle { font-size: var(--size-card); letter-spacing: var(--track-title-64); }
  [data-medium="sheet"] .b-ended, [data-medium="full"] .b-ended { padding: 100px 56px 110px; }  /* off-ladder: measure geometry */
  [data-medium="sheet"] .b-dayWrap, [data-medium="full"] .b-dayWrap { padding: var(--gap-page) 0 0; }
  [data-medium="full"] .b-pressTitle { font-size: var(--size-figure); letter-spacing: var(--track-title-48); }
  /* Its own rule, at the same specificity as the field rule above and
     later in source, so the printed page keeps its own margins. */
  [data-medium="sheet"] .b-print { padding: var(--gap-section) var(--gap-major) var(--gap-major); }
  [data-medium="sheet"] .b-print .b-title { font-size: var(--size-lead); letter-spacing: var(--track-body); }
  /* The gutter figure keeps the phone step on paper, per the print
     comment above. Declared HERE because the base .b-print rule sat
     earlier in source at equal specificity and could never win. */
  [data-medium="sheet"] .b-print .b-away { font-size: var(--size-body); }
}

/* Below the gutter width the editor is a sheet on the bottom edge, and
   the reversibility bar rides the same edge when the sheet is closed,
   so the offer to take a change back is never off screen. */
/* The two-column composition begins at 1024, not 1280. It used to start
   only at desk width, so every 13-inch laptop - 1024, 1100, 1152, 1279 -
   rendered the plan as the phone stack blown up: the rail at x=206,
   every title ending at 774, and 456px of empty field beside each row.
   It cost 371px of height across one pixel of window and put the first
   moment at y=941, below an 800px fold, so an owner opening their own
   plan on a laptop saw a counter, a gap note and an empty rail, and not
   one moment. The geometry is unchanged - 344px, 56px gutter, 124px
   count lane - because those are numbers a passing gate already
   measures; only the boundary moves, and its pair below moves with it,
   or the undo bar stays fixed to the bottom edge while the editor sits
   in the rail. */
@media (max-width: 1023px) {
  /* The editor is docked, not modal: the page may scroll under it. But
     the browser's own focus scrolling could park a control beneath it,
     so a keyboard owner pressed things they could not see. The scroll
     root is told how much of the bottom edge is spoken for. */
  /* max(), not a fallback chain: the two can co-exist - the bar is
     filled while the editor is open - and a chain silently drops
     whichever band is larger. */
  [data-editor-open], [data-undo="true"] {
    scroll-padding-bottom: max(var(--b-sheet, 0px), var(--b-undo, 0px), 30px);
  }
  /* Later in source and one selector heavier than the desk padding rule
     above, or the reserve loses to it at 768 and the last rows are
     stranded under the sheet with no scroll left to free them. */
  [data-medium] .b-field[data-editor-open],
  [data-medium] .b-field[data-undo="true"] {
    padding-bottom: max(var(--b-sheet, 0px), var(--b-undo, 0px), var(--gap-block));
  }
  [data-undo="true"] .b-undoHome .b-undo {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 12px;
    z-index: 4;
    margin: 0;
  }
  [data-undo="true"][data-editor-open] .b-edit { bottom: 76px; }
  /* The docked sheet is full-bleed and nothing inside it was capped, so
     every control inflated to the page: a date field holding
     "25 July 2026" drawn 1221px across at 1279, and a Shown/Hidden
     plate 1221px wide holding 142px of buttons at its left end. The
     docked edge is right - only the contents need a measure. The
     absolutely-positioned bar cannot take max-width alone, because it
     is stretched by its own left/right insets. */
  .b-edit { justify-items: start; }
  .b-edit > * { max-width: 480px; width: 100%; }
  .b-edit .b-undo { right: auto; width: min(480px, calc(100% - 32px)); max-width: none; }
  /* justify-self is what actually stops the stretch: the plate is
     already inline-flex and is being blockified as a grid item. */
  .b-edit .b-seg { justify-self: start; width: auto; }
}

@media (min-width: 1024px) {
  [data-medium="full"] .b-two { grid-template-columns: 344px minmax(0, 1fr); gap: var(--gap-major); align-items: start; }
  /* The owner's desk surface is two panes in a fixed frame, and the
     PAGE does not scroll at all. The lock says the horizon never moves
     at desk width; sticky alone let the rail drift 191px before it
     stuck, which is why a prior round rightly refused to scroll the
     window - and the moment being moved then walked off the bottom of
     the screen after two presses with the owner still pressing.
     Capping the plan alone was not enough: it handed the document's
     height to the rail, so opening and closing the editor changed the
     page height and the browser clamped the view out from under a
     delete. With the frame fixed, the height is constant, each column
     scrolls its own content, and nothing the hand rests on can move. */
  [data-medium="full"] .b-ownerField {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  [data-medium="full"] .b-ownerField .b-two {
    flex: 1 1 auto;
    min-height: 0;
    align-items: stretch;
  }
  [data-medium="full"] .b-ownerField .b-stick,
  [data-medium="full"] .b-plan {
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    /* A pane that can hide something says so at the edge that hides it.
       The mask is written by script only when there is actually
       something past the fold, so a fade always means content, never
       decoration. */
  }
  /* The gutter is reserved on the PLAN only. On the rail it would take
     ten pixels out of a column the lock fixes at 344, and the today
     rule is capped to that number and asserted at it - a ratified
     geometry is not something a scrollbar preference gets to move. */
  [data-medium="full"] .b-plan {
    scrollbar-gutter: stable;
    /* The browser scrolls a focused control flush to the pane edge -
       i.e. under the fade meant to say "this is on its way out". This
       stops focus inside the band. */
    scroll-padding-block: var(--gap-section);
  }
  [data-medium="full"] .b-ownerField .b-stick[data-fold="below"],
  [data-medium="full"] .b-plan[data-fold="below"] {
    mask-image: linear-gradient(to bottom, #000 calc(100% - 48px), transparent);
  }
  [data-medium="full"] .b-ownerField .b-stick[data-fold="above"],
  [data-medium="full"] .b-plan[data-fold="above"] {
    mask-image: linear-gradient(to bottom, transparent, #000 48px);
  }
  [data-medium="full"] .b-ownerField .b-stick[data-fold="both"],
  [data-medium="full"] .b-plan[data-fold="both"] {
    mask-image: linear-gradient(to bottom, transparent, #000 48px, #000 calc(100% - 48px), transparent);
  }
  [data-medium="full"] .b-press { grid-template-columns: 320px minmax(0, 1fr); gap: var(--gap-major); align-items: start; }
  /* The horizon does not scroll away — but only where it has a column
     of its own. */
  .b-stick { position: sticky; top: var(--gap-section); }
  /* In the rail, where there is a column already. */
  .b-editHost .b-edit {
    /* relative, not static: the reversibility bar inside is absolutely
       positioned and needs a positioned ancestor. With static it escaped
       to .b-stick and painted across the 148px count. inset: auto
       neutralises the base rule's fixed offsets, so the panel sits
       exactly where static put it. */
    position: relative;
    inset: auto;
    width: auto;
    max-height: none;
    overflow: visible;
    margin-top: var(--gap-block);
  }
}

/* Uppercase mono is now exclusive to SECTION HEADS. Twenty-seven of the
   thirty-two uppercase strings on the owner's screen used to render at
   one byte-identical spec, so a head, a date, a unit, a state, a
   control and the wordmark were the same typographic object and a
   reader had to read every label to learn what kind of thing it was.
   Data takes the spec the count column already ships - sentence case at
   the data letterfit - and state and provenance sit one ink step
   behind it. No new size, weight or hue. */
.b-date,
.b-behindDate,
.b-behindCount,
.b-unit,
.b-origin,
.b-where {
  text-transform: none;
  letter-spacing: var(--track-data);
  color: var(--fore-72);
}
.b-hiddenMark,
.b-behindState,
.b-keeper,
.b-foot span {
  text-transform: none;
  letter-spacing: var(--track-data);
  color: var(--fore-62);
}
.b-grabWord { text-transform: none; letter-spacing: var(--track-data); }

/* Provenance, said where a stranger looks first. */
.b-keeper {
  font-family: var(--mono);
  font-size: var(--size-label);
  line-height: var(--lead-label);
  margin: var(--gap-snug) 0 0;
}

/* Forty-four pixels is the floor for anything a thumb presses, and the
   file wrote that down and then applied it to one control. Scoped to a
   coarse pointer, so nothing at desk width moves. */
@media (pointer: coarse) {
  /* .b-undoAct was omitted the first time this was written, so the one
     control that takes a change back measured 51x28 - the smallest
     target in the product was the way out of a mistake. */
  .b-act, .b-seg button, .b-step, .b-grab, .b-linkField, .b-undoAct { min-height: 44px; height: auto; }
  .b-step { min-width: 52px; }
  :root { --gap-control: var(--gap-line); }
  /* The reserve must move with the button it reserves for. At 44 the
     bar's measured bottom goes 81.4 to 97.4, so the hand-measured 88
     above would let the bar's hairline cross the panel's first label. */
  .b-edit { padding-top: 104px; }  /* off-ladder: measure geometry */
}

/* ═══ forced colours ══════════════════════════════════════════════
   LAST IN THE SHEET, deliberately. This lived in shell.css, which
   build.mjs concatenates BEFORE b.css, so every rule here lost to the
   base paint at equal specificity and the map never applied at all:
   the rail painted nothing, today went white on white, and the one
   indigo mark was indistinguishable from seven ordinary ticks - with
   five hundred assertions passing over a page that had no spine.
   Anything that overrides these must be declared above them. */
@media (forced-colors: active) {
  /* The record room paints the rail from the accent at (0,2,0), which
     beats a bare .b-rail no matter how late it sits. */
  [data-accent="structure"] .b-rail { background: CanvasText; opacity: 1; }
  .b-rail { background: CanvasText; }
  .b-todayRule, .b-dayNow { border-color: Highlight; background: Highlight; }
  .b-dayNow { background: none; border-top-color: Highlight; }
  .b-tick { background: Canvas; border-color: CanvasText; }
  .b-item[data-lead="true"] .b-tick,
  .b-item[data-anchor="true"]::before {
    background: Highlight;
    border-color: Highlight;
    /* A forced palette may repaint any fill, so the mark that means
       "this one" is carried in geometry too - a ring nothing else has. */
    border-width: 3px;
    /* The base rule declares no border-style, so a width alone drew
       nothing - the geometry that survives a repaint needs both. */
    border-style: solid;
  }
  .b-back .b-item[data-lead="true"] .b-tick { background: Canvas; border-color: CanvasText; }
}
</style>

<script>
/* The toolchain contract, and the whole of it: this file answers ?state=
   and ?v=, plus the two named decisions. shots.mjs, audit.mjs and the
   compiled console drive it through those parameters and nothing else. */
(function () {
  var q = new URLSearchParams(location.search);
  var root = document.getElementById("deck") || document.body;
  /* ?v= names a ROOM, and a room is a preset of the named decisions. It
     applies the whole preset first so that shots.mjs --v=paper and
     audit.mjs --v=paper grade the room the console shows, not the
     default decisions with a different label on them. Explicit
     parameters then override, so ?v=paper&ground=ink is still reachable. */
  var room = q.get("v");
  var presets = window.__elevate.presets;
  if (room && presets[room]) {
    Object.keys(presets[room]).forEach(function (key) {
      root.setAttribute("data-" + key, presets[room][key]);
    });
  }
  ["state", "v", "ground", "past", "accent"].forEach(function (key) {
    var value = q.get(key);
    if (value) root.setAttribute("data-" + key, value);
  });
  window.__TLCORE.mount();
})();
</script>
