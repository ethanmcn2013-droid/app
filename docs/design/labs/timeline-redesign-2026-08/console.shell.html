<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline Design Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════
   The console is not the product, so it is deliberately quieter than
   the thing it drives: one ink surface, one white panel, no chrome that
   competes with the work it is showing. Same palette, because
   the palette lock applies to the tool as well as the work.
   ═══════════════════════════════════════════════════════════════════ */
:root {
  --ink: #111111;
  --indigo: #4f46e5;
  --white: #ffffff;
  --ui-bg: #0b0b0b;
  --ui-panel: rgba(255, 255, 255, 0.05);
  --ui-line: rgba(255, 255, 255, 0.11);
  --ui-line-strong: rgba(255, 255, 255, 0.2);
  --ui-text: rgba(255, 255, 255, 0.62);
  --ui-text-strong: #ffffff;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ui-bg);
  color: var(--ui-text-strong);
  font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

.console {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  min-height: 100dvh;
}

/* ── the panel ─────────────────────────────────────────────────── */
.panel {
  border-right: 1px solid var(--ui-line);
  padding: 26px 22px 40px;
  display: flex; flex-direction: column; gap: 26px;
  position: sticky; top: 0; align-self: start;
  max-height: 100dvh; overflow-y: auto;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brandWord {
  display: inline-flex; align-items: baseline;
  font-size: 17px; font-weight: 600; letter-spacing: -0.045em;
  color: var(--ui-text-strong);
}
.brandWord::after {
  content: ""; width: 4.5px; height: 4.5px; border-radius: 50%;
  background: var(--indigo); margin-left: 2px;
}
.brandNote {
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ui-text);
}

.group { display: grid; gap: 9px; }
.groupLabel {
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: 10px; font-weight: 400;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ui-text);
}
.groupHelp { font-size: 12px; line-height: 1.45; color: var(--ui-text); margin: -4px 0 2px; }

.choices { display: grid; gap: 4px; }
.choices[data-cols="2"] { grid-template-columns: 1fr 1fr; }
.choices[data-cols="3"] { grid-template-columns: repeat(3, 1fr); }
.choice {
  appearance: none; border: 0; cursor: pointer;
  font: inherit; font-size: 12.5px; text-align: left;
  color: var(--ui-text);
  background: var(--ui-panel);
  box-shadow: inset 0 0 0 1px var(--ui-line);
  border-radius: 8px;
  min-height: 44px; padding: 6px 10px; min-width: 0;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px;
  transition: color 140ms var(--ease), background-color 140ms var(--ease), box-shadow 140ms var(--ease);
}
.choice:hover { color: var(--ui-text-strong); background: rgba(255, 255, 255, 0.08); }
.choice[aria-pressed="true"] {
  color: var(--ink); background: var(--white);
  box-shadow: inset 0 0 0 1px var(--white);
  font-weight: 600;
}
.choice:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
.choice small { font-size: 10.5px; opacity: 0.62; font-weight: 400; }
/* A label longer than half the sidebar was being clipped mid-word
   ("Next thing and the ra…"). A control that cannot say what it does
   is not a control, so the label wraps rather than truncates. */
.choice > span { white-space: normal; overflow-wrap: anywhere; line-height: 1.25; }

.presetRow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.preset {
  appearance: none; border: 0; cursor: pointer; font: inherit;
  border-radius: 8px; padding: 11px 10px 10px;
  background: var(--ui-panel);
  box-shadow: inset 0 0 0 1px var(--ui-line);
  color: var(--ui-text); text-align: left;
  display: grid; gap: 3px;
  transition: color 140ms var(--ease), background-color 140ms var(--ease);
}
.preset b { font-size: 12.5px; font-weight: 600; color: var(--ui-text-strong); }
.preset span { font-size: 11px; line-height: 1.35; }
.preset:hover { background: rgba(255, 255, 255, 0.08); }
.preset[aria-pressed="true"] { background: var(--white); color: rgba(17, 17, 17, 0.62); }
.preset[aria-pressed="true"] b { color: var(--ink); }
.preset:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }

.reset {
  appearance: none; border: 0; cursor: pointer; font: inherit;
  font-size: 12px; color: var(--ui-text);
  background: none; padding: 0; text-align: left;
  text-decoration: underline; text-underline-offset: 3px;
}
.reset:hover { color: var(--ui-text-strong); }

.recipe {
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: 11px; line-height: 1.7; color: var(--ui-text);
  background: var(--ui-panel);
  box-shadow: inset 0 0 0 1px var(--ui-line);
  border-radius: 8px; padding: 12px;
  white-space: pre-wrap; word-break: break-word;
}

/* ── the stage ─────────────────────────────────────────────────── */
.stage {
  padding: 26px 30px 40px;
  display: flex; flex-direction: column; gap: 18px;
  min-width: 0;
}
.stageBar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.stageBar .groupLabel { margin-right: -10px; }
.stageTabs { display: inline-flex; gap: 3px; padding: 3px; background: var(--ui-panel); border-radius: 999px; box-shadow: inset 0 0 0 1px var(--ui-line); }
/* A row of eleven state tabs is wider than a phone. It scrolls inside its
   own pill rather than pushing the page sideways: the founder reads this
   page on a phone and a page that scrolls horizontally reads as broken. */
.stageTabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.stageTabs::-webkit-scrollbar { display: none; }
.stageRow, .stageHead { min-width: 0; }
.stageTab {
  appearance: none; border: 0; cursor: pointer; font: inherit;
  font-size: 12.5px; color: var(--ui-text);
  background: none; border-radius: 999px;
  min-height: 30px; padding: 0 13px;
  transition: color 140ms var(--ease), background-color 140ms var(--ease);
}
.stageTab:hover { color: var(--ui-text-strong); }
.stageTab[aria-pressed="true"] { background: var(--white); color: var(--ink); font-weight: 600; }
.stageTab:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }

/* ── the way out to the other three ─────────────────────────────── */
.elsewhere { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--ui-line); }
.elseLink {
  display: block;
  padding: 9px 0;
  text-decoration: none;
  border-bottom: 1px solid var(--ui-line);
}
.elseLink:last-child { border-bottom: 0; }
.elseLink b {
  display: block;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--ui-text);
  transition: color 140ms var(--ease);
}
.elseLink i {
  display: block;
  font-style: normal;
  font-family: var(--mono, ui-monospace, monospace);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.34);
  margin-top: 3px;
}
.elseLink:hover b { color: var(--white); }
.elseLink:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; border-radius: 3px; }

.frame {
  border-radius: 12px;
  overflow: hidden;
  align-self: flex-start;
  max-width: 100%;
  box-shadow: 0 0 0 1px var(--ui-line), 0 24px 64px rgba(0, 0, 0, 0.5);
}

/* The deck is the real product. Every rule below this point in the
   compiled stylesheet is the master's own, scoped to here. */
.deck {
  display: block;
  overflow: hidden;
  transform-origin: top left;
}

.footNote {
  font-size: 12px; line-height: 1.6; color: var(--ui-text);
  max-width: 70ch;
}
.footNote b { color: var(--ui-text-strong); font-weight: 600; }

@media (max-width: 960px) {
  .console { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--ui-line); }
  .stage { padding: 20px 16px 36px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0ms !important; animation-duration: 0ms !important; }
}

/*__CSS__*/
</style>

    <div class="brand">

<script>/*__RENDERER__*/</script>
<script id="meta" type="application/json">/*__META__*/</script>
<script>
(function () {
  "use strict";

  const deck = document.getElementById("deck");
  const frame = document.getElementById("frame");
  const META = JSON.parse(document.getElementById("meta").textContent);
  /* The master's own runtime contract, when it has one. A static master
     exports nothing and the console still works: decisions and state are
     written onto the deck as data attributes, which is what the master's
     CSS reads either way. */
  const api = window.__elevate || window.__signal || null;

  const cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  const normalize = function (list) {
    return (list || []).map(function (s) { return Array.isArray(s) ? s : [s, cap(s)]; });
  };

  const CONTROLS = (api && api.controls) || META.controls || [];
  const PRESETS = (api && api.presets) || META.presets || { a: {} };
  const PRESET_KEYS = Object.keys(PRESETS);
  const PRESET_COPY = (api && api.presetCopy) || META.presetCopy || {};
  const STATES = normalize((api && api.states) || META.states || ["resting"]);
  const WIDTHS = (META.widths || [1440, 1280, 768, 390]).map(function (w) { return [w, String(w)]; });
  const HEIGHTS = META.heights || { 1440: 960, 1280: 900, 768: 1024, 390: 844 };
  const STORE = "elevate." + (META.name || "lab") + ".console.v1";

  /* META.name is the lab's directory name, not the product's. The shell
     already carries the right title; do not overwrite it with the folder. */
  const shown = META.display || (META.name || "").replace(/-redesign$/, "");
  if (shown) document.title = cap(shown) + " Design Console";
  document.getElementById("brandWord").textContent = shown || "design";

  /* The other three artifacts. A link with nowhere to go is removed
     rather than left as a dead press, and the block only appears once
     at least one of them exists. */
  (function () {
    const urls = META.artifacts || {};
    const block = document.getElementById("elsewhere");
    if (!block) return;
    let shown = 0;
    Array.prototype.forEach.call(block.querySelectorAll(".elseLink"), function (a) {
      const url = urls[a.getAttribute("data-key")];
      if (url) { a.href = url; shown += 1; } else { a.hidden = true; }
    });
    if (shown) block.hidden = false;
  })();
  document.getElementById("presetHelp").textContent = META.presetHelp ||
    (PRESET_KEYS.length + " finished version" + (PRESET_KEYS.length === 1 ? "" : "s") +
     ". Pick one, then change anything you like underneath.");
  document.getElementById("reset").textContent = "Back to " +
    ((PRESET_COPY[PRESET_KEYS[0]] || {}).name || "the first room");
  const paletteLine = (META.palette || []).map(function (p) { return p.name + " <b>" + p.hex + "</b>"; }).join(", ");
  document.getElementById("footNote").innerHTML = META.footNote ||
    ("This is the real thing, not a picture of one. Every control writes the same " +
     "attribute the product itself reads, so any combination you land on is a " +
     "buildable configuration. <b>Every combination stays on palette:</b> " +
     paletteLine + ", and tints of those. Nothing in this console can reach another colour.");

  let current = { preset: PRESET_KEYS[0], state: STATES.length ? STATES[0][0] : "", width: WIDTHS[0][0] };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved && typeof saved === "object") current = Object.assign(current, saved);
  } catch (error) { /* private mode */ }

  function decisionsFor(config) {
    const base = Object.assign({}, PRESETS[config.preset] || PRESETS[PRESET_KEYS[0]]);
    for (const control of CONTROLS) {
      if (config[control.key]) base[control.key] = config[control.key];
    }
    return base;
  }

  function render() {
    const decisions = decisionsFor(current);
    for (const control of CONTROLS) deck.setAttribute("data-" + control.key, decisions[control.key]);
    deck.setAttribute("data-w", String(current.width));
    deck.setAttribute("data-v", current.preset);

    if (api && api.setState) api.setState(current.state);
    else deck.setAttribute("data-state", current.state);
    if (api && api.mount) api.mount();

    /* The deck is drawn at its real pixel width and then scaled to fit the
       stage, so what you are looking at is a true layout at that width
       rather than a narrow one pretending. clientWidth includes the
       stage's own padding, and measuring that as available space is how
       the last column gets clipped. */
    const stage = frame.parentElement;
    const stageStyle = getComputedStyle(stage);
    const available = stage.clientWidth
      - parseFloat(stageStyle.paddingLeft)
      - parseFloat(stageStyle.paddingRight);
    const scale = Math.min(1, available / current.width);
    deck.style.width = current.width + "px";
    deck.style.height = (HEIGHTS[current.width] || 960) + "px";
    deck.style.transform = "scale(" + scale + ")";
    frame.style.width = Math.round(current.width * scale) + "px";
    frame.style.height = Math.round((HEIGHTS[current.width] || 960) * scale) + "px";

    paintControls();
    paintRecipe(decisions);
    try { localStorage.setItem(STORE, JSON.stringify(current)); } catch (error) { /* private mode */ }
  }

  function paintRecipe(decisions) {
    const lines = ["preset".padEnd(15, " ") + ((PRESET_COPY[current.preset] || {}).name || current.preset)];
    for (const control of CONTROLS) {
      const chosen = decisions[control.key];
      const label = (control.options.find(function (o) { return o[0] === chosen; }) || [])[1] || chosen;
      const changed = (PRESETS[current.preset] || {})[control.key] !== chosen;
      lines.push(control.label.toLowerCase().padEnd(15, " ") + label + (changed ? "   (changed)" : ""));
    }
    document.getElementById("recipe").textContent = lines.join("\n");
  }

  function paintControls() {
    const decisions = decisionsFor(current);
    Array.prototype.forEach.call(document.querySelectorAll("[data-choice]"), function (button) {
      button.setAttribute("aria-pressed", String(decisions[button.dataset.choice] === button.dataset.value));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-preset]"), function (button) {
      button.setAttribute("aria-pressed", String(current.preset === button.dataset.preset));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-state]"), function (button) {
      button.setAttribute("aria-pressed", String(current.state === button.dataset.state));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-width]"), function (button) {
      button.setAttribute("aria-pressed", String(String(current.width) === button.dataset.width));
    });
  }

  /* ── build the panel ─────────────────────────────────────────── */
  const presets = document.getElementById("presets");
  presets.dataset.cols = String(Math.min(PRESET_KEYS.length, 3));
  PRESET_KEYS.forEach(function (key) {
    const copy = PRESET_COPY[key] || { name: key.toUpperCase(), line: "" };
    const button = document.createElement("button");
    button.type = "button";
    button.className = "preset";
    button.dataset.preset = key;
    button.innerHTML = "<b>" + copy.name + "</b>" + (copy.line ? "<span>" + copy.line + "</span>" : "");
    button.addEventListener("click", function () {
      current = { preset: key, state: current.state, width: current.width };
      render();
    });
    presets.appendChild(button);
  });

  const controls = document.getElementById("controls");
  CONTROLS.forEach(function (control) {
    const group = document.createElement("div");
    group.className = "group";
    group.innerHTML =
      '<span class="groupLabel">' + control.label + "</span>" +
      (control.help ? '<p class="groupHelp">' + control.help + "</p>" : "");
    const row = document.createElement("div");
    row.className = "choices";
    row.dataset.cols = String(control.cols || Math.min(control.options.length, 3));
    control.options.forEach(function (option) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice";
      button.dataset.choice = control.key;
      button.dataset.value = option[0];
      button.innerHTML = "<span>" + option[1] + "</span>" + (option[2] ? "<small>" + option[2] + "</small>" : "");
      button.addEventListener("click", function () {
        current[control.key] = option[0];
        render();
      });
      row.appendChild(button);
    });
    group.appendChild(row);
    controls.appendChild(group);
  });

  const statesHost = document.getElementById("states");
  STATES.forEach(function (entry) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "stageTab";
    button.dataset.state = entry[0];
    button.textContent = entry[1];
    button.addEventListener("click", function () { current.state = entry[0]; render(); });
    statesHost.appendChild(button);
  });

  const widthsHost = document.getElementById("widths");
  WIDTHS.forEach(function (entry) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "stageTab";
    button.dataset.width = String(entry[0]);
    button.textContent = entry[1];
    button.addEventListener("click", function () { current.width = entry[0]; render(); });
    widthsHost.appendChild(button);
  });

  document.getElementById("reset").addEventListener("click", function () {
    current = { preset: PRESET_KEYS[0], state: current.state, width: current.width };
    render();
  });

  window.addEventListener("resize", function () { render(); });
  render();
})();
</script>

<style id="famCss">
/* ── the family rail ────────────────────────────────────────────────────
   One band, five documents, always at the top. It is the only chrome the
   three elevations share, so it carries the whole burden of making them
   read as one operation: the same dot, the same numbering, the same
   indigo under whichever document you are standing in.
   ──────────────────────────────────────────────────────────────────── */
.famRail {
  --f-ink: #111111;
  --f-indigo: #4f46e5;
  --f-paper: #ffffff;
  --f-1: var(--f-ink);
  --f-2: rgba(17, 17, 17, 0.66);
  --f-3: rgba(17, 17, 17, 0.44);
  --f-line: rgba(17, 17, 17, 0.11);
  --f-wash: rgba(17, 17, 17, 0.045);
  --f-veil: rgba(255, 255, 255, 0.86);
  --f-sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  position: sticky;
  top: 0;
  z-index: 9000;
  font-family: var(--f-sans);
  background: var(--f-veil);
  border-bottom: 1px solid var(--f-line);
  color: var(--f-1);
  -webkit-font-smoothing: antialiased;
}
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  .famRail { -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); }
}
