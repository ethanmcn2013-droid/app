<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weddings · master</title>
<style>
/* Geist travels with the lab as real files, so the master renders the
   product's own face offline and the console can inline it. */
@font-face { font-family: "Geist"; src: url("./fonts/Geist.woff2") format("woff2-variations"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "Geist Mono"; src: url("./fonts/GeistMono.woff2") format("woff2-variations"); font-weight: 100 900; font-display: block; }

/* ══════════════════════════════════════════════════════════════════════
   SIGNAL STUDIO · HOME
   Twenty answers to one question, drawn on the Studio Floor.

   HELD TO THE MASTER SUITE'S PALETTE LOCK. Ink, Indigo, White and tints
   of those three; Geist at 400 and 600; Geist Mono at 400; and nothing
   else. State is ink DENSITY and FILL, never hue — a deck proposing
   twenty home screens for that suite does not get to break the rule the
   suite is held to. There is no green, no amber and no red anywhere in
   this file, and the four-step severity ladder below is the whole of the
   status vocabulary.
   ══════════════════════════════════════════════════════════════════════ */

:root {
  /* ── the three ─────────────────────────────────────────────── */
  --ink: #111111;
  --indigo: #4f46e5;
  --white: #ffffff;

  /* ── ink, at stated alphas (over white) ────────────────────── */
  --ink-1: var(--ink);                       /* primary type       21:1 */
  --ink-2: rgba(17, 17, 17, 0.72);           /* secondary type    7.4:1 */
  --ink-3: rgba(17, 17, 17, 0.62);           /* micro labels      5.3:1 */
  --ink-4: rgba(17, 17, 17, 0.28);           /* decorative only, never type */

  /* The alpha ladder. Four steps, and no value between them. Nothing on
     a white surface goes above 8%: a heavier rule reads as a box. */
  --wash: rgba(17, 17, 17, 0.04);
  --line-soft: rgba(17, 17, 17, 0.06);
  --line: rgba(17, 17, 17, 0.08);
  --wash-2: rgba(17, 17, 17, 0.08);
  --line-strong: rgba(17, 17, 17, 0.16);

  /* ── white, at stated alphas (over the ink floor) ──────────── */
  --on-ink-1: #ffffff;
  --on-ink-2: rgba(255, 255, 255, 0.62);     /* 7.7:1 on ink            */
  --on-ink-3: rgba(255, 255, 255, 0.42);
  --chrome: rgba(255, 255, 255, 0.07);
  --chrome-line: rgba(255, 255, 255, 0.10);
  --chrome-active: rgba(255, 255, 255, 0.14);
  --indigo-on-ink: #a5b4fc;                  /* the suite's own token   */

  /* ── indigo, at stated alphas ──────────────────────────────── */
  --indigo-ink: var(--indigo);               /* 6.3:1 on white          */
  --indigo-wash: rgba(79, 70, 229, 0.09);
  --indigo-line: rgba(79, 70, 229, 0.32);
  --indigo-ring: rgba(79, 70, 229, 0.16);

  /* ═══ THE SEVERITY LADDER ════════════════════════════════════════
     Lifted unchanged from the master suite's own record. Four steps of
     ink density and fill, in this order, and nothing else may signal
     state. Indigo is not on this ladder: it marks what is LIVE or
     SELECTED, never what is wrong.
     ═════════════════════════════════════════════════════════════════ */
  --sev-1: var(--ink-1);                     /* needs a person · solid   */
  --sev-2: var(--ink-3);                     /* waiting on someone       */
  --sev-3: var(--ink-4);                     /* moving                   */
  /* step four is the absence of fill: a 1px inset ring, drawn in CSS */

  /* ── type. Two weights. No third. ──────────────────────────── */
  --font-sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --w-regular: 400;
  --w-semibold: 600;

  --t-10: 10px; --t-11: 11px; --t-12: 12px; --t-13: 13px; --t-14: 14px;
  --t-15: 15px; --t-18: 18px; --t-22: 22px; --t-28: 28px;

  --tr-28: -0.028em; --tr-22: -0.027em; --tr-18: -0.022em; --tr-15: -0.016em;
  --tr-14: -0.014em; --tr-13: -0.010em; --tr-12: -0.006em; --tr-11: 0em;
  --tr-10: 0.004em; --tr-rev: 0.008em; --tr-cap: 0.075em;
  --lh-tight: 1.28;

  /* ── the ladder. 4-6-8-12-16-pill. Six steps, no seventh. ──── */
  --r-xs: 4px; --r-chip: 6px; --r-ctl: 8px; --r-card: 12px;
  --r-sheet: 16px; --r-pill: 999px;

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-7: 32px; --space-8: 40px;

  --inset: 18px;
  --rail: 252px;

  /* ── motion. Five names, one per value. ────────────────────── */
  /* The RARE tier is spoken for by three product moments and a page turn
     is not one of them, so nothing here moves at 400ms. */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --motion-instant: 80ms;
  --motion-fast: 140ms;
  --motion-base: 220ms;
  --dur-quick: var(--motion-instant);
  --dur: var(--motion-fast);
  --dur-settle: var(--motion-base);
  --curve: var(--ease-out);

  --ring: 0 0 0 1px var(--line);
  --float-ink: 0 2px 6px rgba(17, 17, 17, 0.30), 0 16px 36px rgba(17, 17, 17, 0.36);
  --float: 0 1px 1px rgba(17, 17, 17, 0.03), 0 4px 8px rgba(17, 17, 17, 0.03), 0 14px 28px rgba(17, 17, 17, 0.06);
}

@media (prefers-reduced-motion: reduce) {
  :root { --motion-instant: 0ms; --motion-fast: 0ms; --motion-base: 0ms; }
}

*, *::before, *::after { box-sizing: border-box; }

html { background: var(--ink); }
body {
  margin: 0;
  background: var(--ink);
  color: var(--ink-1);
  font-family: var(--font-sans);
  font-weight: var(--w-regular);
  font-feature-settings: "ss01", "cv01";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--indigo-on-ink); outline-offset: 2px; border-radius: var(--r-xs); }
.sheet :focus-visible { outline-color: var(--indigo); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ══ THE FLOOR ═══════════════════════════════════════════════════════ */
.floor {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  height: 100dvh;
  min-height: 620px;
}

.rail { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; color: var(--on-ink-1); }
.railHead { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) var(--space-5) var(--space-4); }
.monogram {
  width: 26px; height: 26px; flex: none; display: grid; place-items: center;
  border-radius: var(--r-chip); background: var(--indigo); color: #fff;
  font-size: var(--t-13); line-height: 1; letter-spacing: var(--tr-cap); text-indent: var(--tr-cap);
}
.railTitle { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.railTitle b { font-size: var(--t-13); font-weight: var(--w-semibold); letter-spacing: var(--tr-13); line-height: var(--lh-tight); }
.railTitle span { font-size: var(--t-11); letter-spacing: var(--tr-11); color: var(--on-ink-3); line-height: var(--lh-tight); }

.railScroll { overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--space-3) var(--space-3); }
.railScroll::-webkit-scrollbar { width: 8px; }
.railScroll::-webkit-scrollbar-thumb { background: var(--chrome-line); border-radius: var(--r-pill); }
.railScroll::-webkit-scrollbar-track { background: transparent; }

.railSection { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-5) var(--space-2) var(--space-2); }
.railSection > i { font-style: normal; font-family: var(--font-mono); font-size: var(--t-10); color: var(--on-ink-3); font-variant-numeric: tabular-nums; }
.railSection > span {
  font-size: var(--t-10); font-weight: var(--w-semibold);
  letter-spacing: var(--tr-cap); text-indent: var(--tr-cap);
  text-transform: uppercase; color: var(--on-ink-2); white-space: nowrap;
}
.railSection > hr { flex: 1; height: 0; margin: 0; border: 0; border-top: 1px solid var(--chrome-line); }

.railItem {
  display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: baseline; gap: var(--space-2);
  width: 100%; text-align: left; padding: 7px var(--space-2);
  border-radius: var(--r-ctl); color: var(--on-ink-2); position: relative;
  transition: background var(--dur) var(--curve), color var(--dur) var(--curve);
}
.railItem > i { font-style: normal; font-family: var(--font-mono); font-size: var(--t-10); font-variant-numeric: tabular-nums; color: var(--on-ink-3); transition: color var(--dur) var(--curve); }
.railItem > span { font-size: var(--t-13); letter-spacing: var(--tr-13); line-height: var(--lh-tight); }
.railItem:hover { background: var(--chrome); color: var(--on-ink-1); }
.railItem[aria-current="true"] { background: var(--chrome-active); color: var(--on-ink-1); }
.railItem[aria-current="true"] > i { color: var(--indigo-on-ink); }
.railItem[aria-current="true"]::before {
  content: ""; position: absolute; left: -6px; top: 50%; width: 2px; height: 14px; margin-top: -7px;
  border-radius: var(--r-pill); background: var(--indigo-on-ink);
}

.railFoot {
  display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
  padding: var(--space-3) var(--space-5) var(--space-5);
  border-top: 1px solid var(--chrome-line); margin: 0 var(--space-3);
}
.kbd {
  font-family: var(--font-mono); font-size: var(--t-10); color: var(--on-ink-2);
  padding: 3px 6px; border-radius: var(--r-xs);
  background: var(--chrome); border: 1px solid var(--chrome-line); line-height: 1;
}
.railFoot span { font-size: var(--t-11); color: var(--on-ink-3); letter-spacing: var(--tr-11); }

/* ── the sheet ─────────────────────────────────────────────────── */
.stage { padding: var(--inset) var(--inset) var(--inset) 0; min-width: 0; min-height: 0; }
.sheet {
  height: 100%; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr);
  background: var(--white); border-radius: var(--r-sheet); box-shadow: var(--float-ink); overflow: hidden;
}
.sheetHead {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: var(--space-6);
  padding: var(--space-6) var(--space-7) var(--space-5); border-bottom: 1px solid var(--line-soft);
}
.eyebrow { display: flex; align-items: center; gap: var(--space-2); margin-bottom: 7px; }
.eyebrow .num { font-family: var(--font-mono); font-size: var(--t-11); color: var(--indigo-ink); font-variant-numeric: tabular-nums; }
.eyebrow .sec {
  font-size: var(--t-10); font-weight: var(--w-semibold); letter-spacing: var(--tr-cap);
  text-indent: var(--tr-cap); text-transform: uppercase; color: var(--ink-3);
}
.sheetHead h1 { margin: 0; font-size: var(--t-22); font-weight: var(--w-semibold); letter-spacing: var(--tr-22); line-height: 1.2; color: var(--ink-1); text-wrap: balance; }
.thesis { margin: 6px 0 0; max-width: 74ch; font-size: var(--t-13); line-height: 1.5; letter-spacing: var(--tr-13); color: var(--ink-2); }

.pager { display: flex; align-items: center; gap: var(--space-1); flex: none; }
.pgBtn {
  width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--r-ctl);
  color: var(--ink-2); box-shadow: var(--ring);
  transition: background var(--dur) var(--curve), color var(--dur) var(--curve), box-shadow var(--dur) var(--curve);
}
.pgBtn:hover:not(:disabled) { background: var(--wash); color: var(--ink-1); box-shadow: 0 0 0 1px var(--line-strong); }
.pgBtn:active:not(:disabled) { transition-duration: var(--dur-quick); background: var(--wash-2); }
.pgBtn:disabled { color: var(--ink-4); cursor: default; }
.pgBtn svg { width: 15px; height: 15px; display: block; }
.pgCount { font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-3); font-variant-numeric: tabular-nums; padding: 0 var(--space-2); }
.pgAll {
  height: 30px; padding: 0 11px; border-radius: var(--r-ctl); font-size: var(--t-12);
  letter-spacing: var(--tr-12); color: var(--ink-2); box-shadow: var(--ring); margin-left: var(--space-2);
  transition: background var(--dur) var(--curve), color var(--dur) var(--curve);
}
.pgAll:hover { background: var(--wash); color: var(--ink-1); }

.sheetBody { overflow-y: auto; overscroll-behavior: contain; padding: var(--space-7); }
.sheetBody::-webkit-scrollbar { width: 10px; }
.sheetBody::-webkit-scrollbar-thumb { background: var(--line); border-radius: var(--r-pill); border: 3px solid #fff; }
.sheetBody::-webkit-scrollbar-track { background: transparent; }

.view { animation: settle var(--dur-settle) var(--curve) both; }
@keyframes settle { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } }

/* ══ THE INDEX ═══════════════════════════════════════════════════════ */
.index {
  position: fixed; inset: 0; z-index: 60; background: rgba(17, 17, 17, 0.86);
  backdrop-filter: blur(6px); display: grid; place-items: center; padding: var(--space-7);
  animation: fade var(--dur) var(--curve) both;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.indexInner { width: min(1080px, 100%); max-height: 100%; overflow-y: auto; }
.indexHead { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-5); }
.indexHead h2 { margin: 0; font-size: var(--t-18); font-weight: var(--w-semibold); letter-spacing: var(--tr-18); color: var(--on-ink-1); }
.indexHead p { margin: 4px 0 0; font-size: var(--t-12); letter-spacing: var(--tr-12); color: var(--on-ink-3); }
.indexGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: var(--space-3); }
.idxCard {
  display: flex; flex-direction: column; gap: 5px; text-align: left;
  padding: var(--space-3) var(--space-4); border-radius: var(--r-ctl);
  background: var(--chrome); border: 1px solid var(--chrome-line);
  transition: background var(--dur) var(--curve), border-color var(--dur) var(--curve), transform var(--dur) var(--curve);
}
.idxCard:hover { background: var(--chrome-active); border-color: rgba(255, 255, 255, 0.22); transform: translateY(-1px); }
.idxCard[aria-current="true"] { border-color: var(--indigo-on-ink); background: rgba(165, 180, 252, 0.14); }
.idxCard i { font-style: normal; font-family: var(--font-mono); font-size: var(--t-10); color: var(--indigo-on-ink); font-variant-numeric: tabular-nums; }
.idxCard b { font-size: var(--t-13); font-weight: var(--w-semibold); letter-spacing: var(--tr-13); color: var(--on-ink-1); line-height: var(--lh-tight); }
.idxCard span { font-size: var(--t-11); letter-spacing: var(--tr-11); color: var(--on-ink-3); line-height: 1.35; }
.idxSection { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-3); }
.idxSection span {
  font-size: var(--t-10); font-weight: var(--w-semibold); letter-spacing: var(--tr-cap);
  text-indent: var(--tr-cap); text-transform: uppercase; color: var(--on-ink-2); white-space: nowrap;
}
.idxSection hr { flex: 1; height: 0; margin: 0; border: 0; border-top: 1px solid var(--chrome-line); }

@media (max-width: 860px) {
  .floor { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: auto; min-height: 100dvh; }
  .rail { grid-template-rows: auto auto; }
  .railScroll, .railFoot { display: none; }
  .stage { padding: 0 var(--space-3) var(--space-3); }
  .sheet { height: auto; }
  .sheetBody { overflow: visible; padding: var(--space-5); }
  .sheetHead { padding: var(--space-5); grid-template-columns: minmax(0, 1fr); }
}

/* ── the composition floor ── 1140px ─────────────────────────────── */
@media (min-width: 861px) {
  .sheetBody { overflow-x: auto; }
  .sheetBody > .view { min-width: 1140px; }
}

/* ══════════════════════════════════════════════════════════════════════
   THE SCREEN — a mockup of the product, shown inside the deck.
   The deck's own chrome is the ink rail on the far left. Everything
   below is the APP: its own ink floor, its own 54px spine carrying the
   three products, and its own white sheet. The two are told apart by
   the caption bar and the ring, so nobody mistakes the deck for the
   thing being proposed.
   ══════════════════════════════════════════════════════════════════════ */

.screenWrap { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.scCaption {
  display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
  font-family: var(--font-mono); font-size: var(--t-10); color: var(--ink-3);
  letter-spacing: var(--tr-10);
}
.scCaption b { font-weight: var(--w-regular); color: var(--ink-2); }
.scCaption .sep { color: var(--ink-4); }

.screen {
  background: var(--ink);
  border-radius: 14px;
  padding: 12px;
  display: grid;
  grid-template-columns: 54px minmax(0, 1fr);
  gap: 12px;
  /* The caption says 1440×900, so the frame holds roughly that ratio at
     desk width rather than quietly drawing a wider screen than it names. */
  min-height: 660px;
  box-shadow: var(--float);
  overflow: hidden;
}
.screen[data-full] { grid-template-columns: minmax(0, 1fr); }

/* ── the spine ─────────────────────────────────────────────────── */
.scSpine { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 0; }
.scMark {
  width: 24px; height: 24px; flex: none; display: grid; place-items: center;
  border-radius: var(--r-chip); background: var(--indigo); color: #fff;
  font-size: 12px; line-height: 1; letter-spacing: var(--tr-cap); text-indent: var(--tr-cap);
}
.scGlyph {
  width: 34px; height: 34px; flex: none; display: grid; place-items: center;
  border-radius: var(--r-ctl); color: var(--on-ink-3);
  font-size: 11px; letter-spacing: var(--tr-cap); text-indent: var(--tr-cap);
  font-weight: var(--w-semibold);
}
.scGlyph[data-on] { background: var(--chrome-active); color: var(--on-ink-1); }
.scGlyph[data-home] { background: var(--indigo); color: #fff; }
.scSpine hr { width: 18px; height: 0; margin: 2px 0; border: 0; border-top: 1px solid var(--chrome-line); }
.scSpine .grow { flex: 1; }
.scFace {
  width: 26px; height: 26px; flex: none; border-radius: 50%;
  background: var(--chrome-active); color: var(--on-ink-1);
  display: grid; place-items: center; font-size: 10px; letter-spacing: 0.04em;
}

/* ── the app sheet ─────────────────────────────────────────────── */
.scSheet {
  background: var(--white); border-radius: 12px; overflow: hidden;
  display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0;
}
.scSheet[data-norows] { grid-template-rows: minmax(0, 1fr); }

.scHead {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 14px 18px; border-bottom: 1px solid var(--line-soft); min-width: 0;
}
.scHeadL { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.scHeadL b { font-size: 15px; font-weight: var(--w-semibold); letter-spacing: var(--tr-15); color: var(--ink-1); line-height: 1.2; }
.scHeadL span { font-size: 11px; letter-spacing: var(--tr-11); color: var(--ink-3); }
.scHeadR { display: flex; align-items: center; gap: 6px; flex: none; }

.scBody { padding: 16px 18px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
.scBody[data-tight] { padding: 0; }
.scBody[data-pad0] { padding: 0; gap: 0; }

/* ── controls ──────────────────────────────────────────────────── */
.scBtn {
  height: 26px; padding: 0 10px; border-radius: var(--r-chip); font-size: 11.5px;
  letter-spacing: var(--tr-12); color: var(--ink-2); box-shadow: 0 0 0 1px var(--line);
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
}
.scBtn[data-primary] { background: var(--indigo); color: #fff; box-shadow: none; }
.scBtn[data-ghost] { box-shadow: none; color: var(--ink-3); }
.scTab {
  height: 24px; padding: 0 9px; border-radius: var(--r-chip); font-size: 11.5px;
  letter-spacing: var(--tr-12); color: var(--ink-3); display: inline-flex; align-items: center; gap: 5px;
}
.scTab[data-on] { background: var(--wash-2); color: var(--ink-1); }
.scField {
  display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 11px;
  border-radius: var(--r-ctl); box-shadow: 0 0 0 1px var(--line); color: var(--ink-4);
  font-size: 12px; letter-spacing: var(--tr-12); min-width: 0;
}
.scField[data-live] { box-shadow: 0 0 0 1px var(--indigo-line), 0 0 0 4px var(--indigo-ring); color: var(--ink-1); }
.scField .caret { width: 1px; height: 14px; background: var(--indigo); flex: none; }
.scField .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── the severity ladder. Density and fill. Never hue. ─────────── */
.sev { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.sev[data-s="1"] { background: var(--sev-1); }
.sev[data-s="2"] { background: var(--sev-2); }
.sev[data-s="3"] { background: var(--sev-3); }
.sev[data-s="4"] { background: transparent; box-shadow: inset 0 0 0 1px var(--ink-4); }
.sev[data-s="live"] { background: var(--indigo); }
.sevBar { width: 3px; border-radius: var(--r-pill); flex: none; align-self: stretch; min-height: 20px; }
.sevBar[data-s="1"] { background: var(--sev-1); }
.sevBar[data-s="2"] { background: var(--sev-2); }
.sevBar[data-s="3"] { background: var(--sev-3); }
.sevBar[data-s="4"] { background: var(--line); }
.sevBar[data-s="live"] { background: var(--indigo); }

.scKey { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.scKeyItem { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: var(--tr-11); color: var(--ink-3); }

/* ── rows ──────────────────────────────────────────────────────── */
.scRows { display: flex; flex-direction: column; min-width: 0; }
.scRow {
  display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; align-items: center; gap: 11px;
  padding: 9px 0; border-bottom: 1px solid var(--line-soft); min-width: 0;
}
.scRow:last-child { border-bottom: 0; }
.scRow[data-lg] { padding: 12px 0; }
.scRowMain { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.scRowMain b { font-size: 13px; font-weight: var(--w-regular); letter-spacing: var(--tr-13); color: var(--ink-1); line-height: var(--lh-tight); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scRowMain span { font-size: 11px; letter-spacing: var(--tr-11); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scRowR { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; color: var(--ink-3); white-space: nowrap; flex: none; }
.scRow[data-on] { background: var(--indigo-wash); border-radius: var(--r-chip); border-bottom-color: transparent; }

/* ── columns ───────────────────────────────────────────────────── */
.scCols { display: grid; gap: 0; min-width: 0; flex: 1; }
.scCol { min-width: 0; padding: 0 14px; display: flex; flex-direction: column; gap: 10px; }
.scCol + .scCol { border-left: 1px solid var(--line-soft); }
.scCol:first-child { padding-left: 0; }
.scCol:last-child { padding-right: 0; }
.scColHead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.scColHead b {
  font-size: 10px; font-weight: var(--w-semibold); letter-spacing: var(--tr-cap);
  text-indent: var(--tr-cap); text-transform: uppercase; color: var(--ink-3);
}
.scColHead .n { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); }

/* ── cards & tiles ─────────────────────────────────────────────── */
.scCard {
  padding: 11px 12px; border-radius: var(--r-ctl); box-shadow: 0 0 0 1px var(--line);
  display: flex; flex-direction: column; gap: 5px; min-width: 0; background: var(--white);
}
.scCard[data-flat] { box-shadow: none; background: var(--wash); }
.scCard[data-live] { box-shadow: 0 0 0 1px var(--indigo-line); }
.scCard b { font-size: 12.5px; font-weight: var(--w-regular); letter-spacing: var(--tr-13); color: var(--ink-1); line-height: 1.32; }
.scCard span { font-size: 10.5px; letter-spacing: var(--tr-11); color: var(--ink-3); }
.scCardFoot { display: flex; align-items: center; gap: 6px; margin-top: 1px; }

.scTiles { display: grid; gap: 10px; min-width: 0; }
.scTile {
  padding: 13px 14px; border-radius: var(--r-ctl); box-shadow: 0 0 0 1px var(--line);
  display: flex; flex-direction: column; gap: 7px; min-width: 0;
  transition: box-shadow var(--dur) var(--curve);
}
.scTile b { font-size: 13px; font-weight: var(--w-semibold); letter-spacing: var(--tr-13); color: var(--ink-1); }
.scTile .meta { font-size: 10.5px; letter-spacing: var(--tr-11); color: var(--ink-3); }
.scTileNum { font-size: 22px; font-weight: var(--w-semibold); letter-spacing: var(--tr-22); color: var(--ink-1); line-height: 1; }

.scPill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: var(--r-pill);
  background: var(--wash); color: var(--ink-3); font-size: 10px; letter-spacing: var(--tr-10); white-space: nowrap;
}
.scPill[data-on] { background: var(--indigo-wash); color: var(--indigo-ink); }
.scAvatar {
  width: 20px; height: 20px; border-radius: 50%; background: var(--wash-2); color: var(--ink-2);
  display: inline-grid; place-items: center; font-size: 9px; letter-spacing: 0.03em; flex: none;
}
.scStack { display: flex; align-items: center; }
.scStack .scAvatar + .scAvatar { margin-left: -6px; box-shadow: 0 0 0 2px var(--white); }

/* ── board lanes ───────────────────────────────────────────────── */
.scLanes { display: grid; gap: 10px; min-width: 0; flex: 1; }
.scLane { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.scLaneHead { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
.scLaneHead b { font-size: 10.5px; font-weight: var(--w-semibold); letter-spacing: var(--tr-cap); text-indent: var(--tr-cap); text-transform: uppercase; color: var(--ink-2); }
.scLaneHead .n { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); }

/* ── calendar / docket ─────────────────────────────────────────── */
.scCal { display: grid; gap: 8px; min-width: 0; flex: 1; }
.scCalTrack { position: relative; min-width: 0; }
.scHour { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; height: 46px; }
.scHour .h { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); padding-top: 1px; }
.scHour .slot { border-top: 1px solid var(--line-soft); height: 100%; padding-top: 4px; }
.scBlock {
  border-radius: var(--r-chip); padding: 6px 9px; font-size: 11.5px; letter-spacing: var(--tr-12);
  color: var(--ink-1); background: var(--wash); box-shadow: inset 2px 0 0 var(--ink-4);
  display: flex; flex-direction: column; gap: 2px; line-height: 1.25;
}
.scBlock span { font-size: 10px; color: var(--ink-3); }
.scBlock[data-live] { background: var(--indigo-wash); box-shadow: inset 2px 0 0 var(--indigo); }
.scBlock[data-work] { box-shadow: inset 2px 0 0 var(--ink-1); }

/* ── week grid ─────────────────────────────────────────────────── */
.scWeek { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line-soft); flex: 1; min-width: 0; }
.scDay { background: var(--white); padding: 9px 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.scDayHead { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
.scDayHead b { font-size: 10px; font-weight: var(--w-semibold); letter-spacing: var(--tr-cap); text-transform: uppercase; color: var(--ink-3); }
.scDayHead .d { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
.scDay[data-today] { background: var(--indigo-wash); }
.scDay[data-today] .scDayHead .d { color: var(--indigo-ink); }
.scMini {
  font-size: 10.5px; letter-spacing: var(--tr-11); color: var(--ink-2); line-height: 1.3;
  display: flex; gap: 5px; align-items: flex-start; min-width: 0;
}
/* A day-cell entry WRAPS. Seven columns can never fit an event title on
   one line, and a truncated title in a week grid is unreadable. */
.scMini > span { overflow-wrap: anywhere; }

/* ── timeline / runway ─────────────────────────────────────────── */
.scTl { display: flex; flex-direction: column; gap: 9px; min-width: 0; flex: 1; }
.scTlScale { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); }
.scTlRow { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 12px; align-items: center; }
.scTlName { font-size: 11.5px; letter-spacing: var(--tr-12); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scTlTrack { position: relative; height: 18px; border-radius: var(--r-xs); background: var(--wash); }
.scTlBar { position: absolute; top: 4px; height: 10px; border-radius: 3px; background: var(--ink-4); }
.scTlBar[data-s="1"] { background: var(--ink-1); }
.scTlBar[data-s="2"] { background: var(--ink-3); }
.scTlBar[data-live] { background: var(--indigo); }
.scTlNow { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--indigo); }

/* ── the wall (spatial) ────────────────────────────────────────── */
.scWall { position: relative; flex: 1; min-height: 0; background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0 / 22px 22px; border-radius: var(--r-ctl); }
.scPin {
  position: absolute; width: 158px; padding: 10px 11px; border-radius: var(--r-ctl);
  background: var(--white); box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgba(17,17,17,0.05);
  display: flex; flex-direction: column; gap: 4px;
}
.scPin b { font-size: 11.5px; font-weight: var(--w-regular); letter-spacing: var(--tr-12); color: var(--ink-1); line-height: 1.32; }
.scPin span { font-size: 10px; color: var(--ink-3); letter-spacing: var(--tr-10); }
.scPin[data-live] { box-shadow: 0 0 0 1px var(--indigo-line), 0 2px 8px rgba(79,70,229,0.12); }
.scTether { position: absolute; height: 1px; background: var(--line-strong); transform-origin: 0 50%; }

/* ── the map ───────────────────────────────────────────────────── */
.scMap { flex: 1; min-height: 0; display: grid; place-items: center; }
.scMap svg { width: 100%; height: 100%; display: block; }
/* A presentation attribute cannot resolve a custom property, so the face is
   set here in CSS, where it outranks the attribute on the element. */
.scMap svg text { font-family: var(--font-sans); letter-spacing: var(--tr-12); }

/* ── the shelf ─────────────────────────────────────────────────── */
.scShelf { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.scBigCard {
  border-radius: var(--r-card); box-shadow: 0 0 0 1px var(--line); overflow: hidden;
  display: flex; flex-direction: column; min-width: 0;
}
.scBigCard .top { padding: 12px 13px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.scBigCard .top b { font-size: 12.5px; font-weight: var(--w-semibold); letter-spacing: var(--tr-13); color: var(--ink-1); line-height: 1.3; }
.scBigCard .top p { margin: 0; font-size: 10.5px; line-height: 1.45; color: var(--ink-3); }
.scBigCard .bot { padding: 8px 13px; border-top: 1px solid var(--line-soft); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.scBigCard .bot span { font-size: 10px; color: var(--ink-3); letter-spacing: var(--tr-10); }

/* ── the line / ask ────────────────────────────────────────────── */
.scCentre { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 8%; min-width: 0; }
.scCentre[data-top] { justify-content: flex-start; padding-top: 8%; }
.scBigField {
  width: 100%; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px;
  border-radius: var(--r-card); box-shadow: 0 0 0 1px var(--indigo-line), 0 0 0 5px var(--indigo-ring);
  font-size: 15px; letter-spacing: var(--tr-15); color: var(--ink-1); background: var(--white);
}
.scBigField .caret { width: 1.5px; height: 19px; background: var(--indigo); flex: none; }
.scBigField .ph { color: var(--ink-4); }
.scSuggest { width: 100%; display: flex; flex-direction: column; }
.scSugRow {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r-chip); min-width: 0;
}
.scSugRow[data-on] { background: var(--wash); }
.scSugRow .g { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); }
.scSugRow b { font-size: 12.5px; font-weight: var(--w-regular); letter-spacing: var(--tr-13); color: var(--ink-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scSugRow .k { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); }

/* ── the blank page ────────────────────────────────────────────── */
.scPage { flex: 1; display: flex; flex-direction: column; gap: 9px; padding: 4px 0; min-width: 0; }
.scPageTitle { font-size: 19px; font-weight: var(--w-semibold); letter-spacing: -0.024em; color: var(--ink-4); display: flex; align-items: center; gap: 3px; }
.scPageTitle .caret { width: 1.5px; height: 22px; background: var(--indigo); }
.scPageLine { height: 8px; border-radius: var(--r-pill); background: var(--wash); }

/* ── the dial ──────────────────────────────────────────────────── */
.scDial { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.scDialOpt {
  padding: 7px 13px; border-radius: var(--r-pill); font-size: 12px; letter-spacing: var(--tr-12);
  color: var(--ink-3); box-shadow: 0 0 0 1px var(--line);
}
.scDialOpt[data-on] { background: var(--ink-1); color: var(--white); box-shadow: none; }

/* ── the reading below the screen ──────────────────────────────── */
.readGrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-6); margin-top: var(--space-7); }
@media (max-width: 1100px) { .readGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .readGrid { grid-template-columns: minmax(0, 1fr); } }
.readCell { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-top: var(--space-3); border-top: 1px solid var(--line); }
.readCell .k {
  font-size: var(--t-10); font-weight: var(--w-semibold); letter-spacing: var(--tr-cap);
  text-indent: var(--tr-cap); text-transform: uppercase; color: var(--ink-3);
}
.readCell .v { font-size: var(--t-13); line-height: 1.5; letter-spacing: var(--tr-13); color: var(--ink-2); }
.readCell .v b { font-weight: var(--w-semibold); color: var(--ink-1); }

.verdict {
  display: flex; gap: var(--space-3); align-items: flex-start;
  padding: var(--space-3) var(--space-4); background: var(--indigo-wash); border-radius: var(--r-ctl);
  font-size: var(--t-13); line-height: 1.5; letter-spacing: var(--tr-13); color: var(--ink-2);
  margin-top: var(--space-6);
}
.verdict b { font-weight: var(--w-semibold); color: var(--ink-1); }
.verdict .tag {
  font-family: var(--font-mono); font-size: var(--t-10); color: var(--indigo-ink);
  text-transform: uppercase; letter-spacing: var(--tr-cap); flex: none; padding-top: 2px;
}

/* ══════════════════════════════════════════════════════════════════════
   GUEST-SPECIFIC PIECES
   Added to the mockup vocabulary. Everything still obeys the master
   suite's palette lock — ink, indigo, white and tints. RSVP state is
   the four-step density ladder, keyed on every screen that uses it:
   solid ink is what needs a person, and a settled guest is quiet.
   ══════════════════════════════════════════════════════════════════════ */

/* ── guest rows ────────────────────────────────────────────────── */
.gRow {
  display: grid; align-items: center; gap: 12px; padding: 8px 0;
  border-bottom: 1px solid var(--line-soft); min-width: 0;
}
.gRow:last-child { border-bottom: 0; }
.gRow[data-on] { background: var(--indigo-wash); border-radius: var(--r-chip); border-bottom-color: transparent; }
/* The qualifier drops to a second line in a narrow cell rather than
   shoving the name out of it. */
.gName { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex-wrap: wrap; }
.gName b { font-size: 12.5px; font-weight: var(--w-regular); letter-spacing: var(--tr-13); color: var(--ink-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gName .sub { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
/* Prose cells WRAP. Ellipsis in a table hides the one word that mattered,
   and a two-line cell is a smaller cost than a truncated sentence. Mono
   cells hold dates and amounts and stay on one line. */
.gCell { font-size: 11.5px; letter-spacing: var(--tr-12); color: var(--ink-2); min-width: 0; line-height: 1.4; overflow-wrap: anywhere; }
.gCell.mono { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gHead {
  display: grid; align-items: center; gap: 12px; padding-bottom: 7px;
  border-bottom: 1px solid var(--line); min-width: 0;
}
.gHead > span {
  font-size: 9.5px; font-weight: var(--w-semibold); letter-spacing: var(--tr-cap);
  text-indent: var(--tr-cap); text-transform: uppercase; color: var(--ink-3); white-space: nowrap;
}

/* ── the RSVP dot, on the density ladder ───────────────────────── */
.rsvp { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.rsvp .d { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.rsvp[data-r="none"] .d { background: var(--ink-1); }              /* no reply — needs a person */
.rsvp[data-r="sent"] .d { background: var(--ink-3); }              /* asked, waiting           */
.rsvp[data-r="yes"]  .d { background: var(--ink-4); }              /* settled, coming          */
.rsvp[data-r="no"]   .d { background: transparent; box-shadow: inset 0 0 0 1px var(--ink-4); }
.rsvp[data-r="new"]  .d { background: var(--indigo); }             /* replied since you looked */

/* ── meal / need chips ─────────────────────────────────────────── */
.tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: var(--r-xs);
  font-size: 10px; letter-spacing: var(--tr-10); white-space: nowrap;
  background: var(--wash); color: var(--ink-2);
}
.tag[data-strong] { background: var(--ink-1); color: var(--white); }
.tag[data-ring] { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-3); }
.tag[data-accent] { background: var(--indigo-wash); color: var(--indigo-ink); }
.tagRow { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }

/* ── counters ──────────────────────────────────────────────────── */
.countRow { display: flex; align-items: stretch; gap: 0; }
.count { display: flex; flex-direction: column; gap: 3px; padding: 0 16px; min-width: 0; }
.count + .count { border-left: 1px solid var(--line-soft); }
.count:first-child { padding-left: 0; }
.count .k { font-size: 10.5px; letter-spacing: var(--tr-11); color: var(--ink-3); white-space: nowrap; }
.count .v { font-size: 21px; font-weight: var(--w-semibold); letter-spacing: var(--tr-22); color: var(--ink-1); line-height: 1.05; }
.count .v u { text-decoration: none; font-size: 11px; font-weight: var(--w-regular); color: var(--ink-3); letter-spacing: var(--tr-11); }
.count .n { font-size: 10px; color: var(--ink-4); }

/* ── a stacked proportion bar, in ink density ──────────────────── */
.propBar { display: flex; height: 10px; border-radius: var(--r-pill); overflow: hidden; gap: 2px; background: transparent; }
.propSeg { height: 100%; }
.propSeg[data-p="1"] { background: var(--ink-1); }
.propSeg[data-p="2"] { background: var(--ink-3); }
.propSeg[data-p="3"] { background: var(--ink-4); }
.propSeg[data-p="4"] { background: var(--line); }
.propSeg[data-p="live"] { background: var(--indigo); }
.propSeg:first-child { border-radius: var(--r-pill) 0 0 var(--r-pill); }
.propSeg:last-child { border-radius: 0 var(--r-pill) var(--r-pill) 0; }

/* ── the floor plan ────────────────────────────────────────────── */
.plan { flex: 1; min-height: 0; position: relative; border-radius: var(--r-ctl); background: var(--wash); overflow: hidden; }
.plan svg { width: 100%; height: 100%; display: block; }
.plan svg text { font-family: var(--font-sans); }

/* ── one table, up close ───────────────────────────────────────── */
.tableWrap { position: relative; aspect-ratio: 1 / 1; width: 100%; max-width: 330px; margin: 0 auto; }
.tableDisc {
  position: absolute; inset: 21%; border-radius: 50%;
  background: var(--white); box-shadow: 0 0 0 1px var(--line-strong);
  display: grid; place-items: center; text-align: center; padding: 12px;
}
.tableDisc b { font-size: 15px; font-weight: var(--w-semibold); letter-spacing: var(--tr-15); color: var(--ink-1); display: block; }
.tableDisc span { font-size: 10.5px; color: var(--ink-3); display: block; margin-top: 2px; }
.seat {
  position: absolute; width: 58px; margin-left: -29px; margin-top: -17px;
  text-align: center; font-size: 9.5px; line-height: 1.25; letter-spacing: var(--tr-10); color: var(--ink-2);
}
.seat .chair {
  width: 22px; height: 22px; margin: 0 auto 3px; border-radius: 50%;
  background: var(--wash-2); display: grid; place-items: center;
  font-size: 8.5px; color: var(--ink-2);
}
.seat[data-empty] .chair { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-4); }
.seat[data-flag] .chair { background: var(--ink-1); color: var(--white); }
.seat[data-on] .chair { background: var(--indigo); color: var(--white); }

/* ── conflict pairs ────────────────────────────────────────────── */
.pair { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.pair:last-child { border-bottom: 0; }
.pair .who { font-size: 12px; letter-spacing: var(--tr-12); color: var(--ink-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair .who.r { text-align: right; }
.pair .rel {
  font-size: 9.5px; letter-spacing: var(--tr-cap); text-transform: uppercase; color: var(--ink-3);
  padding: 2px 8px; border-radius: var(--r-pill); background: var(--wash); white-space: nowrap;
}
.pair .rel[data-hard] { background: var(--ink-1); color: var(--white); }

/* ── check-in board ────────────────────────────────────────────── */
.board { display: grid; gap: 8px; min-width: 0; }
.boardRow {
  display: grid; grid-template-columns: 26px minmax(0,1fr) auto; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r-ctl); box-shadow: 0 0 0 1px var(--line); min-width: 0;
}
.boardRow[data-in] { background: var(--wash); box-shadow: none; }
.boardRow[data-in] .gName b { color: var(--ink-3); }
.boardTick { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line-strong); color: transparent; }
.boardRow[data-in] .boardTick { background: var(--ink-1); box-shadow: none; color: var(--white); }
.boardTick svg { width: 11px; height: 11px; display: block; }

/* ── small bar chart, single hue ───────────────────────────────── */
.barList { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.barRow { display: grid; grid-template-columns: minmax(72px, 108px) minmax(0,1fr) minmax(34px, auto); align-items: center; gap: 10px; }
.barRow .lab { font-size: 11px; letter-spacing: var(--tr-11); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barTrack { height: 9px; border-radius: var(--r-pill); background: var(--wash); overflow: hidden; }
.barFill { height: 100%; border-radius: var(--r-pill); background: var(--indigo); }
.barFill[data-ink] { background: var(--ink-1); }
.barFill[data-mid] { background: var(--ink-3); }
.barFill[data-low] { background: var(--ink-4); }
.barRow .n { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }

/* ── funnel, in ink density ────────────────────────────────────── */
.funnel { display: flex; flex-direction: column; gap: 6px; }
.funRow { display: grid; grid-template-columns: minmax(96px, 130px) minmax(0,1fr); align-items: center; gap: 12px; }
.funLab { font-size: 11.5px; letter-spacing: var(--tr-12); color: var(--ink-2); }
.funBar { height: 26px; border-radius: var(--r-chip); display: flex; align-items: center; padding: 0 9px; min-width: 0; }
.funBar span { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; }

/* ── a stamped envelope / send state ───────────────────────────── */
.sendStage { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0; }
.sendCell { padding: 0 14px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.sendCell + .sendCell { border-left: 1px solid var(--line-soft); }
.sendCell:first-child { padding-left: 0; }
.sendCell .k { font-size: 9.5px; font-weight: var(--w-semibold); letter-spacing: var(--tr-cap); text-transform: uppercase; color: var(--ink-3); }
.sendCell .v { display: flex; align-items: baseline; gap: 5px; font-size: 19px; font-weight: var(--w-semibold); letter-spacing: var(--tr-19, -0.026em); color: var(--ink-1); }
.sendCell .v u { text-decoration: none; font-size: 10.5px; font-weight: var(--w-regular); color: var(--ink-3); }
.sendCell .n { font-size: 10px; color: var(--ink-4); line-height: 1.4; }

/* ── the deadline strip ────────────────────────────────────────── */
.deadline {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  border-radius: var(--r-ctl); background: var(--ink-1); color: var(--on-ink-1);
  font-size: 11.5px; letter-spacing: var(--tr-rev);
}
.deadline b { font-weight: var(--w-semibold); }
.deadline .when { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--on-ink-2); }
.deadline svg { width: 13px; height: 13px; flex: none; }

/* ══════════════════════════════════════════════════════════════════════
   SEATING PIECES
   The room, the tables, the chairs and the queue of people not yet in
   one. Still the master suite's palette lock: ink, indigo, white and
   tints. Table fullness is ink DENSITY — an empty table is dark and
   insistent, a full one recedes — and indigo marks only what is
   selected or live.
   ══════════════════════════════════════════════════════════════════════ */

/* ── the room ──────────────────────────────────────────────────── */
.room { flex: 1; min-height: 0; position: relative; border-radius: var(--r-ctl); background: var(--wash); overflow: hidden; }
.room svg { width: 100%; height: 100%; display: block; }
.room svg text { font-family: var(--font-sans); }
.roomBar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.roomBar .grow { flex: 1; }

/* ── guest chips, the things you drag ──────────────────────────── */
.queue { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; align-content: flex-start; }
.gChip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px;
  border-radius: var(--r-pill); box-shadow: 0 0 0 1px var(--line);
  font-size: 11px; letter-spacing: var(--tr-11); color: var(--ink-1); background: var(--white);
  white-space: nowrap; cursor: grab;
}
.gChip .pip { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ink-4); }
.gChip[data-hard] { box-shadow: 0 0 0 1px var(--ink-1); }
.gChip[data-hard] .pip { background: var(--ink-1); }
.gChip[data-on] { background: var(--indigo); color: #fff; box-shadow: none; }
.gChip[data-on] .pip { background: rgba(255,255,255,0.7); }
.gChip .n { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-4); }
.gChip[data-on] .n { color: rgba(255,255,255,0.72); }
.gChip[data-ghost] { background: transparent; box-shadow: 0 0 0 1px dashed var(--line-strong); border: 1px dashed var(--line-strong); color: var(--ink-4); }

/* ── seat pips: a table's fullness at a glance ─────────────────── */
.pips { display: inline-flex; gap: 3px; align-items: center; }
.pip2 { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--ink-4); }
.pip2[data-empty] { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.pip2[data-flag] { background: var(--ink-1); }
.pip2[data-on] { background: var(--indigo); }

/* ── a table as a card in a list ───────────────────────────────── */
.tCard {
  display: grid; grid-template-columns: 34px minmax(0,1fr) auto; align-items: center; gap: 11px;
  padding: 9px 10px; border-radius: var(--r-ctl); box-shadow: 0 0 0 1px var(--line); min-width: 0;
  transition: box-shadow var(--dur) var(--curve), background var(--dur) var(--curve);
}
.tCard + .tCard { margin-top: 7px; }
.tCard:hover { background: var(--wash); }
.tCard[data-on] { box-shadow: 0 0 0 1px var(--indigo-line); background: var(--indigo-wash); }
.tCard[data-flag] { box-shadow: 0 0 0 1px var(--ink-1); }
.tNum {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-size: 12px; font-weight: var(--w-semibold); color: var(--white); background: var(--ink-4);
}
.tCard[data-fill="low"] .tNum { background: var(--ink-1); }
.tCard[data-fill="mid"] .tNum { background: var(--ink-3); }
.tCard[data-fill="full"] .tNum { background: var(--ink-4); }
.tCard[data-on] .tNum { background: var(--indigo); }
.tBody { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tBody b { font-size: 12px; font-weight: var(--w-regular); letter-spacing: var(--tr-12); color: var(--ink-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tBody span { font-size: 10px; color: var(--ink-3); }
.tRight { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; flex: none; }

/* ── the score gauge ───────────────────────────────────────────── */
.gauge { display: flex; align-items: center; gap: 14px; }
.gaugeArc { width: 96px; height: 96px; flex: none; position: relative; }
.gaugeArc svg { width: 100%; height: 100%; display: block; }
.gaugeNum {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 24px; font-weight: var(--w-semibold); letter-spacing: var(--tr-22); color: var(--ink-1);
}
.gaugeSide { min-width: 0; display: flex; flex-direction: column; gap: 4px; }

/* ── before / after ────────────────────────────────────────────── */
.diff { display: grid; grid-template-columns: minmax(0,1fr) 22px minmax(0,1fr); align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.diff:last-child { border-bottom: 0; }
.diffCell { font-size: 11.5px; letter-spacing: var(--tr-12); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.diffCell b { font-weight: var(--w-semibold); color: var(--ink-1); }
.diffArrow { color: var(--ink-4); display: grid; place-items: center; }
.diffArrow svg { width: 14px; height: 14px; }
.diffCell[data-to] { color: var(--ink-1); }

/* ── a mini plan thumbnail, for versions ───────────────────────── */
.mini { border-radius: var(--r-ctl); box-shadow: 0 0 0 1px var(--line); overflow: hidden; background: var(--white); }
.mini[data-on] { box-shadow: 0 0 0 1px var(--indigo-line); }
.miniPlan { aspect-ratio: 16 / 9; background: var(--wash); }
.miniPlan svg { width: 100%; height: 100%; display: block; }
.miniFoot { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line-soft); }
.miniFoot b { font-size: 11.5px; font-weight: var(--w-semibold); letter-spacing: var(--tr-12); color: var(--ink-1); }
.miniFoot span { font-size: 10px; color: var(--ink-3); }

/* ── the phone, for the guest's own view ───────────────────────── */
.phone {
  width: 264px; flex: none; margin: 0 auto;
  border-radius: 26px; background: var(--ink); padding: 9px;
  box-shadow: var(--float-ink);
}
.phoneSheet { background: var(--white); border-radius: 19px; overflow: hidden; min-height: 470px; display: flex; flex-direction: column; }
.phoneBar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px 4px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-4); }
.phoneBody { padding: 14px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.phoneHero { text-align: center; display: flex; flex-direction: column; gap: 4px; padding: 8px 0 4px; }
.phoneHero .k { font-size: 9.5px; letter-spacing: var(--tr-cap); text-transform: uppercase; color: var(--ink-3); }
.phoneHero .v { font-size: 40px; font-weight: var(--w-semibold); letter-spacing: -0.032em; line-height: 1; color: var(--ink-1); }
.phoneHero .s { font-size: 11px; color: var(--ink-2); }

/* ── zones legend ──────────────────────────────────────────────── */
.zoneKey { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.zoneItem { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: var(--tr-11); color: var(--ink-3); }
.zoneSwatch { width: 14px; height: 10px; border-radius: 3px; flex: none; }

/* ── shape picker ──────────────────────────────────────────────── */
.shapes { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.shape {
  padding: 12px 10px; border-radius: var(--r-ctl); box-shadow: 0 0 0 1px var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center;
}
.shape[data-on] { box-shadow: 0 0 0 1px var(--indigo-line); background: var(--indigo-wash); }
.shape svg { width: 46px; height: 34px; display: block; color: var(--ink-4); }
.shape[data-on] svg { color: var(--indigo); }
.shape b { font-size: 11px; font-weight: var(--w-semibold); letter-spacing: var(--tr-11); color: var(--ink-1); }
.shape span { font-size: 9.5px; color: var(--ink-3); line-height: 1.35; }

/* ── a horizontal stacked comparison strip ─────────────────────── */
.mixRow { display: grid; grid-template-columns: minmax(64px, 92px) minmax(0,1fr) auto; align-items: center; gap: 10px; }
.mixRow + .mixRow { margin-top: 8px; }
.mixRow .lab { font-size: 11px; color: var(--ink-2); letter-spacing: var(--tr-11); }
.mixRow .n { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }

/* ── solver log ────────────────────────────────────────────────── */
.logRow {
  display: grid; grid-template-columns: 16px minmax(0,1fr) auto; align-items: baseline; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid var(--line-soft); font-size: 11.5px; letter-spacing: var(--tr-12);
}
.logRow:last-child { border-bottom: 0; }
.logRow .i { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-4); }
.logRow .m { color: var(--ink-2); min-width: 0; line-height: 1.45; }
.logRow .m b { font-weight: var(--w-semibold); color: var(--ink-1); }
.logRow .r { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); white-space: nowrap; }

/* ══════════════════════════════════════════════════════════════════════
   SHARED EXTRAS
   The few pieces the money, supplier, day, comms and planner decks need
   that the earlier kits do not carry. Same palette lock throughout.
   ══════════════════════════════════════════════════════════════════════ */

/* ── a plain chart frame ───────────────────────────────────────── */
.chartInk { min-width: 0; }
.chartInk svg { display: block; width: 100%; height: auto; }
.chartInk svg text { font-family: var(--font-sans); }

/* ── swimlanes: parallel tracks over one clock ─────────────────── */
.lanes { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.laneHead { display: grid; grid-template-columns: 108px minmax(0,1fr); gap: 12px; align-items: center; }
.laneScale { position: relative; height: 15px; }
.laneScale span { position: absolute; transform: translateX(-50%); font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-4); white-space: nowrap; }
/* The first and last ticks anchor to the ends rather than centring on
   them, so neither hangs outside the track it is labelling. */
.laneScale span:first-child { transform: none; }
.laneScale span:last-child { transform: translateX(-100%); }
.laneRow { display: grid; grid-template-columns: 108px minmax(0,1fr); gap: 12px; align-items: center; }
.laneName { font-size: 11px; letter-spacing: var(--tr-11); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.laneTrack { position: relative; height: 26px; border-radius: var(--r-xs); background: var(--wash); }
.laneBlock {
  position: absolute; top: 3px; height: 20px; border-radius: 4px;
  display: flex; align-items: center; padding: 0 7px; overflow: hidden;
  font-size: 10px; letter-spacing: var(--tr-10); white-space: nowrap;
  background: var(--ink-4); color: var(--ink-1);
}
/* An unlabelled block carries no padding, so a narrow one is exactly as
   wide as the time it represents. */
.laneBlock:empty { padding: 0; }
.laneBlock[data-t="1"] { background: var(--ink-1); color: var(--white); }
.laneBlock[data-t="2"] { background: var(--ink-3); color: var(--white); }
.laneBlock[data-t="live"] { background: var(--indigo); color: var(--white); }
.laneBlock[data-t="ghost"] { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-3); }
/* The marker is 6px wide so its dot sits inside it; the 1px rule is
   painted as a centred background. A pseudo-element hanging outside a
   1px box counts as overflow on every ancestor. */
.laneNow {
  position: absolute; top: -4px; bottom: -4px; width: 6px; margin-left: -2.5px; z-index: 2;
  background-image: linear-gradient(var(--indigo), var(--indigo));
  background-size: 1px 100%; background-position: center top; background-repeat: no-repeat;
}
.laneNow::after {
  content: ""; position: absolute; top: 0; left: 0;
  width: 6px; height: 6px; border-radius: 50%; background: var(--indigo);
}

/* ── browser chrome, for the guest-facing website ──────────────── */
.browser { border-radius: 10px; box-shadow: 0 0 0 1px var(--line), var(--float); overflow: hidden; background: var(--white); min-width: 0; }
.browserBar { display: flex; align-items: center; gap: 8px; padding: 8px 11px; background: var(--wash); border-bottom: 1px solid var(--line-soft); }
.browserDots { display: flex; gap: 4px; flex: none; }
.browserDots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); display: block; }
.browserUrl {
  flex: 1; min-width: 0; height: 20px; border-radius: var(--r-pill); background: var(--white);
  box-shadow: inset 0 0 0 1px var(--line); display: flex; align-items: center; padding: 0 9px;
  font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.browserBody { padding: 0; }

/* ── the year strip ────────────────────────────────────────────── */
.yearStrip { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 2px; }
.monthCell {
  padding: 8px 4px; border-radius: var(--r-xs); background: var(--wash);
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0;
}
.monthCell b { font-size: 9.5px; font-weight: var(--w-semibold); letter-spacing: var(--tr-cap); text-transform: uppercase; color: var(--ink-3); }
.monthCell .v { font-family: var(--font-mono); font-size: 11px; color: var(--ink-1); }
.monthCell[data-now] { background: var(--indigo-wash); }
.monthCell[data-now] b, .monthCell[data-now] .v { color: var(--indigo-ink); }
.monthCell[data-past] .v { color: var(--ink-4); }

/* ── ledger ────────────────────────────────────────────────────── */
.ledger { display: flex; flex-direction: column; min-width: 0; }
.ledgerRow {
  display: grid; align-items: center; gap: 12px; padding: 8px 0;
  border-bottom: 1px solid var(--line-soft); min-width: 0;
}
.ledgerRow:last-child { border-bottom: 0; }
.ledgerRow[data-total] { border-top: 1px solid var(--line-strong); border-bottom: 0; padding-top: 11px; margin-top: 3px; }
.ledgerRow[data-total] .amt { font-size: 14px; font-weight: var(--w-semibold); color: var(--ink-1); }
.amt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--ink-1); text-align: right; white-space: nowrap; }
.amt[data-mut] { color: var(--ink-3); }
.amt[data-neg] { color: var(--ink-1); }

/* ── a compact status dot for pipelines ────────────────────────── */
.sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.sdot[data-s="1"] { background: var(--ink-1); }
.sdot[data-s="2"] { background: var(--ink-3); }
.sdot[data-s="3"] { background: var(--ink-4); }
.sdot[data-s="4"] { background: transparent; box-shadow: inset 0 0 0 1px var(--ink-4); }
.sdot[data-s="live"] { background: var(--indigo); }

/* ── a portfolio card, for planner mode ────────────────────────── */
.wedCard {
  display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: center; gap: 12px;
  padding: 11px 12px; border-radius: var(--r-ctl); box-shadow: 0 0 0 1px var(--line); min-width: 0;
  transition: background var(--dur) var(--curve);
}
.wedCard + .wedCard { margin-top: 7px; }
.wedCard:hover { background: var(--wash); }
.wedCard[data-on] { box-shadow: 0 0 0 1px var(--indigo-line); background: var(--indigo-wash); }
.wedDate {
  width: 44px; flex: none; border-radius: var(--r-chip); background: var(--wash-2);
  display: flex; flex-direction: column; align-items: center; padding: 5px 0;
}
.wedDate b { font-family: var(--font-mono); font-size: 13px; color: var(--ink-1); line-height: 1; }
.wedDate span { font-size: 8.5px; letter-spacing: var(--tr-cap); text-transform: uppercase; color: var(--ink-3); }
.wedCard[data-on] .wedDate { background: var(--indigo); }
.wedCard[data-on] .wedDate b, .wedCard[data-on] .wedDate span { color: #fff; }
.wedBody { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.wedBody b { font-size: 12.5px; font-weight: var(--w-regular); letter-spacing: var(--tr-13); color: var(--ink-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wedBody span { font-size: 10.5px; color: var(--ink-3); }
.wedRight { display: flex; align-items: center; gap: 8px; flex: none; }

/* ── an email preview ──────────────────────────────────────────── */
.mailPrev { border-radius: var(--r-ctl); box-shadow: 0 0 0 1px var(--line); overflow: hidden; min-width: 0; }
.mailHead { padding: 10px 13px; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 3px; background: var(--wash); }
.mailHead b { font-size: 12px; font-weight: var(--w-semibold); letter-spacing: var(--tr-12); color: var(--ink-1); }
.mailHead span { font-size: 10px; color: var(--ink-3); }
.mailBody { padding: 14px 16px; font-size: 12px; line-height: 1.65; color: var(--ink-2); }
.mailBody p { margin: 0 0 0.85em; }
.mailBody p:last-child { margin: 0; }
.mailBody b { font-weight: var(--w-semibold); color: var(--ink-1); }
/* ══════════════════════════════════════════════════════════════════════
   SIGNAL STUDIO · THE WEDDINGS DEMO
   The product itself on the Studio Floor, not a mockup inside a deck.

   Everything above this file is reused unchanged: the tokens and the
   floor/rail/stage/sheet from the home shell, and the screen vocabulary
   from the four content stylesheets. This file adds only what has never
   been drawn — the +, the picker, the seed, the mode row — and lifts the
   content vocabulary from mockup scale to real scale.

   HELD TO THE PALETTE LOCK. This is product, not apparatus: ink, indigo,
   white and tints of those three. No green, no amber, no red. State is
   ink density and fill; indigo marks what is live or selected and never
   what is wrong.
   ══════════════════════════════════════════════════════════════════════ */

:root {
  /* The rare tier. Two stylesheets in this suite reserve 400ms for "three
     product moments" and neither ever named one, so the token was never
     written. This is the first moment: the section being seeded. The other
     two — the first yes, and the last chair — wait until there is data to
     move. */
  --dur-rare: 400ms;
}

/* The decks pinned every view to a 1140px sheet because they were
   composing screenshots. This is the running product, so it flows. */
.sheetBody > .view,
.sheetBody { min-width: 0; }
@media (min-width: 861px) {
  .sheetBody { overflow-x: auto; }
  .sheetBody > .view { min-width: 0; }
}

body { overflow: hidden; }
.floor { --rail: 236px; }
.sheetBody { padding: 0; }

/* ── the rail, as product navigation ──────────────────────────── */
.railHead { padding: 18px 18px 14px; }
.railScroll { padding: 0 12px 12px; }
.railItem { grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; padding: 8px; }
.railItem > .g { display: inline-flex; color: currentColor; opacity: 0.86; }
.railItem > .g svg { width: 17px; height: 17px; display: block; }
.railItem > span { font-size: var(--t-13); letter-spacing: var(--tr-13); }
.railItem > em {
  font-style: normal; font-family: var(--font-mono); font-size: var(--t-10);
  color: var(--on-ink-3); font-variant-numeric: tabular-nums;
}
.railItem[aria-current="true"] > .g { opacity: 1; color: var(--indigo-on-ink); }

/* ── the +, which has never existed ───────────────────────────────
   A destination is filled; this is not a destination. It is drawn as an
   outline so the rail reads as "four places, and a way to add another"
   rather than as five places, one of which behaves strangely. */
.railAdd {
  display: grid; grid-template-columns: 20px minmax(0, 1fr); align-items: center; gap: var(--space-2);
  width: 100%; text-align: left; margin-top: var(--space-2); padding: 8px;
  border-radius: var(--r-ctl); color: var(--on-ink-3);
  border: 1px dashed var(--chrome-line); background: transparent;
  transition: color var(--dur) var(--curve), border-color var(--dur) var(--curve), background var(--dur) var(--curve);
}
.railAdd:hover, .railAdd[data-open] {
  color: var(--on-ink-1); border-color: rgba(255, 255, 255, 0.28); background: var(--chrome);
}
.railAdd .g { display: inline-flex; }
.railAdd .g svg { width: 16px; height: 16px; display: block; }
.railAdd span { font-size: var(--t-12); letter-spacing: var(--tr-12); }

/* A section that has just arrived announces itself once, then stops. */
@keyframes railArrive {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: none; }
}
.railGroup[data-new] { animation: railArrive var(--dur-rare) var(--curve) both; }
@media (prefers-reduced-motion: reduce) { .railGroup[data-new] { animation: none; } }

/* ── the sheet head, with the mode row in its right cell ──────── */
.sheetHead { padding: 18px var(--space-7) 15px; align-items: center; }
.sheetHead h1 { font-size: var(--t-22); letter-spacing: var(--tr-22); }
.headL { min-width: 0; }
.headSub {
  display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap;
  margin-top: 5px; font-size: var(--t-12); letter-spacing: var(--tr-12); color: var(--ink-3);
}
.headSub b { font-weight: var(--w-regular); color: var(--ink-2); }
.headSub .mono { font-family: var(--font-mono); }

.seg { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
.segBtn {
  height: 28px; padding: 0 10px; border-radius: var(--r-chip);
  font-size: var(--t-12); letter-spacing: var(--tr-12); color: var(--ink-3);
  white-space: nowrap; transition: background var(--dur) var(--curve), color var(--dur) var(--curve);
}
.segBtn:hover { background: var(--wash); color: var(--ink-1); }
.segBtn[aria-current="true"] { background: var(--ink-1); color: #fff; }

/* ── the body ─────────────────────────────────────────────────── */
.appBody { height: 100%; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--space-6) var(--space-7) var(--space-7); }
.appBody::-webkit-scrollbar { width: 10px; }
.appBody::-webkit-scrollbar-thumb { background: var(--line); border-radius: var(--r-pill); border: 3px solid #fff; }
.appBody::-webkit-scrollbar-track { background: transparent; }

.rowGap { display: flex; flex-direction: column; gap: var(--space-6); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--space-6); align-items: start; }
/* The side pane stacks before the table has to give up columns. */
@media (max-width: 1280px) { .two { grid-template-columns: minmax(0, 1fr); } }

.pane { min-width: 0; }
.paneHead {
  display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap;
  padding-bottom: var(--space-3); margin-bottom: var(--space-3); border-bottom: 1px solid var(--line-soft);
}
.paneHead b { font-size: var(--t-13); font-weight: var(--w-semibold); letter-spacing: var(--tr-13); }
.paneHead span { font-size: var(--t-11); color: var(--ink-3); }
.paneHead .grow { flex: 1; }

/* ── content vocabulary, lifted to real scale ─────────────────────
   The four stylesheets above were composed for a screenshot inside a
   deck. At running size the same components need one step more type. */
.appBody .gRow { padding: 10px var(--space-3); }
.appBody .gCell { font-size: var(--t-12); }
.appBody .gName b { font-size: var(--t-13); }
.appBody .gHead > span { font-size: var(--t-10); }
.appBody .scRow { padding: 10px var(--space-3); }
.appBody .count .v { font-size: var(--t-22); }

/* ── figures ──────────────────────────────────────────────────── */
.figRow { display: flex; flex-wrap: wrap; gap: var(--space-7); align-items: flex-end; }
.fig { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fig b {
  font-size: 30px; font-weight: var(--w-semibold); letter-spacing: var(--tr-28);
  line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink-1);
}
.fig b.sm { font-size: var(--t-22); letter-spacing: var(--tr-22); }
.fig span { font-size: var(--t-11); color: var(--ink-3); letter-spacing: var(--tr-11); }
.fig[data-mut] b { color: var(--ink-3); }

/* ── the picker: what the + opens ─────────────────────────────── */
.pick { max-width: 760px; }
.pickCards { display: grid; grid-template-columns: repeat(auto-fit, minmax(212px, 1fr)); gap: var(--space-3); margin-top: var(--space-5); }
.pickCard {
  text-align: left; padding: var(--space-5); border-radius: var(--r-card);
  box-shadow: 0 0 0 1px var(--line); background: #fff;
  display: flex; flex-direction: column; gap: var(--space-2); min-width: 0;
  transition: box-shadow var(--dur) var(--curve), transform var(--dur) var(--curve);
}
.pickCard:hover:not([disabled]) { box-shadow: 0 0 0 1px var(--indigo-line), 0 6px 20px rgba(17, 17, 17, 0.07); transform: translateY(-1px); }
.pickCard[disabled] { cursor: default; }
.pickCard[disabled] b, .pickCard[disabled] p { color: var(--ink-4); }
.pickCard .g { color: var(--ink-2); }
.pickCard[disabled] .g { color: var(--ink-4); }
.pickCard .g svg { width: 22px; height: 22px; display: block; }
.pickCard b { font-size: var(--t-15); font-weight: var(--w-semibold); letter-spacing: var(--tr-15); }
.pickCard p { margin: 0; font-size: var(--t-12); line-height: 1.5; color: var(--ink-3); }
.pickCard .later {
  align-self: flex-start; margin-top: auto; font-size: var(--t-10); letter-spacing: var(--tr-cap);
  text-transform: uppercase; color: var(--ink-4); padding-top: var(--space-2);
}

/* ── the one question the + asks ──────────────────────────────── */
.ask { max-width: 460px; }
.askField { display: flex; flex-direction: column; gap: var(--space-2); margin: var(--space-5) 0 var(--space-3); }
.askField label { font-size: var(--t-10); font-weight: var(--w-semibold); letter-spacing: var(--tr-cap); text-transform: uppercase; color: var(--ink-3); }
.askField input {
  height: 46px; padding: 0 var(--space-4); border-radius: var(--r-ctl); border: 0;
  box-shadow: 0 0 0 1px var(--line); font: inherit; font-size: var(--t-18);
  letter-spacing: var(--tr-18); color: var(--ink-1); background: #fff;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.askField input:focus { outline: 0; box-shadow: 0 0 0 1px var(--indigo-line), 0 0 0 4px var(--indigo-ring); }
.askNote { font-size: var(--t-12); line-height: 1.55; color: var(--ink-3); margin: 0; }

/* ── the seed: the rare tier, spent once ──────────────────────────
   400ms, and the first time this suite has spent it. The order is the
   argument: content lands, and only then does navigation appear. */
.seed { max-width: 560px; }
.seedList { display: flex; flex-direction: column; gap: 0; margin: var(--space-5) 0 0; }
/* The resting state is VISIBLE and the animation runs backwards into it.
   Parking content at opacity 0 and animating forwards means that if the
   animation never runs — a background tab, a throttled renderer, motion
   turned off — the page is permanently blank with no error. */
.seedLine {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; gap: var(--space-3);
  padding: 13px 0; border-bottom: 1px solid var(--line-soft);
  animation: seedIn var(--dur-rare) var(--curve) backwards;
}
@keyframes seedIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .seedLine, .seedDone { animation: none; }
}
.seedLine .g { display: inline-flex; color: var(--indigo); }
.seedLine .g svg { width: 16px; height: 16px; display: block; }
.seedLine b { font-size: var(--t-13); font-weight: var(--w-regular); color: var(--ink-1); letter-spacing: var(--tr-13); }
.seedLine em {
  font-style: normal; font-family: var(--font-mono); font-size: var(--t-11);
  color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.seedDone {
  display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
  margin-top: var(--space-6);
  animation: seedIn var(--dur-settle) var(--curve) backwards;
}

/* ── buttons ──────────────────────────────────────────────────── */
.btn {
  height: 34px; padding: 0 14px; border-radius: var(--r-ctl); font-size: var(--t-13);
  letter-spacing: var(--tr-13); color: var(--ink-2); box-shadow: 0 0 0 1px var(--line);
  display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap;
  transition: background var(--dur) var(--curve), color var(--dur) var(--curve), box-shadow var(--dur) var(--curve);
}
.btn:hover { background: var(--wash); color: var(--ink-1); }
.btn[data-primary] { background: var(--indigo); color: #fff; box-shadow: none; }
.btn[data-primary]:hover { background: #4338ca; color: #fff; }
.btn[data-ghost] { box-shadow: none; color: var(--ink-3); }
.btn svg { width: 15px; height: 15px; display: block; }

/* ── the empty states nobody drew ─────────────────────────────── */
.empty {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3);
  padding: var(--space-8) 0; max-width: 52ch;
}
.empty b { font-size: var(--t-18); font-weight: var(--w-semibold); letter-spacing: var(--tr-18); }
.empty p { margin: 0; font-size: var(--t-13); line-height: 1.6; color: var(--ink-3); }
.empty .row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-2); }

/* ── the phone frame ──────────────────────────────────────────────
   One surface, composed at 390 rather than squeezed from 1140. It sits
   beside the desk view so the difference is arguable rather than
   asserted. */
.withPhone { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: var(--space-7); align-items: start; }
@media (max-width: 1240px) { .withPhone { grid-template-columns: minmax(0, 1fr); } .phoneCol { display: none; } }
.phoneCol { display: flex; flex-direction: column; gap: var(--space-3); }
.phoneCap { font-size: var(--t-11); color: var(--ink-3); letter-spacing: var(--tr-11); }
.wdPhone {
  width: 390px; border-radius: 26px; background: var(--ink); padding: 10px;
  box-shadow: var(--float-ink); overflow: hidden;
}
.wdPhoneIn { background: #fff; border-radius: 18px; overflow: hidden; }
.wdPhoneBar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px var(--space-4) 5px; font-family: var(--font-mono);
  font-size: var(--t-10); color: var(--ink-3);
}
.wdPhoneHead { padding: var(--space-2) var(--space-4) var(--space-3); border-bottom: 1px solid var(--line-soft); }
.wdPhoneHead b { display: block; font-size: var(--t-15); font-weight: var(--w-semibold); letter-spacing: var(--tr-15); }
.wdPhoneHead span { font-size: var(--t-11); color: var(--ink-3); }
.wdPhoneBody { padding: var(--space-2) 0 var(--space-3); max-height: 470px; overflow-y: auto; }
.pRow {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3);
  align-items: center; padding: 11px var(--space-4); border-bottom: 1px solid var(--line-soft);
}
.pRow:last-child { border-bottom: 0; }
.pRow b { font-size: var(--t-14); font-weight: var(--w-regular); letter-spacing: var(--tr-14); }
.pRow span { display: block; font-size: var(--t-11); color: var(--ink-3); margin-top: 2px; }
.pSeat {
  height: 34px; min-width: 74px; padding: 0 12px; border-radius: var(--r-ctl);
  background: var(--indigo); color: #fff; font-size: var(--t-12); letter-spacing: var(--tr-12);
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; flex: none;
}
.pSeat[data-ghost] { background: transparent; color: var(--ink-2); box-shadow: 0 0 0 1px var(--line); }
.wdPhoneFoot {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line-soft);
  font-size: var(--t-11); color: var(--ink-3);
}

/* ── the seeded plan, shown in core ───────────────────────────── */
.plan { display: flex; flex-direction: column; }
.planRow {
  display: grid; grid-template-columns: 96px 16px minmax(0, 1fr) auto; gap: var(--space-3);
  align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line-soft);
}
.planRow:last-child { border-bottom: 0; }
.planRow .when { font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.planRow .dot { justify-self: center; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); }
.planRow[data-now] .dot { background: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-ring); }
.planRow[data-done] .dot { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.planRow b { font-size: var(--t-13); font-weight: var(--w-regular); color: var(--ink-1); letter-spacing: var(--tr-13); }
.planRow[data-done] b { color: var(--ink-3); }
.planRow em { font-style: normal; font-size: var(--t-11); color: var(--ink-4); white-space: nowrap; }

/* ── misc ─────────────────────────────────────────────────────── */
.hint { font-size: var(--t-12); line-height: 1.6; color: var(--ink-3); max-width: 72ch; }
.hint b { font-weight: var(--w-semibold); color: var(--ink-2); }
.dl { display: flex; flex-wrap: wrap; gap: var(--space-6) var(--space-7); }
.dl > div { display: flex; flex-direction: column; gap: 3px; }
.dl dt { font-size: var(--t-10); font-weight: var(--w-semibold); letter-spacing: var(--tr-cap); text-transform: uppercase; color: var(--ink-3); margin: 0; }
.dl dd { margin: 0; font-size: var(--t-13); color: var(--ink-1); }

.demoToggle {
  display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--r-ctl); background: var(--chrome);
}
.demoToggle button {
  height: 24px; padding: 0 9px; border-radius: var(--r-chip); font-size: var(--t-11);
  color: var(--on-ink-3); white-space: nowrap;
  transition: background var(--dur) var(--curve), color var(--dur) var(--curve);
}
.demoToggle button[aria-current="true"] { background: var(--chrome-active); color: var(--on-ink-1); }

/* The plan dot carries weight on the severity ladder, so a row that
   needs a person reads heavier than one that is merely coming up. */
.planRow[data-sev="2"] .dot { background: var(--ink-3); }
.planRow[data-sev="3"] .dot { background: var(--ink-4); }
.planRow[data-now] .dot,
.planRow[data-now][data-sev] .dot { background: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-ring); }
.planRow[data-done] .dot,
.planRow[data-done][data-sev] .dot { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }

/* ── a mode that is named but not yet drawn ───────────────────────
