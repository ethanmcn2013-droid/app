   Honest rather than blank: it says what will live here and which
   prototype it comes from, so the next pass has somewhere to start. */
.next { display: grid; grid-template-columns: repeat(auto-fit, minmax(238px, 1fr)); gap: var(--space-3); }
.nextCard {
  padding: var(--space-5); border-radius: var(--r-card); background: var(--wash);
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.nextCard b { font-size: var(--t-13); font-weight: var(--w-semibold); letter-spacing: var(--tr-13); }
.nextCard p { margin: 0; font-size: var(--t-12); line-height: 1.5; color: var(--ink-3); }
.nextCard em {
  font-style: normal; margin-top: auto; padding-top: var(--space-2);
  font-family: var(--font-mono); font-size: var(--t-10); color: var(--ink-4);
}

/* ── tables scroll in their own box ───────────────────────────────
   A table with fixed columns in a narrowed pane clips its right-hand
   columns silently. It gets a scroll container and a stated minimum, so
   the row is either whole or scrollable — never quietly cut. */
.tbl { overflow-x: auto; overscroll-behavior-x: contain; }
.tbl::-webkit-scrollbar { height: 8px; }
.tbl::-webkit-scrollbar-thumb { background: var(--line); border-radius: var(--r-pill); }
.tbl::-webkit-scrollbar-track { background: transparent; }
.tblIn { min-width: 600px; }
/* ══════════════════════════════════════════════════════════════════════
   THE FIFTEEN MODES · the chrome they needed
   Held to the palette lock: ink, indigo, white and tints. No hue carries
   state anywhere in this file.
   ══════════════════════════════════════════════════════════════════════ */

/* ── a rule the product owes somebody ─────────────────────────────
   Used where a screen holds other people's information, or decides who
   may see what. Indigo, because it marks a live rule — never the
   severity ladder, which would read as "this is going wrong". */
.guard {
  margin-top: var(--space-6); padding: var(--space-5) var(--space-5) var(--space-4);
  border-radius: var(--r-card); background: var(--indigo-wash);
  border: 1px solid var(--indigo-line);
}
.guard b { display: block; font-size: var(--t-13); font-weight: var(--w-semibold); letter-spacing: var(--tr-13); color: var(--indigo-ink); }
.guard p { margin: 6px 0 0; font-size: var(--t-12); line-height: 1.6; color: var(--ink-2); max-width: 68ch; }
.guard .row { display: flex; gap: var(--space-2); flex-wrap: wrap; }

/* ── shares of a number ───────────────────────────────────────────
   Proportion is not severity. The ink ladder means "needs a person"
   down to "moving"; drawing families on it put whoever gave least in
   the palest step, directly above a segment labelled Unfunded. Indigo
   tints carry proportion, and the names live in the key. */
.shareBar { display: flex; gap: 2px; height: 34px; margin: var(--space-3) 0 var(--space-5); }
.shareSeg { display: block; border-radius: var(--r-xs); min-width: 3px; }
.shareSeg[data-i="1"] { background: var(--indigo); }
.shareSeg[data-i="2"] { background: rgba(79, 70, 229, 0.62); }
.shareSeg[data-i="3"] { background: rgba(79, 70, 229, 0.36); }
.shareSeg[data-i="gap"] { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.shareKey { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: var(--space-4); }
.shareItem { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: var(--space-3); align-items: start; }
.shareItem i { width: 10px; height: 10px; border-radius: 3px; margin-top: 4px; font-style: normal; }
.shareItem i[data-i="1"] { background: var(--indigo); }
.shareItem i[data-i="2"] { background: rgba(79, 70, 229, 0.62); }
.shareItem i[data-i="3"] { background: rgba(79, 70, 229, 0.36); }
.shareItem i[data-i="gap"] { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.shareItem b { display: block; font-size: var(--t-13); font-weight: var(--w-regular); color: var(--ink-1); }
.shareItem span { display: block; font-size: var(--t-11); color: var(--ink-3); line-height: 1.5; margin-top: 2px; }

/* ── a check, and whether it actually ran ─────────────────────────
   Three states, not two. A check that could not run is not a check that
   passed, and it must not be drawn like one. */
.checkRow {
  display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: var(--space-3);
  align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line-soft);
}
.checkRow:last-child { border-bottom: 0; }
.checkRow b { display: block; font-size: var(--t-13); font-weight: var(--w-regular); color: var(--ink-1); letter-spacing: var(--tr-13); }
.checkRow span { display: block; font-size: var(--t-11); color: var(--ink-3); line-height: 1.55; margin-top: 3px; }
.checkMark { width: 15px; height: 15px; border-radius: 50%; margin-top: 2px; position: relative; }
.checkRow[data-k="pass"] .checkMark { background: var(--ink-1); }
.checkRow[data-k="pass"] .checkMark::after {
  content: ""; position: absolute; left: 4px; top: 4.5px; width: 6px; height: 3px;
  border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg);
}
.checkRow[data-k="unrun"] .checkMark { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-4); }
.checkRow[data-k="unrun"] .checkMark::after {
  content: ""; position: absolute; left: 6.5px; top: 4px; width: 2px; height: 7px;
  border-radius: 1px; background: var(--ink-4);
}
.checkRow[data-k="unrun"] b { color: var(--ink-3); }

.blocker {
  padding: var(--space-5); border-radius: var(--r-card);
  background: var(--wash-2); border: 1px solid var(--line-strong);
}
.blocker b { display: block; font-size: var(--t-15); font-weight: var(--w-semibold); letter-spacing: var(--tr-15); }
.blocker p { margin: 5px 0 0; font-size: var(--t-12); line-height: 1.6; color: var(--ink-2); max-width: 64ch; }

/* ── zones, as three tags on a floor ──────────────────────────── */
.zoneRow { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-4); }
.zoneTag {
  padding: 4px 10px; border-radius: var(--r-pill); font-size: var(--t-11);
  color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line);
}
.zoneTag[data-on] { background: var(--ink-1); color: #fff; box-shadow: none; }

/* ── saved plans, side by side ────────────────────────────────── */
.planGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(232px, 1fr)); gap: var(--space-4); }
.planCard {
  border-radius: var(--r-card); overflow: hidden; background: #fff;
  box-shadow: 0 0 0 1px var(--line); display: flex; flex-direction: column;
}
.planCard[data-live] { box-shadow: 0 0 0 2px var(--indigo); }
.planCard .miniPlan { border-radius: 0; }
.planFoot { padding: var(--space-3) var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: 2px; }
.planFoot b { font-size: var(--t-13); font-weight: var(--w-semibold); letter-spacing: var(--tr-13); }
.planFoot span { font-size: var(--t-11); color: var(--ink-3); }
.planFoot em {
  font-style: normal; font-family: var(--font-mono); font-size: var(--t-10);
  color: var(--ink-4); margin-top: 4px;
}
.planCard[data-live] .planFoot em { color: var(--indigo-ink); }

/* ── the contact sheet, which exists to be on paper ───────────── */
.sheetPaper {
  border-radius: var(--r-card); background: #fff; box-shadow: 0 0 0 1px var(--line);
  padding: var(--space-6) var(--space-7) var(--space-7); max-width: 780px;
}
.paperHead {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4);
  flex-wrap: wrap; padding-bottom: var(--space-4); border-bottom: 1px solid var(--ink-1);
}
.paperHead b { display: block; font-size: var(--t-18); font-weight: var(--w-semibold); letter-spacing: var(--tr-18); }
.paperHead > div > span { font-size: var(--t-12); color: var(--ink-3); }
.paperNote { font-size: var(--t-11); color: var(--ink-4); }
.paperGroup { margin-top: var(--space-6); }
.paperGroup h4 {
  margin: 0 0 var(--space-2); font-size: var(--t-10); font-weight: var(--w-semibold);
  letter-spacing: var(--tr-cap); text-indent: var(--tr-cap); text-transform: uppercase; color: var(--ink-3);
}
.paperRow {
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) 140px 92px;
  gap: var(--space-3); align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line-soft);
}
.paperRow:last-child { border-bottom: 0; }
.paperRow b { font-size: var(--t-13); font-weight: var(--w-regular); color: var(--ink-1); }
.paperRow span { font-size: var(--t-12); color: var(--ink-2); }
.paperRow .mono { font-family: var(--font-mono); font-size: var(--t-12); color: var(--ink-1); }
.paperRow em { font-style: normal; font-family: var(--font-mono); font-size: var(--t-11); color: var(--ink-3); text-align: right; }
@media (max-width: 860px) {
  .paperRow { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .paperRow em { text-align: left; }
}

/* The floor plan keeps its aspect and never outgrows the sheet. */
.appBody .room { max-width: 100%; }
.appBody .room svg { width: 100%; height: auto; display: block; }

/* The allergy chip sits on the baseline of the text beside it. */
.appBody .sev { display: inline-block; vertical-align: middle; }

/* ── the console's three decisions ────────────────────────────────
   Read from data attributes on the root (<html> standalone, .deck in the
   Design Console — the console scopes these bare [data-…] selectors).
   Every value stays on the declared ladders: "compact" is one step down
   the spacing ladder, "quiet" one step down the type ramp. */
[data-density="compact"] .appBody .gRow { padding-top: 6px; padding-bottom: 6px; }
[data-density="compact"] .appBody .planRow { padding-top: 7px; padding-bottom: 7px; }
[data-density="compact"] .appBody .checkRow { padding-top: 8px; padding-bottom: 8px; }
[data-density="compact"] .appBody .paperRow { padding-top: 6px; padding-bottom: 6px; }
[data-figures="quiet"] .fig b { font-size: var(--t-22); letter-spacing: var(--tr-22); }
[data-figures="quiet"] .fig b.sm { font-size: var(--t-18); letter-spacing: var(--tr-18); }
[data-moments="off"] .seedLine,
[data-moments="off"] .seedDone,
[data-moments="off"] .railGroup[data-new] { animation: none; }
</style>

<script>

/* ══════════════════════════════════════════════════════════════════════
   THE MOCKUP KIT
   Small builders for the pieces a home screen is made of. Everything
   obeys the palette lock: ink, indigo, white, and the four-step density
   ladder for state. No builder here accepts a colour argument.
   ══════════════════════════════════════════════════════════════════════ */

function h(tag, attrs, kids) {
  const n = document.createElement(tag);
  /* h(tag, "some text") is the obvious thing to write and was silently
     losing the string: for..in over a primitive walks its indices, so the
     text became attributes named 0, 1, 2 and no child node was ever
     added. Nothing threw, so it read as missing copy rather than a bug.
     Second argument that is not a plain attribute bag is children. */
  if (typeof attrs === "string" || Array.isArray(attrs) || (attrs && attrs.nodeType)) { kids = attrs; attrs = null; }
  if (attrs) for (const k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (attrs[k] === true) n.setAttribute(k, "");
    else if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  if (kids) for (const c of [].concat(kids)) if (c != null && c !== false)
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  return n;
}
const frag = (kids) => { const f = document.createDocumentFragment(); [].concat(kids).forEach((k) => k && f.appendChild(k)); return f; };

/* ── product glyphs: a board, a page, a measure ─────────────────── */
const GLYPH = {
  tasks: '<svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="2.2" y="3.2" width="3.4" height="11.6" rx="1.1" fill="currentColor" opacity=".9"/><rect x="7.3" y="3.2" width="3.4" height="8" rx="1.1" fill="currentColor" opacity=".55"/><rect x="12.4" y="3.2" width="3.4" height="5" rx="1.1" fill="currentColor" opacity=".35"/></svg>',

  timeline: '<svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2.6 9h12.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="5.4" cy="9" r="2" fill="currentColor"/><circle cx="9" cy="9" r="2" fill="currentColor" opacity=".55"/><circle cx="12.6" cy="9" r="2" fill="currentColor" opacity=".35"/></svg>',

  search: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7.2" cy="7.2" r="4.4" stroke="currentColor" stroke-width="1.4"/><path d="m10.6 10.6 2.6 2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',

  arrow: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.4 8h9.2M9 4.4 12.6 8 9 11.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',

  read: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.4v3.4M8 5.2h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'

const icon = (name, cls) => h("span", { class: cls || "", html: GLYPH[name], "aria-hidden": "true", style: "display:inline-flex" });

/* ── the frame ─────────────────────────────────────────────────── */
function spine(active) {
  const g = (key, on) => h("div", { class: "scGlyph", "data-on": on === "on" || null, "data-home": on === "home" || null, html: GLYPH[key] });
  return h("div", { class: "scSpine" }, [
    h("div", { class: "scMark" }, "✳"),
    h("hr"),
    g("home", active === "home" ? "home" : null),
    g("tasks", active === "tasks" ? "on" : null),
    g("notes", active === "notes" ? "on" : null),
    g("timeline", active === "timeline" ? "on" : null),

function screen(o) {

function scHead(o) {

    h("div", { class: "scHeadL" }, [h("b", { text: o.title }), o.sub ? h("span", { text: o.sub }) : null]),

  ]);
}
const scBody = (kids, mod) => h("div", Object.assign({ class: "scBody" }, mod || {}), kids);

const btn = (label, mode) => h("button", { class: "scBtn", type: "button", "data-primary": mode === "primary" || null, "data-ghost": mode === "ghost" || null }, [label]);
const iconBtn = (name, mode) => h("button", { class: "scBtn", type: "button", "data-primary": mode === "primary" || null, "data-ghost": mode === "ghost" || null }, [icon(name)]);
const tab = (label, on) => h("button", { class: "scTab", type: "button", "data-on": on || null }, [label]);
const field = (placeholder, live) => h("div", { class: "scField", "data-live": live || null }, [

const avatar = (initials) => h("span", { class: "scAvatar", text: initials });

const sevBar = (s) => h("span", { class: "sevBar", "data-s": s });
function sevKey(items) {

/* ── rows ──────────────────────────────────────────────────────── */
function rows(list, opts) {

}

    list.map((c) => h("div", { class: "scCol" }, [
      h("div", { class: "scColHead" }, [h("b", { text: c.title }), c.count != null ? h("span", { class: "n mono", text: String(c.count) }) : null]),
      ...[].concat(c.body || [])
    ])));
}

const card = (o) => h("div", { class: "scCard", "data-flat": o.flat || null, "data-live": o.live || null }, [

  o.sub ? h("span", { text: o.sub }) : null,

]);

const tile = (o) => h("div", { class: "scTile" }, [

  h("b", { text: o.title }),

]);
const tiles = (list, template) => h("div", { class: "scTiles", style: "grid-template-columns:" + (template || "repeat(" + list.length + ",minmax(0,1fr))") }, list.map(tile));

/* ── the reading below the screen ──────────────────────────────── */
function caption(bits) {
  const out = [];
  bits.forEach((b, i) => {
    if (i) out.push(h("span", { class: "sep" }, "·"));

    h("div", { class: "readCell" }, [h("div", { class: "k", text: c.k }), h("div", { class: "v", html: c.v })])
  ));
}

function verdict(tag, html) {
  return h("div", { class: "verdict" }, [
    h("span", { class: "tag", text: tag }),
    h("div", { html })
  ]);
}

/* ── the deck's own registry ────────────────────────────────────── */
const VIEWS = [];
const V = (o) => VIEWS.push(o);

/* Shared example workspace, carried over from the analytics deck so the
   two read as the same product on the same Friday. */
const WHO = { ana: "AR", tom: "TO", pri: "PN", jon: "JL", mei: "MC", sam: "SO", len: "LF", dev: "DB" };

/* ══════════════════════════════════════════════════════════════════════
   ONE WEDDING, EIGHT DAYS OUT
   Every view in this deck reads the same numbers, so a figure on view 3
   and the same figure on view 18 agree. Example data — a real workspace
   would put its own here.
   ══════════════════════════════════════════════════════════════════════ */

const W = {

const GUESTS = [

/* ══════════════════════════════════════════════════════════════════════
   GUEST PIECES
   ══════════════════════════════════════════════════════════════════════ */

GLYPH.guests = '<svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="6.6" cy="6.2" r="2.9" stroke="currentColor" stroke-width="1.3"/><circle cx="12.4" cy="7" r="2.2" stroke="currentColor" stroke-width="1.2" opacity=".6"/><path d="M1.9 15c.5-2.6 2.4-4 4.7-4s4.2 1.4 4.7 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M12.2 11.3c1.9.1 3.3 1.4 3.7 3.7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".6"/></svg>';

/* The spine, with Guests on it. */
function gSpine(active) {
  const g = (key, on) => h("div", { class: "scGlyph", "data-on": on === "on" || null, "data-home": on === "home" || null, html: GLYPH[key] });

const RSVP_LABEL = { yes: "Coming", no: "Not coming", sent: "Asked, waiting", none: "No reply", new: "Replied just now" };

const gCell = (text, mono) => h("div", { class: "gCell" + (mono ? " mono" : ""), text });

/* ── counters & bars ───────────────────────────────────────────── */
const counts = (list) => h("div", { class: "countRow" }, list.map((c) =>

  h("div", { class: "propSeg", "data-p": s.p, style: "flex:" + s.v })));

/* A single- or dual-series line, in ink and indigo only. */
function lineInk(o) {
  const w = o.w || 620, hgt = o.h || 200;
  const m = { t: 12, r: o.endLabel ? 54 : 14, b: 24, l: o.l || 46 };
  const iw = w - m.l - m.r, ih = hgt - m.t - m.b;
  const all = o.series.flatMap((s) => s.values.filter((v) => v != null));
  const max = o.max || Math.max.apply(null, all);
  const step = max / 4;
  const svg = sv("svg", { viewBox: `0 0 ${w} ${hgt}`, role: "img", "aria-label": o.label || "chart" });
  const y = (v) => m.t + ih - (v / max) * ih;
  const x = (i) => m.l + (i / (o.x.length - 1)) * iw;

  for (let v = 0; v <= max + 1e-9; v += step) {
    const yy = Math.round(y(v)) + 0.5;
    svg.appendChild(sv("line", { x1: m.l, x2: m.l + iw, y1: yy, y2: yy, stroke: "rgba(17,17,17,0.06)", "stroke-width": 1 }));
    const t = st((o.yfmt ? o.yfmt(v) : String(Math.round(v))), m.l - 8, yy + 3.5, { "text-anchor": "end", "font-size": 10, fill: "rgba(17,17,17,0.62)", "font-family": "var(--font-mono)" });
    svg.appendChild(t);
  }
  svg.appendChild(sv("line", { x1: m.l, x2: m.l + iw, y1: Math.round(y(0)) + 0.5, y2: Math.round(y(0)) + 0.5, stroke: "rgba(17,17,17,0.16)", "stroke-width": 1 }));

  const every = o.xEvery || Math.ceil(o.x.length / 8);
  o.x.forEach((lb, i) => {
    if (i % every && i !== o.x.length - 1) return;
    svg.appendChild(st(lb, x(i), m.t + ih + 16, { "text-anchor": i === o.x.length - 1 ? "end" : i === 0 ? "start" : "middle", "font-size": 10, fill: "rgba(17,17,17,0.62)" }));
  });

  (o.rules || []).forEach((r) => {
    const yy = Math.round(y(r.at)) + 0.5;
    svg.appendChild(sv("line", { x1: m.l, x2: m.l + iw, y1: yy, y2: yy, stroke: r.accent ? "#4f46e5" : "rgba(17,17,17,0.28)", "stroke-width": 1, "stroke-dasharray": "5 4" }));
    if (r.label) svg.appendChild(st(r.label, m.l + iw, yy - 6, { "text-anchor": "end", "font-size": 10, fill: r.accent ? "#4f46e5" : "rgba(17,17,17,0.62)" }));
  });

  o.series.forEach((se) => {
    const pts = se.values.map((v, i) => (v == null ? null : [x(i), y(v)])).filter(Boolean);
    if (!pts.length) return;
    const col = se.accent ? "#4f46e5" : se.mute ? "rgba(17,17,17,0.28)" : "#111111";
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join("");

/* A small relationship graph. Ink and indigo only; node size is weight. */
function network(o) {
  const w = o.w || 620, hgt = o.h || 340;
  const svg = sv("svg", { viewBox: `0 0 ${w} ${hgt}`, role: "img", "aria-label": o.label || "relationship graph" });
  const cx = w / 2, cy = hgt / 2 + 2;
  const R = Math.min(w, hgt) / 2 - 54;
  const ring = o.nodes.filter((n) => !n.core);
  const pos = o.nodes.map((n) => {
    if (n.core) return { x: cx, y: cy, n };
    const k = ring.indexOf(n);
    const a = (k / ring.length) * Math.PI * 2 - Math.PI / 2;
    return { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R * 0.84, n };
  });
  const by = {}; pos.forEach((p) => (by[p.n.id] = p));
  o.links.forEach((L) => {
    const a = by[L.from], b = by[L.to];
    if (!a || !b) return;
    svg.appendChild(sv("line", {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      stroke: L.weak ? "rgba(17,17,17,0.28)" : "#4f46e5",
      "stroke-opacity": L.weak ? 0.35 : 0.22,
      "stroke-width": Math.max(1, Math.min(6, L.value / (o.linkScale || 6))),
      "stroke-linecap": "round"
    }));
  });
  pos.forEach((p) => {
    const r = Math.max(9, Math.min(28, Math.sqrt(p.n.value) * (o.nodeScale || 2.4)));
    const col = p.n.color || (p.n.core ? "#4f46e5" : "rgba(17,17,17,0.62)");
    svg.appendChild(sv("circle", { cx: p.x, cy: p.y, r, fill: col, "fill-opacity": 0.9, stroke: "#ffffff", "stroke-width": 2 }));

/* The kit's h() has no event branch — every deck built with it was a

   written out as a stringified inline handler that binds nothing. It

   first interactive thing built on the kit, so it carries its own h(),
   shadowing the kit's inside this scope only. The shared kit is left
   exactly as the published artefacts expect it. */
function h(tag, attrs, kids) {
  const n = document.createElement(tag);
  if (typeof attrs === "string" || Array.isArray(attrs) || (attrs && attrs.nodeType)) { kids = attrs; attrs = null; }
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v != null && v !== false) n.setAttribute(k, v);
  }
  if (kids) for (const c of [].concat(kids)) if (c != null && c !== false)

}

  },
  {
    id: "seating", label: "Seating", g: WG.seating, title: "Seating", n: "16",
    sub: [WED.toSeat + " still to seat", WED.tables + " tables"],
    modes: [
      { k: "queue", label: "Still to seat", built: true },
      { k: "room", label: "The room", built: true, note: "Three questions generate the floor, then auto-seat fills it, so the first thing you see is a room to argue with rather than an empty barn to draw.", from: "seating:01 + 05 + 08" },
      { k: "table", label: "One table", built: true, note: "Eight chairs and who is beside whom. Needs zones as three tags — loud, step-free, best view — or it is a diagram.", from: "seating:06" },
      { k: "plans", label: "Plan A / Plan B", built: true, note: "The third attempt is usually the one you want back.", from: "seating:15" },
      { k: "check", label: "Check before you print", built: true, note: "A gate on the print run, not a tab. Two of its checks currently report clear without having run.", from: "seating:17" }
    ]
  },
  {
    id: "day", label: "The Day", g: WG.day, title: "The Day",
    sub: ["12 September", "ceremony 14:00"],
    modes: [
      { k: "order", label: "Running order", built: true },
      { k: "who", label: "Who is doing what", built: true, note: "Fourteen jobs and the four nobody has claimed. Untimed rows belong here too — returning the suits is a Monday, not a moment.", from: "day:06" },
      { k: "contacts", label: "Contact sheet", built: true, note: "One printable page. At 07:00 the number you need fastest is the florist's mobile.", from: "suppliers:03" }
    ]
  }
];

const ADDONS = [
  { id: "weddings", name: "Weddings", g: WG.rings, blurb: "Guests, money, seating and the day itself — plus a plan for the fourteen months in front of you.", ready: true },
  { id: "studies", name: "Studies", g: WG.study, blurb: "Modules, deadlines, reading and revision, counted back from the exam.", ready: false },
  { id: "business", name: "Small business", g: WG.shop, blurb: "Clients, quotes, invoices and the week ahead.", ready: false }
];

const ST = { route: "guests", modes: { guests: "list", money: "number", seating: "queue", day: "order" }, seeded: true, justSeeded: false };
const el = (id) => document.getElementById(id);
const find = (id) => CORE.concat(WEDDING).find((d) => d.id === id);

/* ── rail ─────────────────────────────────────────────────────── */
function railItem(d) {
  return h("button", {
    class: "railItem", type: "button", "aria-current": ST.route === d.id ? "true" : null,
    onclick: () => go(d.id)
  }, [
    h("span", { class: "g", html: d.g, "aria-hidden": "true" }),
    h("span", null, d.label),
    d.n ? h("em", null, d.n) : null
  ]);
}
function section(label, note) {
  return h("div", { class: "railSection" }, [
    h("span", null, label), note ? h("i", null, note) : null, h("hr")
  ]);
}
function renderRail() {
  const rail = el("rail");
  rail.textContent = "";
  rail.appendChild(h("div", { class: "railHead" }, [
    h("div", { class: "monogram", "aria-hidden": "true" }, "✳"),
    h("div", { class: "railTitle" }, [
      h("b", null, "Signal Studio"),
      h("span", null, ST.seeded ? WED.couple : "Your workspace")
    ])
  ]));

  const scroll = h("div", { class: "railScroll" });
  scroll.appendChild(section("Workspace"));
  CORE.forEach((d) => scroll.appendChild(railItem(d)));

  if (ST.seeded) {
    const group = h("div", { class: "railGroup", "data-new": ST.justSeeded ? "" : null }, [
      section("Wedding", WED.date)
    ]);
    WEDDING.forEach((d) => group.appendChild(railItem(d)));
    scroll.appendChild(group);
  }

  scroll.appendChild(h("button", {
    class: "railAdd", type: "button", "data-open": ST.route === "picker" ? "" : null,
    onclick: () => go("picker")
  }, [
    h("span", { class: "g", html: GLYPH.plus, "aria-hidden": "true" }),
    h("span", null, "Add a section")
  ]));
  rail.appendChild(scroll);

  rail.appendChild(h("div", { class: "railFoot" }, [
    h("span", { class: "kbd" }, "1–8"), h("span", null, "jump"),
    h("button", {
      class: "kbd", type: "button", style: "cursor:pointer",
      onclick: () => { ST.seeded = false; go("ask"); }
    }, "Replay setup")
  ]));
}

/* ── the sheet ────────────────────────────────────────────────── */
function head(title, subParts, right) {
  return [
    h("div", { class: "headL" }, [
      h("h1", null, title),
      subParts && subParts.length ? h("div", { class: "headSub" },
        subParts.map((s, i) => h("b", { class: i === 0 ? null : "mono" }, s))) : null
    ]),
    right || null
  ];
}
function modeRow(d) {
  return h("div", { class: "seg" }, d.modes.map((m) =>
    h("button", {
      class: "segBtn", type: "button", "aria-current": ST.modes[d.id] === m.k ? "true" : null,
      onclick: () => { ST.modes[d.id] = m.k; render(); }
    }, m.label)
  ));
}
function notYet(d, m) {
  return [
    h("div", { class: "empty", style: "padding-top:22px" }, [
      h("b", null, m.label),
      h("p", null, m.note),
      h("div", { class: "row" }, [
        h("button", { class: "btn", type: "button", onclick: () => { ST.modes[d.id] = d.modes[0].k; render(); } },
          "Back to " + d.modes[0].label.toLowerCase())
      ])
    ]),
    h("div", { class: "next", style: "margin-top:8px" }, d.modes.filter((x) => x !== m).map((x) =>
      h("div", { class: "nextCard" }, [
        h("b", null, x.label),
        h("p", null, x.built ? "Composed." : (x.note || "")),
        h("em", null, x.built ? "in this demo" : "from " + x.from)
      ])
    ))
  ];
}

const BUILT = {
  guests:   { list: vGuests, household: mHousehold, replies: mReplies, sends: mSends, food: mFood, travel: mTravel },
  money:    { number: vMoney, category: mCategory, paying: mPaying, due: mDue, supplier: mSupplier },
  seating:  { queue: vSeating, room: mRoom, table: mTable, plans: mPlans, check: mCheck },
  day:      { order: vDay, who: mWho, contacts: mContacts },
  home:     { _: vHome },
  notes:    { _: vNotes },
  tasks:    { _: vTasks },
  timeline: { _: () => vTimeline(false) }
};

function renderSheet() {
  const headEl = el("head"), body = el("body");
  headEl.textContent = ""; body.textContent = "";

  if (ST.route === "picker") return renderPicker(headEl, body);
  if (ST.route === "ask") return renderAsk(headEl, body);
  if (ST.route === "seed") return renderSeed(headEl, body);

  const d = find(ST.route);
  const isWed = WEDDING.indexOf(d) > -1;
  head(d.title, isWed ? d.sub : [d.sub], isWed ? modeRow(d) : null).forEach((n) => n && headEl.appendChild(n));

  const mode = isWed ? ST.modes[d.id] : "_";
  const build = (BUILT[d.id] || {})[mode];
  const nodes = build ? build() : notYet(d, d.modes.find((m) => m.k === mode));
  nodes.forEach((n) => n && body.appendChild(n));
}

/* ── the picker: what the + opens ─────────────────────────────── */
function renderPicker(headEl, body) {
  head("Add a section", ["Sections bring their own places into the rail"], null)
    .forEach((n) => n && headEl.appendChild(n));
  body.appendChild(h("div", { class: "pick" }, [
    h("p", { class: "hint" },
      "Notes, Tasks and Timeline are the whole product. A section adds the places one kind of project needs — and takes them away again for everyone else."),
    h("div", { class: "pickCards" }, ADDONS.map((a) =>
      h("button", {
        class: "pickCard", type: "button", disabled: a.ready ? null : true,
        onclick: a.ready ? () => { ST.seeded = false; go("ask"); } : null
      }, [
        h("span", { class: "g", html: a.g, "aria-hidden": "true" }),
        h("b", null, a.name),
        h("p", null, a.blurb),
        a.ready ? null : h("span", { class: "later" }, "Later")
      ])
    ))
  ]));
}

/* ── the one question it asks ─────────────────────────────────── */
function renderAsk(headEl, body) {
  head("Weddings", ["One question, and it is the one everything else is measured from"], null)
    .forEach((n) => n && headEl.appendChild(n));
  const input = h("input", { type: "text", value: "12 September 2027", "aria-label": "The date", spellcheck: "false" });
  body.appendChild(h("div", { class: "ask" }, [
    h("div", { class: "askField" }, [h("label", null, "The date"), input]),
    h("p", { class: "askNote" },
      "That is all it needs. The venue, the guests and the budget can all wait — none of what happens next is possible without the date."),
    h("div", { style: "display:flex;gap:8px;margin-top:22px" }, [
      h("button", { class: "btn", type: "button", "data-primary": true, onclick: () => go("seed") }, "Add the section"),
      h("button", { class: "btn", type: "button", "data-ghost": true, onclick: () => { ST.seeded = true; go("guests"); } }, "Cancel")
    ])
  ]));
  setTimeout(() => { try { input.focus(); input.select(); } catch (e) { /* focus is a nicety */ } }, 30);
}

/* ── the seed: content first, navigation second ───────────────── */
function renderSeed(headEl, body) {
  head("Ready", ["Nothing was typed. All of it came from the date."], null)
    .forEach((n) => n && headEl.appendChild(n));

  const list = h("div", { class: "seedList" }, SEED_LINES.map(([what, count], i) =>
    h("div", { class: "seedLine", style: "animation-delay:" + (i * 90) + "ms" }, [
      h("span", { class: "g", html: WG.seed, "aria-hidden": "true" }),
      h("b", null, what),
      h("em", null, count)
    ])
  ));
  const done = h("div", { class: "seedDone", style: "animation-delay:" + (SEED_LINES.length * 90 + 240) + "ms" }, [
    h("button", { class: "btn", type: "button", "data-primary": true, onclick: () => go("timeline") }, "See the plan"),
    h("span", { class: "hint" }, "The Wedding section is in your rail.")
  ]);
  body.appendChild(h("div", { class: "seed" }, [list, done]));

  /* The rail waits for the content to land — that order is the argument,
     not a flourish. */
  setTimeout(() => {
    ST.seeded = true; ST.justSeeded = true;
    renderRail();
    setTimeout(() => { ST.justSeeded = false; }, 600);
  }, SEED_LINES.length * 90 + 260);
}

/* ── routing ──────────────────────────────────────────────────── */
function go(id) { ST.route = id; render(); el("body").scrollTop = 0; }
function render() { renderRail(); renderSheet(); }

document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || e.metaKey || e.ctrlKey || e.altKey) return;
  const order = CORE.concat(ST.seeded ? WEDDING : []);
  const i = parseInt(e.key, 10);
  if (i >= 1 && i <= order.length) { e.preventDefault(); go(order[i - 1].id); }
  if (e.key === "Escape" && (ST.route === "picker" || ST.route === "ask")) { ST.seeded = true; go("guests"); }
});

/* ── the toolchain contract ─────────────────────────────────────
   The same file runs as the published demo and as the lab's master, so
   it answers the two URL parameters the elevate toolchain drives it by —
   ?state=<destination>-<mode> and ?v=<preset> — and exposes
   window.__elevate for the Design Console. One file, one behaviour.

   Decisions are written as data attributes on the nearest root: <html>
   when the file stands alone, the console's .deck when it is compiled in.
   The CSS reads them with bare [data-…] selectors, which the console
   scopes to .deck — so the same rule serves both. */
const STATES = [];
WEDDING.forEach((d) => d.modes.forEach((m) => STATES.push([d.id + "-" + m.k, d.label + " · " + m.label])));

const PRESETS = { a: { density: "comfortable", figures: "hero", moments: "on" } };
const PRESET_COPY = { a: { name: "A · Floor", line: "The locked direction, as it stands." } };
/* Three decisions that are genuinely open, not knobs for their own sake:
   how tight the rows sit, how loud the headline figures are, and whether
   the rare-tier moments play — the last so reduced-motion can be judged. */
const CONTROLS = [
  { key: "density", label: "Rows", help: "How much air a row of people or money gets.",
    options: [["comfortable", "Comfortable"], ["compact", "Compact", "one step tighter"]] },
  { key: "figures", label: "Figures", help: "The headline numbers at the top of every mode.",
    options: [["hero", "Hero"], ["quiet", "Quiet", "one step down the ramp"]] },
  { key: "moments", label: "Moments", help: "The three 400ms moments the suite reserves.",
    options: [["on", "On"], ["off", "Off", "as reduced motion sees it"]] }
];

const decisionRoot = () => document.querySelector(".deck") || document.documentElement;
function applyDecisions(dec) { const r = decisionRoot(); for (const k in dec) r.setAttribute("data-" + k, dec[k]); }
function setState(id) {
  const i = String(id || "").indexOf("-");
  const dest = i > 0 ? id.slice(0, i) : id, mode = i > 0 ? id.slice(i + 1) : null;
  const d = find(dest);
  if (!d) return;
  ST.seeded = true;
  ST.route = d.id;
  if (mode && d.modes && d.modes.some((m) => m.k === mode)) ST.modes[d.id] = mode;
  render();
  const body = el("body"); if (body) body.scrollTop = 0;
}
window.__elevate = {
  states: STATES, presets: PRESETS, presetCopy: PRESET_COPY, controls: CONTROLS,
  setState, mount() { /* render() already painted; nothing is deferred */ }
};

/* Boot: preset first so the first paint already carries the decisions,
   then the URL, then the default route. */
const q = new URLSearchParams(location.search);
applyDecisions(PRESETS[q.get("v")] || PRESETS.a);
decisionRoot().setAttribute("data-v", PRESETS[q.get("v")] ? q.get("v") : "a");
if (q.get("state")) setState(q.get("state")); else render();
})();
</script>
</body>
</html>
