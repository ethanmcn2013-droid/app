<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lately Design Console</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   The console is not the product, so it is deliberately quieter than
   the thing it drives: one ink surface, one white panel, no chrome that
   competes with the work it is showing. Same palette, because
   the palette lock applies to the tool as well as the work.
   ═══════════════════════════════════════════════════════════════════ */
:root {
  --ink: #111111;
  --indigo: #4f46e5;
  --white: #ffffff;
  --ui-bg: #0b0b0b;
  --ui-panel: rgba(255, 255, 255, 0.05);
  --ui-line: rgba(255, 255, 255, 0.11);
  --ui-line-strong: rgba(255, 255, 255, 0.2);
  --ui-text: rgba(255, 255, 255, 0.62);
  --ui-text-strong: #ffffff;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ui-bg);
  color: var(--ui-text-strong);
  font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

.console {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  min-height: 100dvh;
}

/* ── the panel ─────────────────────────────────────────────────── */
.panel {
  border-right: 1px solid var(--ui-line);
  padding: 26px 22px 40px;
  display: flex; flex-direction: column; gap: 26px;
  position: sticky; top: 0; align-self: start;
  max-height: 100dvh; overflow-y: auto;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brandWord {
  display: inline-flex; align-items: baseline;
  font-size: 17px; font-weight: 600; letter-spacing: -0.045em;
  color: var(--ui-text-strong);
}
.brandWord::after {
  content: ""; width: 4.5px; height: 4.5px; border-radius: 50%;
  background: var(--indigo); margin-left: 2px;
}
.brandNote {
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ui-text);
}

.group { display: grid; gap: 9px; }
.groupLabel {
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: 10px; font-weight: 400;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ui-text);
}
.groupHelp { font-size: 12px; line-height: 1.45; color: var(--ui-text); margin: -4px 0 2px; }

.choices { display: grid; gap: 4px; }
.choices[data-cols="2"] { grid-template-columns: 1fr 1fr; }
.choices[data-cols="3"] { grid-template-columns: repeat(3, 1fr); }
.choice {
  appearance: none; border: 0; cursor: pointer;
  font: inherit; font-size: 12.5px; text-align: left;
  color: var(--ui-text);
  background: var(--ui-panel);
  box-shadow: inset 0 0 0 1px var(--ui-line);
  border-radius: 8px;
  min-height: 44px; padding: 6px 10px; min-width: 0;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px;
  transition: color 140ms var(--ease), background-color 140ms var(--ease), box-shadow 140ms var(--ease);
}
.choice:hover { color: var(--ui-text-strong); background: rgba(255, 255, 255, 0.08); }
.choice[aria-pressed="true"] {
  color: var(--ink); background: var(--white);
  box-shadow: inset 0 0 0 1px var(--white);
  font-weight: 600;
}
.choice:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
.choice small { font-size: 10.5px; opacity: 0.62; font-weight: 400; }
.choice > span { white-space: nowrap; }

.presetRow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.preset {
  appearance: none; border: 0; cursor: pointer; font: inherit;
  border-radius: 8px; padding: 11px 10px 10px;
  background: var(--ui-panel);
  box-shadow: inset 0 0 0 1px var(--ui-line);
  color: var(--ui-text); text-align: left;
  display: grid; gap: 3px;
  transition: color 140ms var(--ease), background-color 140ms var(--ease);
}
.preset b { font-size: 12.5px; font-weight: 600; color: var(--ui-text-strong); }
.preset span { font-size: 11px; line-height: 1.35; }
.preset:hover { background: rgba(255, 255, 255, 0.08); }
.preset[aria-pressed="true"] { background: var(--white); color: rgba(17, 17, 17, 0.62); }
.preset[aria-pressed="true"] b { color: var(--ink); }
.preset:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }

.reset {
  appearance: none; border: 0; cursor: pointer; font: inherit;
  font-size: 12px; color: var(--ui-text);
  background: none; padding: 0; text-align: left;
  text-decoration: underline; text-underline-offset: 3px;
}
.reset:hover { color: var(--ui-text-strong); }

.recipe {
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: 11px; line-height: 1.7; color: var(--ui-text);
  background: var(--ui-panel);
  box-shadow: inset 0 0 0 1px var(--ui-line);
  border-radius: 8px; padding: 12px;
  white-space: pre-wrap; word-break: break-word;
}

/* ── the stage ─────────────────────────────────────────────────── */
.stage {
  padding: 26px 30px 40px;
  display: flex; flex-direction: column; gap: 18px;
  min-width: 0;
}
.stageBar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.stageBar .groupLabel { margin-right: -10px; }
.stageTabs { display: inline-flex; gap: 3px; padding: 3px; background: var(--ui-panel); border-radius: 999px; box-shadow: inset 0 0 0 1px var(--ui-line); }
.stageTab {
  appearance: none; border: 0; cursor: pointer; font: inherit;
  font-size: 12.5px; color: var(--ui-text);
  background: none; border-radius: 999px;
  min-height: 30px; padding: 0 13px;
  transition: color 140ms var(--ease), background-color 140ms var(--ease);
}
.stageTab:hover { color: var(--ui-text-strong); }
.stageTab[aria-pressed="true"] { background: var(--white); color: var(--ink); font-weight: 600; }
.stageTab:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }

.frame {
  border-radius: 12px;
  overflow: hidden;
  align-self: flex-start;
  max-width: 100%;
  box-shadow: 0 0 0 1px var(--ui-line), 0 24px 64px rgba(0, 0, 0, 0.5);
}

/* The deck is the real product. Every rule below this point in the
   compiled stylesheet is the master's own, scoped to here. */
.deck {
  display: block;
  overflow: hidden;
  transform-origin: top left;
}

.footNote {
  font-size: 12px; line-height: 1.6; color: var(--ui-text);
  max-width: 70ch;
}
.footNote b { color: var(--ui-text-strong); font-weight: 600; }

@media (max-width: 960px) {
  .console { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--ui-line); }
  .stage { padding: 20px 16px 36px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0ms !important; animation-duration: 0ms !important; }
}

@font-face { font-family: "Geist"; src: url("fonts/Geist-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Geist"; src: url("fonts/Geist-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
.deck {
  --paper:      #ffffff;
  --paper-2:    #fafafa;
  --paper-3:    #f4f4f5;
  --ink:        #111111;
  --ink-2:      #3f3f46;
  --ink-3:      #71717a;
  --ink-4:      #a1a1aa;
  --mark-ctx:   #d4d4d8;
  --line:       rgba(17, 17, 17, 0.10);

/* The rail is drawn, not set. Geist carries none of the three characters
   this used to use, so an OS fallback painted them — a filled pencil beside
   three outlines, and a different shape on every machine. audit.mjs reads
   the authored family, never the painted one, so it could not see it.
   Sixteen on sixteen, at 1.5 stroke, the same pen as ICON. */
const RAIL = {
  home: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 7 8 2.5 13.5 7v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  notes: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.2 2.8a1.7 1.7 0 0 1 2.4 2.4L6.4 12.4l-3.2.8.8-3.2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  tasks: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 8.2 7.3 10l3.4-3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  timeline: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 11.5 11.5 4.5M6 4.5h5.5V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

function label(text) {
  return `<p class="t-label dim" data-type="label">${esc(text)}</p>`;
}

/* A KPI card. `n` may be a number or the string "—"; when a source did not
   answer the card keeps its shape and says so in words, and never resolves
   to a fabricated zero. */
/* The phrase comes in both numbers and is picked by the count. A fixed
   plural under a numeral that can be 1 printed "1 have nobody's name on
   them" on screen and spoke it aloud. Zero keeps the plural, which is
   already correct. */
function kpi({ n, word, glyph, i, unavailable = false }) {
  const known = !unavailable;
  const phrase = n === 1 ? word.one : word.many;
  const share = known && D.open ? Math.min(1, n / D.open) : 0;
  const name = known
    ? `${plural(n, "job", "jobs")} ${phrase}, of ${plural(D.open, "job", "jobs")} open`
    : `Jobs ${word.many}: not available, because Timeline did not answer`;
  const body = `
      <span class="glyph" aria-hidden="true">${glyph}</span>
      ${known
        ? `<span class="t-num" data-type="bignum">${n}</span>`
        : `<span class="t-num na" data-type="bignum">&mdash;</span>`}
      <span class="t-small dim-2" data-type="small">${esc(known ? phrase : word.many)}</span>
      ${known
        ? `<span class="meter" aria-hidden="true"><i class="${n === 0 ? "zero" : ""}" style="--f:${share};--i:${i}"></i></span>`
        : `<span class="t-label dim" data-type="label">Not available</span>`}
      <span class="sr">${esc(name)}</span>`;
  return known && n > 0
    ? `<a class="kpi rise" href="#" style="--i:${i}">${body}</a>`
    : `<div class="kpi rise" style="--i:${i}">${body}</div>`;
}

/* The denominator card. Not a status, so it wears no status furniture and
   no meter — a meter against itself is always full, which says nothing. */
function leadKpi(i) {
  return `
    <div class="kpi lead rise" style="--i:${i}">
      <span class="t-label" data-type="label">Open now</span>
      <span class="t-num" data-type="bignum">${D.open}</span>
      <span class="t-small" data-type="small">jobs not finished</span>
      <span class="sr">Every card in this row is counted out of these ${plural(D.open, "open job", "open jobs")}.</span>
    </div>`;
}

/* ── Movement one ───────────────────────────────────────────────────── */
function chart({ record = true } = {}) {
  const max = Math.max(D.peak, D.bestPrior);
  const cols = D.weeks.map((w, i) => {
    const live = i === D.weeks.length - 1;
    const cls = w.partial ? "bar part" : (live ? "bar live" : "bar");
    const val = live
      ? `<span class="bar-val t-label" data-type="label" style="--h:${pct(w.v, max)}">${w.v} so far</span>`
      : "";
    return `<span class="colw"><span class="${cls}" style="--h:${pct(w.v, max)};--i:${i}"></span>${val}</span>`;
  }).join("");
  const ticks = D.weeks.map((w, i) => {
    const show = i % 3 === 0 || i === D.weeks.length - 1;
    return `<span class="t-label ${show ? "" : "mute"}" data-type="label">${esc(w.start)}</span>`;
  }).join("");
  /* --r is an inline custom property, so a sibling inherits nothing:
     it is repeated deliberately, not by accident. */
  const r = pct(D.bestPrior, max);
  const rec = record
    ? `<span class="record" style="--r:${r}"></span>` +
      `<span class="record-tag t-label" data-type="label" style="--r:${r}">Best week &middot; ${D.bestPrior}</span>`
    : "";
  /* Three gridlines with their values, so the columns are read against a
     magnitude rather than only against each other. */
  const grid = [0.5, 1].map((g) => {
    const v = Math.round(max * g);
    return `<span class="gridline" style="bottom:${g * 100}%"><b class="t-label" data-type="label">${v}</b></span>`;
  }).join("");
  return `
    <div class="chart">
      <div class="plot" aria-hidden="true">
        ${grid}
        <span class="baseline"></span>
        ${rec}
        <span class="cols">${cols}</span>
      </div>
      <div class="xaxis" aria-hidden="true">${ticks}</div>
      <p class="sr">Twelve weeks of finished work, week commencing ${esc(D.weeks[0].start)} to ${esc(D.weeks[D.weeks.length - 1].start)}: ${D.weeks.map((w) => `${w.start}, ${w.v}${w.partial ? " so far" : ""}`).join("; ")}.${record ? ` The best week before this one was ${D.bestPrior}.` : ""}</p>
    </div>`;
}

/* The previous best is drawn whenever it is knowable — two or more weeks
   of record — and never switched off per state. A mark that vanishes for
   a reason the screen does not give teaches that when something is
   wrong, marks disappear quietly. */
function movementOne({ record = D.weeks.length > 1 } = {}) {
  const up = D.delta >= 0;
  return `
    <section class="band" aria-labelledby="m1">
      <div class="band-head">
        <h2 class="t-sect" id="m1" data-type="sect">What you did</h2>
        <span class="grow"></span>
        <p class="t-label dim" data-type="label">Last four weeks &middot; ${esc(D.weeks[D.weeks.length - 4].start)} to ${esc(D.readingShort)}</p>
      </div>
      <div class="card hero rise" style="--i:1">
        <div class="hero-fig">
          <div class="stack">
            <div class="hero-n">
              <span class="t-hero" data-type="hero" id="count">${D.lastFour}</span>
              <span class="delta t-label" data-type="label">${up ? ICON.up : ICON.down} ${up ? "+" : ""}${D.delta} on the four before</span>
            </div>
            <p class="t-body dim-2 hero-note" data-type="body">jobs finished, ${esc(D.workspace)}${D.weeks[D.weeks.length - 1].partial ? " &mdash; this week still running" : ""}</p>
          </div>
          <p class="t-small dim hero-note" data-type="small">Counted at the moment each job reached a done column.</p>
        </div>
        ${chart({ record })}
      </div>
    </section>`;
}

/* ── Movement two ───────────────────────────────────────────────────── */
function strip() {
  const dots = D.jobs.map((j, i) => {
    const old = j.age >= D.fortnight;
    return `<button type="button" class="dot ${old ? "old" : ""}" style="--x:${(j.age / D.axisMax) * 100};--i:${i}" data-tip="<b>${plural(j.age, "day", "days")} open</b><s>${esc(j.title)}</s>" aria-label="${esc(j.title)}, open ${plural(j.age, "day", "days")}"></button>`;
  }).join("");
  const marks = D.scaleMarks;
  return `
    <div class="card ages rise" style="--i:3">
      <div class="band-head">
        <h3 class="t-head" data-type="head">How long open work has been sitting</h3>
        <span class="grow"></span>
        <p class="t-label dim" data-type="label">Oldest &middot; ${plural(D.oldest, "day", "days")}</p>
      </div>
      <div class="strip" data-axis-max="${D.axisMax}">
        ${D.showsFortnight ? `<span class="fortnight" style="--x:${(D.fortnight / D.axisMax) * 100}"><span class="t-label" data-type="label">A fortnight</span></span>` : ""}
        <span class="strip-axis"></span>
        ${dots}
        <span class="strip-scale">${marks.map((n) => `<span class="t-unit" data-type="unit" style="--x:${(n / D.axisMax) * 100}">${n === 0 ? "today" : n + "d"}</span>`).join("")}</span>
      </div>
      <p class="sr">${plural(D.jobs.length, "open job", "open jobs")}, by age: ${D.jobs.map((j) => `${j.title}, ${j.age} days`).join("; ")}. ${plural(D.sitting, "job has", "jobs have")} been open longer than a fortnight.</p>
    </div>`;
}

function movementTwo({ partial = false } = {}) {
  return `
    <section class="band" aria-labelledby="m2">
      <div class="band-head">
        <h2 class="t-sect" id="m2" data-type="sect">What&rsquo;s quietly slipping</h2>
        <span class="grow"></span>
        <p class="t-label dim" data-type="label">All five counted out of ${D.open}</p>
      </div>
      <div class="kpis">
        ${leadKpi(0)}
        ${kpi({ n: D.sitting, word: { one: "hasn’t moved in a fortnight", many: "haven’t moved in a fortnight" }, glyph: ICON.still, i: 1 })}
        ${kpi({ n: D.overdue, word: { one: "is past the day it was due", many: "past the day they were due" }, glyph: ICON.past, i: 2, unavailable: partial })}
        ${kpi({ n: D.unowned, word: { one: "has nobody’s name on it", many: "have nobody’s name on them" }, glyph: ICON.nobody, i: 3 })}
        ${kpi({ n: D.waiting, word: { one: "is waiting on something else", many: "are waiting on something else" }, glyph: ICON.waiting, i: 4 })}
      </div>
      ${partial ? `<div class="note" style="margin-top:var(--gap-line)"><p class="t-body dim-2" data-type="body">Timeline did not answer this reading, so nothing here knows a due date. The card keeps its place and says so; it does not fall back to zero.</p></div>` : ""}
      ${strip()}
    </section>`;
}

/* ── Movement three ─────────────────────────────────────────────────── */
/* Written for the owner, not for the team that built it. The second tile
   states a condition rather than a start date: nothing records a date move
   yet, so naming the month one begins would be a fact the fixture does not
   hold — and the month it used to name had not happened at the reading. */
const LIMITS = [
  ["Open work over time", "Nothing was written down about how much was open in earlier weeks, so there is nothing yet to compare this against."],
  ["How a date moved", "When a date gets moved, nothing keeps a record of it yet. Once something does, only moves from that day on will be in it."],
  ["Decisions still open", "Notes doesn’t keep a list of which decisions are still open, so nothing here can count them. That would be a change in Notes."],
];

function movementThree() {
  const ghostCols = [38, 52, 44, 61, 47, 58, 50, 66, 54, 62, 57, 70]
    .map((h) => `<i style="--h:${h}"></i>`).join("");
  return `
    <section class="band" aria-labelledby="m3">
      <div class="band-head">
        <h2 class="t-sect" id="m3" data-type="sect">What this can&rsquo;t tell you</h2>
        <span class="grow"></span>
        <p class="t-label dim" data-type="label">Three refusals</p>
      </div>
      <div class="limits">
        ${LIMITS.map(([head, why]) => `
        <div class="limit rise" style="--i:1">
          ${label("Not yet")}
          <p class="t-head" data-type="head">${head}</p>
          <p class="t-small dim-2" data-type="small">${why}</p>
        </div>`).join("")}
      </div>
      <figure class="ghost rise" style="--i:2">
        <div class="ghost-plot" aria-hidden="true">${ghostCols}</div>
        <figcaption class="ghost-say">
          <p class="t-head" data-type="head">Open work over time — the chart that would go here</p>
          <p class="t-small dim" data-type="small">Once open work starts being counted each week, it fills in after about a month.</p>
        </figcaption>
      </figure>
    </section>`;
}

/* ── The seven states ───────────────────────────────────────────────── */
const SOURCES = {
  full:        { tasks: "answered", timeline: "answered", notes: "answered, for you" },
  partial:     { tasks: "answered", timeline: "did not answer", notes: "answered, for you" },
  quiet:       { tasks: "answered", timeline: "answered", notes: "answered, for you" },
  "first-run": { tasks: "answered", timeline: "answered", notes: "answered, for you" },
  empty:       { tasks: "answered, nothing recorded", timeline: "not read", notes: "not read" },
  loading:     { tasks: "reading", timeline: "reading", notes: "reading" },
  error:       { tasks: "did not answer", timeline: "not read", notes: "not read" },
};
let sources = SOURCES.full;

function shell(inner) {
  return `
  <div class="app">
    <nav class="rail" aria-hidden="true">
      <i class="on">${RAIL.home}</i><i>${RAIL.notes}</i><i>${RAIL.tasks}</i><i>${RAIL.timeline}</i>
    </nav>
    <div class="canvas"><div class="scroll"><div class="page">
      <header class="top">
        <div class="top-row">
          <h1 class="t-sect" data-type="sect">Home</h1>
          <p class="t-body ws" data-type="body">${esc(D.workspace)} &middot; ${esc(D.owner)}</p>
        </div>
        <nav class="tabs" aria-label="Home views">
          <a class="tab t-body" data-type="control" href="#">Today&rsquo;s Signal</a>
          <a class="tab t-body" data-type="control" href="#">Full Briefing</a>
          <a class="tab t-body" data-type="control" href="#" aria-current="page">Lately</a>
        </nav>
        <div class="reading">
          <p class="t-label" data-type="label">Read at ${esc(D.readingLong)}</p>
          <span class="rule"></span>
          <p class="t-label" data-type="label">Twelve weeks</p>
        </div>
      </header>
      <main>${inner}</main>
      <footer class="coverage t-label" data-type="label" aria-label="What this reading was built from">
        <span><b>Tasks</b> ${esc(sources.tasks)}</span>
        <span><b>Timeline</b> ${esc(sources.timeline)}</span>
        <span><b>Notes</b> ${esc(sources.notes)}</span>
        <span><b>Read</b> ${esc(D.readingLong)}</span>
        <span><b>Lab</b> counts and ages are lab-authored</span>
        <span><b>Bound</b> workspace, owner, reading date and the ${D.open}</span>
      </footer>
    </div></div></div>
  </div>`;
}

const VIEW = {
  full: () => shell(movementOne() + movementTwo() + movementThree()),

  partial: () => shell(movementOne() + movementTwo({ partial: true }) + movementThree()),

  /* Nothing slipping. The band does not vanish — an absent band reads as a
     bug — it states the absence once, with its arithmetic. */
  quiet: () => shell(movementOne() + `
    <section class="band" aria-labelledby="m2q">
      <div class="band-head">
        <h2 class="t-sect" id="m2q" data-type="sect">What&rsquo;s quietly slipping</h2>
      </div>
      <div class="card rise" style="--i:1">
        <div class="center">
          <span class="glyph" aria-hidden="true">${ICON.clear}</span>
          <p class="t-head" data-type="head">Nothing is sitting</p>
          <p class="t-body dim-2" data-type="body">${D.open === 1 ? "The one open job has" : `All ${D.open} open jobs have`} moved inside a fortnight, none is past its day, and every one has a name on it.</p>
        </div>
      </div>
      ${strip()}
    </section>` + movementThree()),

  /* Under four weeks of work: no comparison is attempted, and the date the
     comparison arrives is named rather than left as a mystery. */
  "first-run": () => shell(`
    <section class="band" aria-labelledby="m1f">
      <div class="band-head">
        <h2 class="t-sect" id="m1f" data-type="sect">What you did</h2>
      </div>
      <div class="card hero rise" style="--i:1">
        <div class="hero-fig">
          <div class="stack">
            <div class="hero-n"><span class="t-hero" data-type="hero">${D.thisWeek}</span></div>
            <p class="t-body dim-2 hero-note" data-type="body">jobs finished since you started, ${esc(D.workspace)}</p>
          </div>
          <p class="t-small dim hero-note" data-type="small">Four weeks of records make a comparison worth printing. Yours arrive on ${esc(D.comparisonArrives)}.</p>
        </div>
        <div class="chart">
          <div class="plot solo" aria-hidden="true">
            <span class="baseline"></span>
            <span class="cols"><span class="colw"><span class="bar part" style="--h:100;--i:0"></span><span class="bar-val t-label" data-type="label" style="--h:100">${D.thisWeek} so far</span></span></span>
          </div>
          <div class="xaxis" aria-hidden="true"><span class="t-label" data-type="label">${esc(D.weeks[0].start)}</span></div>
          <p class="sr">This week so far: ${D.thisWeek} jobs finished, week commencing ${esc(D.weeks[0].start)}. There is no earlier week to compare it with; twelve weeks of history are not recorded yet.</p>
        </div>
      </div>
    </section>` + movementTwo() + movementThree()),

  /* One instruction, once. Four templated "nothing here" lines is the
     defect this state exists to avoid. */
  empty: () => shell(`
    <section class="band" aria-labelledby="mEmpty">
      <div class="card rise" style="--i:0">
        <div class="center">
          <h2 class="t-sect" id="mEmpty" data-type="sect">No work recorded yet</h2>
          <p class="t-body dim-2" data-type="body">Add the first job in Tasks and this view fills itself in as you finish things.</p>
          <button type="button" class="btn t-body" data-type="control">Open Tasks</button>
        </div>
      </div>
    </section>`),

  /* Skeletons at the real geometry of the sections that will actually
     render — never a promise of a section that never arrives. */
  loading: () => shell(
    `<div class="sk-wrap" aria-hidden="true">${movementOne() + movementTwo()}</div>` +
    `<p class="sr" role="status">Loading this reading.</p>`),

  /* Names the source, offers the one useful move, and shows nothing it
     cannot stand behind. */
  error: () => shell(`
    <section class="band" aria-labelledby="mError">
      <div class="card rise" style="--i:0">
        <div class="center">
          <div role="alert">
            <h2 class="t-sect" id="mError" data-type="sect">Tasks did not answer</h2>
            <p class="t-body dim-2" data-type="body">This reading needs the Tasks records and they did not come back. Nothing below is shown, because a part of this screen would be guessing.</p>
          </div>
          <button type="button" class="btn t-body" data-type="control" id="retry">Try again</button>
        </div>
      </div>
    </section>`),
};

/* The keys were read at the top of this script, above the accessor, so
   that a state could own its own facts. What is left here is the render. */
const root = document.getElementById("root");
const tip = document.getElementById("tip");

if (fatal) {
  window.__LATELY_FATAL = fatal;
  document.documentElement.setAttribute("data-fatal", fatal);
  document.title = `Lately · unknown ${fatal}`;
  root.innerHTML = `
    <div class="fatal">
      <p class="t-label" data-type="label">This surface did not render</p>
      <p class="t-sect" data-type="sect">Unknown ${esc(fatal)}</p>
      <p class="t-body dim-2" data-type="body">This master serves ${STATES.join(", ")} at ${VARIANTS.join(" and ")}, with motion ${MOTIONS.join(" or ")}. It stops on anything else rather than showing you the default and letting you believe you asked for it.</p>
    </div>`;
} else {
  document.body.dataset.state = state;
  document.body.dataset.v = variant;
  sources = SOURCES[state];
  root.innerHTML = VIEW[state]();

  /* The hero counts up, because the figure is the moment. It counts from a
     number near enough that the reader never sees a wrong total settle. */
  const counter = state === "loading" ? null : document.getElementById("count");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (counter && !reduced && PLAY) {
    const target = Number(counter.textContent);
    const from = Math.max(0, target - 12);
    const started = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - started) / 700);
      const eased = 1 - Math.pow(1 - t, 3);
      counter.textContent = String(Math.round(from + (target - from) * eased));
      if (t < 1) requestAnimationFrame(tick);
      else counter.textContent = String(target);
    };
    requestAnimationFrame(tick);
  }

  /* De-swarm. Two jobs three days apart overlap into a single blob at 390,
     and a strip that draws eight marks for nine jobs is lying about the
     count the card beside it states. Position on the axis stays exact —
     only the vertical, which carries no meaning here, absorbs the
     collision. Measured after layout, because the threshold is a pixel
     distance and the axis is a percentage. */
  const deswarm = () => {
    const strip = root.querySelector(".strip");
    if (!strip) return;
    const w = strip.clientWidth;
    if (!w) return;
    /* 20px, against a 17px expander half-width, so no mark's box can
       reach another mark's centre at any density. */
    const MIN = 20;
    const rows = [];
    Array.from(root.querySelectorAll(".dot"))
      .map((el) => ({ el, x: (parseFloat(el.style.getPropertyValue("--x")) / 100) * w }))
      .sort((a, b) => a.x - b.x)
      .forEach(({ el, x }) => {
        let r = 0;
        while (rows[r] !== undefined && x - rows[r] < MIN) r += 1;
        rows[r] = x;
        el.style.setProperty("--row", r);
      });
    strip.style.minHeight = `${92 + Math.max(0, rows.length - 1) * 20}px`;
  };
  /* The reading line's connector, measured after layout. */
  const reading = root.querySelector(".reading");
  const measureReading = () => {
    if (!reading) return;
    reading.removeAttribute("data-wrapped");
    const tops = Array.from(reading.querySelectorAll("p")).map((p) => Math.round(p.getBoundingClientRect().top));
    if (new Set(tops).size > 1) reading.setAttribute("data-wrapped", "");
  };
  const relayout = () => { deswarm(); measureReading(); };
  relayout();
  /* Again once the faces have swapped. A measurement taken against the
     fallback face is a measurement of a page nobody sees, and the
     reading line wraps at a different width in each. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  window.addEventListener("resize", () => { relayout(); queueMove(); });

  /* Pointer AND touch, and they are not the same interaction.
     A tooltip bound to hover does not exist under a coarse pointer: a tap
     raises it and the browser's own compatibility mouse sequence sends a
     pointerleave a frame later, so it flashes and is gone. Under touch the
     tip is PINNED — tap to raise, tap again or tap away to dismiss — and
     hover is left alone on a fine pointer. The mark's title lives nowhere
     else on the screen, so this is the whole reading on a phone. */
  let pinned = null;
  /* Filling and placing are separated so the scroll handler can reposition
     without re-parsing the tip's markup on every frame. */
  const fill = (el) => { tip.innerHTML = el.dataset.tip; };
  const place = (el) => {
    tip.classList.add("on");
    const box = el.getBoundingClientRect();
    const own = tip.getBoundingClientRect();
    tip.style.left = `${Math.max(8, Math.min(window.innerWidth - own.width - 8, box.left + box.width / 2 - own.width / 2))}px`;
    const above = box.top - own.height - 8;
    tip.style.top = `${above >= 8 ? above : Math.min(window.innerHeight - own.height - 8, box.bottom + 8)}px`;
  };
  let showing = null;
  const show = (el, pin = false) => { showing = el; fill(el); place(el); if (pin) pinned = el; };
  const hide = (force = false) => { if (pinned && !force) return; tip.classList.remove("on"); showing = null; };
  const drop = () => { pinned = null; showing = null; tip.classList.remove("on"); };

  /* The surface scrolls inside .scroll, not the document, so no scroll
     event reaches a window listener without capture. A focus-raised tip
     is hidden and restored when its mark comes back; only a touch pin is
     retired, because dropping a focused mark's label leaves a visibly
     focused mark with no name anywhere on the screen. */
  let queued = false;
  const onMove = () => {
    queued = false;
    if (!showing) return;
    const b = showing.getBoundingClientRect();
    if (b.bottom < 0 || b.top > window.innerHeight) {
      if (pinned) drop(); else tip.classList.remove("on");
      return;
    }
    if (pinned === showing || document.activeElement === showing) tip.classList.add("on");
    if (tip.classList.contains("on")) place(showing);
  };
  const queueMove = () => { if (!queued) { queued = true; requestAnimationFrame(onMove); } };
  window.addEventListener("scroll", queueMove, { capture: true, passive: true });

  document.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch" && !e.target.closest("[data-tip]")) drop();
  }, true);

  for (const el of root.querySelectorAll("[data-tip]")) {
    el.addEventListener("pointerenter", (e) => { if (e.pointerType !== "touch") show(el); });
    el.addEventListener("pointerleave", (e) => { if (e.pointerType !== "touch") hide(); });
    el.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "touch") return;
      e.preventDefault();
      const again = pinned === el;
      drop();
      if (!again) show(el, true);
    });
    el.addEventListener("focus", () => show(el));
    el.addEventListener("blur", () => hide());
    el.addEventListener("click", (e) => e.preventDefault());
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") drop(); });

  /* The skeleton is the real composition with its ink out, so it arrives
     carrying the real composition's controls and its screen-reader lines.
     Neither belongs to a state that has no data yet: a control is a promise
     the surface cannot keep, and a spoken sentence about nine open jobs is
     a claim about numbers nobody has read. Both are stripped, in place, so
     the geometry survives and the semantics do not lie. */
  for (const el of root.querySelectorAll(".sk-wrap .sr")) el.remove();
  for (const el of root.querySelectorAll(".sk-wrap a, .sk-wrap button")) {
    const inert = document.createElement("span");
    inert.className = el.className;
    if (el.getAttribute("style")) inert.setAttribute("style", el.getAttribute("style"));
    inert.append(...el.childNodes);
    el.replaceWith(inert);
  }
  window.__LATELY_READY = true;
}
</script>

<script>
(function () {
  "use strict";

  const deck = document.getElementById("deck");
  const frame = document.getElementById("frame");
  const META = JSON.parse(document.getElementById("meta").textContent);
  /* The master's own runtime contract, when it has one. A static master
     exports nothing and the console still works: decisions and state are
     written onto the deck as data attributes, which is what the master's
     CSS reads either way. */
  const api = window.__elevate || window.__signal || null;

  const cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  const normalize = function (list) {
    return (list || []).map(function (s) { return Array.isArray(s) ? s : [s, cap(s)]; });
  };

  const CONTROLS = (api && api.controls) || META.controls || [];
  const PRESETS = (api && api.presets) || META.presets || { a: {} };
  const PRESET_KEYS = Object.keys(PRESETS);
  const PRESET_COPY = (api && api.presetCopy) || META.presetCopy || {};
  const STATES = normalize((api && api.states) || META.states || ["resting"]);
  const WIDTHS = (META.widths || [1440, 1280, 768, 390]).map(function (w) { return [w, String(w)]; });
  const HEIGHTS = META.heights || { 1440: 960, 1280: 900, 768: 1024, 390: 844 };
  const STORE = "elevate." + (META.name || "lab") + ".console.v1";

  document.title = (META.name ? cap(META.name) + " " : "") + "Design Console";
  document.getElementById("brandWord").textContent = META.name || "design";
  document.getElementById("presetHelp").textContent = META.presetHelp ||
    (PRESET_KEYS.length + " finished version" + (PRESET_KEYS.length === 1 ? "" : "s") +
     ". Pick one, then change anything you like underneath.");
  document.getElementById("reset").textContent = "Back to " +
    ((PRESET_COPY[PRESET_KEYS[0]] || {}).name || "the first room");
  const paletteLine = (META.palette || []).map(function (p) { return p.name + " <b>" + p.hex + "</b>"; }).join(", ");
  document.getElementById("footNote").innerHTML = META.footNote ||
    ("This is the real thing, not a picture of one. Every control writes the same " +
     "attribute the product itself reads, so any combination you land on is a " +
     "buildable configuration. <b>Every combination stays on palette:</b> " +
     paletteLine + ", and tints of those. Nothing in this console can reach another colour.");

  let current = { preset: PRESET_KEYS[0], state: STATES.length ? STATES[0][0] : "", width: WIDTHS[0][0] };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved && typeof saved === "object") current = Object.assign(current, saved);
  } catch (error) { /* private mode */ }

  function decisionsFor(config) {
    const base = Object.assign({}, PRESETS[config.preset] || PRESETS[PRESET_KEYS[0]]);
    for (const control of CONTROLS) {
      if (config[control.key]) base[control.key] = config[control.key];
    }
    return base;
  }

  function render() {
    const decisions = decisionsFor(current);
    for (const control of CONTROLS) deck.setAttribute("data-" + control.key, decisions[control.key]);
    deck.setAttribute("data-w", String(current.width));
    deck.setAttribute("data-v", current.preset);

    if (api && api.setState) api.setState(current.state);
    else deck.setAttribute("data-state", current.state);
    if (api && api.mount) api.mount();

    /* The deck is drawn at its real pixel width and then scaled to fit the
       stage, so what you are looking at is a true layout at that width
       rather than a narrow one pretending. clientWidth includes the
       stage's own padding, and measuring that as available space is how
       the last column gets clipped. */
    const stage = frame.parentElement;
    const stageStyle = getComputedStyle(stage);
    const available = stage.clientWidth
      - parseFloat(stageStyle.paddingLeft)
      - parseFloat(stageStyle.paddingRight);
    const scale = Math.min(1, available / current.width);
    deck.style.width = current.width + "px";
    deck.style.height = (HEIGHTS[current.width] || 960) + "px";
    deck.style.transform = "scale(" + scale + ")";
    frame.style.width = Math.round(current.width * scale) + "px";
    frame.style.height = Math.round((HEIGHTS[current.width] || 960) * scale) + "px";

    paintControls();
    paintRecipe(decisions);
    try { localStorage.setItem(STORE, JSON.stringify(current)); } catch (error) { /* private mode */ }
  }

  function paintRecipe(decisions) {
    const lines = ["preset".padEnd(15, " ") + ((PRESET_COPY[current.preset] || {}).name || current.preset)];
    for (const control of CONTROLS) {
      const chosen = decisions[control.key];
      const label = (control.options.find(function (o) { return o[0] === chosen; }) || [])[1] || chosen;
      const changed = (PRESETS[current.preset] || {})[control.key] !== chosen;
      lines.push(control.label.toLowerCase().padEnd(15, " ") + label + (changed ? "   (changed)" : ""));
    }
    document.getElementById("recipe").textContent = lines.join("\n");
  }

  function paintControls() {
    const decisions = decisionsFor(current);
    Array.prototype.forEach.call(document.querySelectorAll("[data-choice]"), function (button) {
      button.setAttribute("aria-pressed", String(decisions[button.dataset.choice] === button.dataset.value));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-preset]"), function (button) {
      button.setAttribute("aria-pressed", String(current.preset === button.dataset.preset));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-state]"), function (button) {
      button.setAttribute("aria-pressed", String(current.state === button.dataset.state));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-width]"), function (button) {
      button.setAttribute("aria-pressed", String(String(current.width) === button.dataset.width));
    });
  }

  /* ── build the panel ─────────────────────────────────────────── */
  const presets = document.getElementById("presets");
  presets.dataset.cols = String(Math.min(PRESET_KEYS.length, 3));
  PRESET_KEYS.forEach(function (key) {
    const copy = PRESET_COPY[key] || { name: key.toUpperCase(), line: "" };
    const button = document.createElement("button");
    button.type = "button";
    button.className = "preset";
    button.dataset.preset = key;
    button.innerHTML = "<b>" + copy.name + "</b>" + (copy.line ? "<span>" + copy.line + "</span>" : "");
    button.addEventListener("click", function () {
      current = { preset: key, state: current.state, width: current.width };
      render();
    });
    presets.appendChild(button);
  });

  const controls = document.getElementById("controls");
  CONTROLS.forEach(function (control) {
    const group = document.createElement("div");
    group.className = "group";
    group.innerHTML =
      '<span class="groupLabel">' + control.label + "</span>" +
      (control.help ? '<p class="groupHelp">' + control.help + "</p>" : "");
    const row = document.createElement("div");
    row.className = "choices";
    row.dataset.cols = String(control.cols || Math.min(control.options.length, 3));
    control.options.forEach(function (option) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice";
      button.dataset.choice = control.key;
      button.dataset.value = option[0];
      button.innerHTML = "<span>" + option[1] + "</span>" + (option[2] ? "<small>" + option[2] + "</small>" : "");
      button.addEventListener("click", function () {
        current[control.key] = option[0];
        render();
      });
      row.appendChild(button);
    });
    group.appendChild(row);
    controls.appendChild(group);
  });

  const statesHost = document.getElementById("states");
  STATES.forEach(function (entry) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "stageTab";
    button.dataset.state = entry[0];
    button.textContent = entry[1];
    button.addEventListener("click", function () { current.state = entry[0]; render(); });
    statesHost.appendChild(button);
  });

  const widthsHost = document.getElementById("widths");
  WIDTHS.forEach(function (entry) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "stageTab";
    button.dataset.width = String(entry[0]);
    button.textContent = entry[1];
    button.addEventListener("click", function () { current.width = entry[0]; render(); });
    widthsHost.appendChild(button);
  });

  document.getElementById("reset").addEventListener("click", function () {
    current = { preset: PRESET_KEYS[0], state: current.state, width: current.width };
    render();
  });

  window.addEventListener("resize", function () { render(); });
  render();
})();
</script>
