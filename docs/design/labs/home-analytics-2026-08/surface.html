/* ── The lock ───────────────────────────────────────────────────────────
   Every colour that paints is one of these at some alpha; audit.mjs
   enforces it. The chart rule is measured, not preferred: identity is
   never hue (the ink ramp fails a 0.10 chroma floor on all four steps),
   magnitude is one hue, emphasis is one indigo mark against zinc, and the
   status four ship in a fixed order because red beside amber fails CVD
   separation at 4.4. See plan.html §05. */
:root {
  --paper:      #ffffff;
  --paper-2:    #fafafa;
  --paper-3:    #f4f4f5;
  --ink:        #111111;
  --ink-2:      #3f3f46;
  --ink-3:      #71717a;
  --ink-4:      #a1a1aa;
  --mark-ctx:   #d4d4d8;
  --mark-quiet: #71717a;
  --line:       rgba(17, 17, 17, 0.10);
  --line-soft:  rgba(17, 17, 17, 0.055);
  --wash:       rgba(17, 17, 17, 0.03);
  --accent:     #4f46e5;
  --accent-2:   #6366f1;
  --amber:      #d97706;
  --red:        #ef4444;
  --emerald:    #059669;
  --shadow:     rgba(17, 17, 17, 0.05);

  /* Spacing is a ladder with names. audit.mjs reads the SOURCE for raw px
     in margin, padding and gap, because a render cannot tell a token from
     the number it resolves to. Add rungs; never inline. */
  --gap-hair: 4px;
  --gap-tight: 8px;
  --gap-snug: 12px;
  --gap-line: 16px;
  --gap-room: 24px;
  --gap-wide: 32px;
  --gap-hall: 48px;
  --gap-far: 72px;

  /* Leading belongs to a role, not to a size: a 15px control and a 15px
     paragraph are two different objects. audit.mjs keys the check the same
     way, so these names and the data-type attributes agree by construction. */
  --lead-flat: 1;
  --lead-hero: 1.04;
  --lead-tight: 1.15;
  --lead-head: 1.25;
  --lead-label: 1.35;
  --lead-body: 1.55;
  --lead-lede: 1.45;

  /* Letterfit, same argument. Tracked uppercase mono is the micro-label
     voice of the suite; display sizes tighten, body sits at zero. */
  --track-display: -0.03em;
  --track-head: -0.015em;
  --track-flat: 0em;
  --track-unit: 0.04em;
  --track-label: 0.09em;

  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── The ground-flipped twin ────────────────────────────────────────────
   Not an inversion: the grounds flip, the marks keep their jobs. Indigo
   steps up to 400 because 600 on a near-black ground reads as a bruise,
   and the secondary ink steps up to zinc 400 because zinc 500 falls under
   4.5:1 against #18181b. Both are measured, not adjusted by eye. */
[data-v="dark"] {
  --paper:      #18181b;
  --paper-2:    #0f0f10;
  --paper-3:    #27272a;
  --ink:        #ffffff;
  --ink-2:      #d4d4d8;
  --ink-3:      #a1a1aa;
  --ink-4:      #71717a;
  --mark-ctx:   #3f3f46;
  --mark-quiet: #71717a;
  --line:       rgba(255, 255, 255, 0.12);
  --line-soft:  rgba(255, 255, 255, 0.07);
  --wash:       rgba(255, 255, 255, 0.04);
  --accent:     #818cf8;
  --accent-2:   #6366f1;
  --shadow:     rgba(15, 15, 16, 0.6);
}

* { box-sizing: border-box; }
/* The ladder is the only thing that sets vertical space. Left to the
   browser, 27 elements carried 748px of margin in seven values, none
   of them a rung, each scaled by its own font size — and audit.mjs
   reads the SOURCE for raw px, so it could never see them. */
h1, h2, h3, h4, p { margin: 0; }

/* The document is the scroller. With every pixel inside a 100vh div and
   html/body pinned to 100%, the primary reading gesture — space, page
   down — moved nothing on a fresh load, at any width, in any state. */
html { height: 100%; }
body { min-height: 100%; }

body {
  margin: 0;
  background: var(--paper-2);
  color: var(--ink);
  font-family: "Geist", system-ui, sans-serif;
  font-weight: 400;
  font-size: 15px;
  line-height: var(--lead-body);
  letter-spacing: var(--track-flat);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ── Typographic roles ──────────────────────────────────────────────────
   One class per role, carrying size, weight, leading and letterfit
   together, because those four are one decision. data-type on the element
   tells the gate which role it is, so the check and the design cannot
   drift apart. */
.t-hero   { font-size: 64px; font-weight: 600; line-height: var(--lead-flat);  letter-spacing: var(--track-display); font-variant-numeric: tabular-nums; }
.t-num    { font-size: 34px; font-weight: 600; line-height: var(--lead-hero);  letter-spacing: var(--track-display); font-variant-numeric: tabular-nums; }
.t-sect   { font-size: 26px; font-weight: 600; line-height: var(--lead-tight); letter-spacing: var(--track-head); }
.t-head   { font-size: 20px; font-weight: 600; line-height: var(--lead-head);  letter-spacing: var(--track-head); }
.t-lede   { font-size: 17px; font-weight: 400; line-height: var(--lead-lede);  letter-spacing: var(--track-flat); }
.t-body   { font-size: 15px; font-weight: 400; line-height: var(--lead-body);  letter-spacing: var(--track-flat); }
.t-small  { font-size: 13px; font-weight: 400; line-height: var(--lead-body);  letter-spacing: var(--track-flat); }
.t-unit   { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; font-weight: 400; line-height: var(--lead-label); letter-spacing: var(--track-unit); font-variant-numeric: tabular-nums; }
.t-label  { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; font-weight: 400; line-height: var(--lead-label); letter-spacing: var(--track-label); text-transform: uppercase; }

.dim   { color: var(--ink-3); }
.dim-2 { color: var(--ink-2); }

/* ── Shell ─────────────────────────────────────────────────────────────
   The rail is the product's, not this view's. It is inert furniture here
   and marked aria-hidden so a screen reader is not offered four controls
   that do nothing in a lab. */
.app { display: flex; min-height: 100vh; background: var(--paper-2); }

/* Sticky rather than stretched, so the product's rail stays put while
   the document scrolls under it. Inert below 561, where it is hidden. */
.rail {
  position: sticky; top: 0; height: 100vh; align-self: flex-start;
  width: 56px; flex: none;
  display: flex; flex-direction: column; align-items: center;
  gap: var(--gap-room); padding-top: var(--gap-room);
  border-right: 1px solid var(--line-soft);
  background: var(--paper-2);
}
.rail i {
  width: 26px; height: 26px; border-radius: 8px;
  display: grid; place-items: center;
  background: var(--wash);
  color: var(--ink-2);
}
.rail i.on { background: var(--ink); color: var(--paper); }

.canvas { flex: 1 1 auto; min-width: 0; }
/* clip, not hidden: overflow:hidden on one axis forces the other to
   auto and would reinstate the trap this fix exists to remove. */
.scroll { overflow-x: clip; }
.page { max-width: 1180px; margin: 0 auto; padding-left: var(--gap-hall); padding-right: var(--gap-hall); padding-bottom: var(--gap-far); }

/* ── Header and tabs ───────────────────────────────────────────────────*/
.top { padding-top: var(--gap-wide); padding-bottom: var(--gap-line); }
.top-row { display: flex; align-items: baseline; gap: var(--gap-snug); flex-wrap: wrap; }
.ws { color: var(--ink-3); }

.tabs { display: flex; gap: var(--gap-room); margin-top: var(--gap-line); border-bottom: 1px solid var(--line); }
.tab {
  position: relative; text-decoration: none; color: var(--ink-3);
  padding-top: var(--gap-tight); padding-bottom: var(--gap-snug);
  transition: color 0.14s var(--ease);
}
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tab[aria-current="page"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; background: var(--ink); border-radius: 2px;
}
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }

/* The reading line. Everything relative on this screen resolves against

   twelve columns alone make you do arithmetic. Neither is a caption for

.cols { position: absolute; top: 0; bottom: 0; left: 0; right: var(--gutter); display: flex; align-items: flex-end; justify-content: space-between; gap: var(--gap-hair); }

   without a sentence. */

<script>
/* ═══════════════════════════════════════════════════════════════════════
   ONE accessor per fact. Every figure on screen reads from D, so a header
   and the marks beneath it cannot disagree — a surface that contradicts
   itself spends the credibility of the whole product.
   ═══════════════════════════════════════════════════════════════════ */
const F = window.LATELY_FIXTURE;
const STATES = ["full", "partial", "quiet", "first-run", "empty", "loading", "error"];
const VARIANTS = ["light", "dark"];
const MOTIONS = ["play", "settled"];

/* ── The URL contract, read BEFORE the accessor ──────────────────
   An unknown ?state=, ?v= or ?motion= STOPS. The Notes shot harness
   took three variant keys the preset table did not contain and
   silently graded the locked preset three times over; thirty-six of
   forty frames per room were byte-identical and nobody noticed for
   nine rounds. A surface that accepts a key it does not have shows
   work that does not exist.
   It is read here, above D, because a state has to be known before
   its facts can be: assembling a degraded state out of the full
   state's numbers is what let the quiet state say nothing was
   sitting over three marks that were. */
const q = new URLSearchParams(location.search);
const wantState = q.get("state");
const wantV = q.get("v");
const wantMotion = q.get("motion");
let fatal = null;
if (wantState !== null && !STATES.includes(wantState)) fatal = `state=${wantState}`;
if (wantV !== null && !VARIANTS.includes(wantV)) fatal = `v=${wantV}`;
if (wantMotion !== null && !MOTIONS.includes(wantMotion)) fatal = `motion=${wantMotion}`;

/* Default: play for a person, settled for a machine. ?motion=
   overrides either way, so the choreography is still drivable under
   automation and the gate can prove it runs. */
const PLAY = wantMotion ? wantMotion === "play" : !navigator.webdriver;
if (!PLAY) document.documentElement.setAttribute("data-motion", "settled");

const state = fatal ? "full" : (wantState ?? "full");
const variant = fatal ? "light" : (wantV ?? "light");

const sum = (a) => a.reduce((x, y) => x + y, 0);

/* The state's own slice of the fixture. Emitted and guarded by
   derive-fixture.mjs, which fails the build if a scope's sentence and
   its marks disagree — so the contradiction cannot come back by hand. */
const SCOPE = F.scopes[state] ?? F.scopes.full;
const D = {
  workspace: F.bound.workspace,
  owner: F.bound.owner,
  readingLong: F.readingLong,
  /* A client that is still reading holds no weeks and no jobs. The state
     that draws that condition must not throw on it. */
  weeks: state === "first-run" ? (F.weeks ?? []).slice(-1) : (F.weeks ?? []),
  jobs: SCOPE.jobs ?? [],
  fortnight: F.fortnight,
  accountDays: F.accountDays,
  comparisonArrives: F.comparisonArrives,
  readingShort: F.readingShort,
  open: F.bound.openCount,
  lastFour: sum(F.weeks.slice(8).map((w) => w.v)),
  priorFour: sum(F.weeks.slice(4, 8).map((w) => w.v)),
  thisWeek: (F.weeks ?? []).length ? F.weeks[F.weeks.length - 1].v : 0,
  bestPrior: (F.weeks ?? []).length > 1 ? Math.max(...F.weeks.slice(0, -1).map((w) => w.v)) : 0,
  sitting: SCOPE.status.sitting,
  overdue: SCOPE.status.overdue,
  unowned: SCOPE.status.unowned,
  waiting: SCOPE.status.waiting,
};
D.delta = D.lastFour - D.priorFour;
D.oldest = D.jobs.length ? Math.max(...D.jobs.map((j) => j.age)) : 0;
/* Derived, never typed, and with no floor: a floor of 45 forced a
   three-day-old account to draw a six-week ruler, and it was only
   because the full state's oldest job rounds to exactly 45 that the
   hard-coded ticks ever agreed with the marks they label. */
D.axisMax = Math.max(5, Math.ceil((D.oldest + 2) / 5) * 5);
/* A threshold nothing can cross is not drawn. On a three-day-old
   account the fortnight line sits past the end of the axis, and a rule
   no mark can reach reads as a rule every mark has beaten. */
D.showsFortnight = D.fortnight <= D.axisMax;
D.scaleMarks = D.axisMax <= 10
  ? [0, D.axisMax]
  : D.axisMax <= 20
    ? [0, Math.round(D.axisMax / 2), D.axisMax]
    : [0, Math.round(D.axisMax / 3), Math.round((2 * D.axisMax) / 3), D.axisMax];
D.peak = D.weeks.length ? Math.max(...D.weeks.map((w) => w.v)) : 0;

/* The axis maximum is derived, never typed. A sixty-day job must not fall
   off the end of its own chart; the undesigned edge is a whole class of
   defect and this is where it starts. */
const pct = (v, max) => Math.max(2, Math.round((v / max) * 100));

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/* ── Atoms ──────────────────────────────────────────────────────────── */
const ICON = {
  up: '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M5 8.5V1.5M5 1.5L2 4.5M5 1.5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  down: '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M5 1.5v7M5 8.5l3-3M5 8.5l-3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  /* Status wears a shape as well as a colour, always, and never a colour
     alone: the four are amber, indigo, red, emerald in that fixed order
     because red adjacent to amber fails CVD separation at 4.4. */
  still: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2"/></svg>',
  past: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.6 11 10.4H1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  nobody: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.6" y="1.6" width="8.8" height="8.8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  waiting: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.4 6h7.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  clear: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 6.4 4.8 9l5-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

/* The rail is drawn, not set. Geist carries none of the three characters
   this used to use, so an OS fallback painted them — a filled pencil beside
   three outlines, and a different shape on every machine. audit.mjs reads
   the authored family, never the painted one, so it could not see it.
   Sixteen on sixteen, at 1.5 stroke, the same pen as ICON. */
const RAIL = {
  home: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 7 8 2.5 13.5 7v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  notes: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.2 2.8a1.7 1.7 0 0 1 2.4 2.4L6.4 12.4l-3.2.8.8-3.2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  tasks: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 8.2 7.3 10l3.4-3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  timeline: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 11.5 11.5 4.5M6 4.5h5.5V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

/* Each status mark carries its own tone on the wrapper, so the glyph can
   inherit it and the twin's indigo step reaches the one mark that used to
   miss it. The four tones are the reserved status four; --accent is the
   only one the dark ground redefines, which is exactly the one that had
   to move. */
const TONE = { still: "--amber", past: "--red", nobody: "--accent", waiting: "--emerald", clear: "--emerald" };

function label(text) {
  return `<p class="t-label dim" data-type="label">${esc(text)}</p>`;
}

/* A KPI card. `n` may be a number or the string "—"; when a source did not
   answer the card keeps its shape and says so in words, and never resolves
   to a fabricated zero. */
/* The phrase comes in both numbers and is picked by the count. A fixed
   plural under a numeral that can be 1 printed "1 have nobody's name on
   them" on screen and spoke it aloud. Zero keeps the plural, which is
   already correct. */
function kpi({ n, word, glyph, tone, i, unavailable = false }) {
  const known = !unavailable;
  const phrase = n === 1 ? word.one : word.many;
  const share = known && D.open ? Math.min(1, n / D.open) : 0;
  const name = known
    ? `${plural(n, "job", "jobs")} ${phrase}, of ${plural(D.open, "job", "jobs")} open`
    : `Jobs ${word.many}: not available, because Timeline did not answer`;
  const body = `
      <span class="glyph" aria-hidden="true" style="color:var(${tone})">${glyph}</span>
      ${known
        ? `<span class="t-num" data-type="bignum" aria-hidden="true">${n}</span>`
        : `<span class="t-num na" data-type="bignum" aria-hidden="true">&mdash;</span>`}
      <span class="t-small dim-2" data-type="small" aria-hidden="true">${esc(known ? phrase : word.many)}</span>
      ${known
        ? `<span class="meter" aria-hidden="true"><i class="${n === 0 ? "zero" : ""}" style="--f:${share};--i:${i}"></i></span>`
        : `<span class="t-label dim" data-type="label" aria-hidden="true">Not available</span>`}
      `;
  /* Never a link. Nothing on this surface opens a filtered list, and a
     role the screen cannot honour is the same promise the hero stopped
     making in round 1. The destination is on the port packet; the
     affordance ships when it does. */
  return `<div class="kpi rise" role="group" aria-label="${esc(name)}" style="--i:${i}">${body}</div>`;
}

/* The denominator card. Not a status, so it wears no status furniture and
   no meter — a meter against itself is always full, which says nothing. */
function leadKpi(i) {
  return `
    <div class="kpi lead rise" style="--i:${i}">
      <span class="t-label" data-type="label">Open now</span>
      <span class="t-num" data-type="bignum">${D.open}</span>
      <span class="t-small" data-type="small">jobs not finished</span>
      <span class="sr">Every card in this row is counted out of these ${plural(D.open, "open job", "open jobs")}.</span>
    </div>`;
}

/* ── Movement one ───────────────────────────────────────────────────── */
function chart({ record = true } = {}) {
  const max = Math.max(D.peak, D.bestPrior);
  if (!D.weeks.length) return `<div class="chart"><div class="plot" aria-hidden="true"><span class="baseline"></span></div><div class="xaxis" aria-hidden="true"></div><p class="sr">No weeks have been read yet.</p></div>`;
  const cols = D.weeks.map((w, i) => {
    const live = i === D.weeks.length - 1;
    const cls = w.partial ? "bar part" : "bar";
    const val = live
      ? `<span class="bar-val t-label" data-type="label" style="--h:${pct(w.v, max)}">${w.v} so far</span>`
      : "";
    return `<span class="colw"><span class="${cls}" style="--h:${pct(w.v, max)};--i:${i}"></span>${val}</span>`;
  }).join("");
  const ticks = D.weeks.map((w, i) => {
    const show = i % 3 === 0 || i === D.weeks.length - 1;
    return `<span class="t-label ${show ? "" : "mute"}" data-type="label">${esc(w.start)}</span>`;
  }).join("");
  /* --r is an inline custom property, so a sibling inherits nothing:
     it is repeated deliberately, not by accident. */
  const r = pct(D.bestPrior, max);
  const rec = record
    ? `<span class="record" style="--r:${r}"></span>` +
      `<span class="record-tag t-label" data-type="label" style="--r:${r}">Best week &middot; ${D.bestPrior}</span>`
    : "";
  /* Three gridlines with their values, so the columns are read against a
     magnitude rather than only against each other. */
  const grid = [0.5, 1].map((g) => {
    const v = Math.round(max * g);
    return `<span class="gridline" style="bottom:${g * 100}%"><b class="t-label" data-type="label">${v}</b></span>`;
  }).join("");
  return `
    <div class="chart">
      <div class="plot" aria-hidden="true">
        ${grid}
        <span class="baseline"></span>
        ${rec}
        <span class="cols">${cols}</span>
      </div>
      <div class="xaxis" aria-hidden="true">${ticks}</div>
      <p class="sr">${D.weeks.length ? `Twelve weeks of finished work, week commencing ${esc(D.weeks[0].start)} to ${esc(D.weeks[D.weeks.length - 1].start)}: ${D.weeks.map((w) => `${w.start}, ${w.v}${w.partial ? " so far" : ""}`).join("; ")}.${record ? ` The best week before this one was ${D.bestPrior}.` : ""}` : "No weeks have been read yet."}</p>
    </div>`;
}

/* The previous best is drawn whenever it is knowable — two or more weeks
   of record — and never switched off per state. A mark that vanishes for
   a reason the screen does not give teaches that when something is
   wrong, marks disappear quietly. */
function movementOne({ record = D.weeks.length > 1 } = {}) {
  const up = D.delta >= 0;
  return `
    <section class="band" aria-labelledby="m1">
      <div class="band-head">
        <h2 class="t-sect" id="m1" data-type="sect">What you did</h2>
        <span class="grow"></span>
        <p class="t-label dim" data-type="label">${D.weeks.length >= 4 ? `Last four weeks &middot; ${esc(D.weeks[D.weeks.length - 4].start)} to ${esc(D.readingShort)}` : ""}</p>
      </div>
      <div class="card hero rise" style="--i:1">
        <div class="hero-fig">
          <div class="stack">
            <div class="hero-n">
              <span class="t-hero" data-type="hero" id="count">${D.lastFour}</span>
              <span class="delta t-label" data-type="label">${up ? ICON.up : ICON.down} ${up ? "+" : ""}${D.delta} on the four before</span>
            </div>
            <p class="t-body dim-2 hero-note" data-type="body">jobs finished, ${esc(D.workspace)}${D.weeks.length && D.weeks[D.weeks.length - 1].partial ? " &mdash; this week still running" : ""}</p>
          </div>
          <p class="t-small dim hero-note" data-type="small">Counted at the moment each job reached a done column.</p>
        </div>
        ${chart({ record })}
      </div>
    </section>`;
}

/* ── Movement two ───────────────────────────────────────────────────── */
function strip() {
  const dots = D.jobs.map((j, i) => {
    const old = j.age >= D.fortnight;
    return `<button type="button" class="dot ${old ? "old" : ""}" style="--x:${(j.age / D.axisMax) * 100};--i:${i}" data-tip="<b>${plural(j.age, "day", "days")} open</b><s>${esc(j.title)}</s>" aria-label="${esc(j.title)}, open ${plural(j.age, "day", "days")}"></button>`;
  }).join("");
  const marks = D.scaleMarks;
  return `
    <div class="card ages rise" style="--i:3">
      <div class="band-head">
        <h3 class="t-head" data-type="head">How long open work has been sitting</h3>
        <span class="grow"></span>
        <p class="t-label dim" data-type="label">Oldest &middot; ${plural(D.oldest, "day", "days")}</p>
      </div>
      <div class="strip" data-axis-max="${D.axisMax}">
        ${D.showsFortnight ? `<span class="fortnight" style="--x:${(D.fortnight / D.axisMax) * 100}"><span class="t-label" data-type="label">A fortnight</span></span>` : ""}
        <span class="strip-axis"></span>
        ${dots}
        <span class="strip-scale">${marks.map((n) => `<span class="t-unit" data-type="unit" style="--x:${(n / D.axisMax) * 100}">${n === 0 ? "today" : n + "d"}</span>`).join("")}</span>
      </div>
      <p class="sr">${plural(D.jobs.length, "open job", "open jobs")}, by age: ${D.jobs.map((j) => `${j.title}, ${j.age} days`).join("; ")}. ${plural(D.sitting, "job has", "jobs have")} been open longer than a fortnight.</p>
    </div>`;
}

function movementTwo({ partial = false } = {}) {
  return `
    <section class="band" aria-labelledby="m2">
      <div class="band-head">
        <h2 class="t-sect" id="m2" data-type="sect">What&rsquo;s quietly slipping</h2>
        <span class="grow"></span>
        <p class="t-label dim" data-type="label">All five counted out of ${D.open}</p>
      </div>
      <div class="kpis">
        ${leadKpi(0)}
        ${kpi({ n: D.sitting, word: { one: "hasn’t moved in a fortnight", many: "haven’t moved in a fortnight" }, glyph: ICON.still, tone: TONE.still, i: 1 })}
        ${kpi({ n: D.overdue, word: { one: "is past the day it was due", many: "past the day they were due" }, glyph: ICON.past, tone: TONE.past, i: 2, unavailable: partial })}
        ${kpi({ n: D.unowned, word: { one: "has nobody’s name on it", many: "have nobody’s name on them" }, glyph: ICON.nobody, tone: TONE.nobody, i: 3 })}
        ${kpi({ n: D.waiting, word: { one: "is waiting on something else", many: "are waiting on something else" }, glyph: ICON.waiting, tone: TONE.waiting, i: 4 })}
      </div>
      ${partial ? `<div class="note" style="margin-top:var(--gap-line)"><p class="t-body dim-2" data-type="body">Timeline did not answer this reading, so nothing here knows a due date. The card keeps its place and says so; it does not fall back to zero.</p></div>` : ""}
      ${strip()}
    </section>`;
}

/* ── Movement three ─────────────────────────────────────────────────── */
/* Written for the owner, not for the team that built it. The second tile
   states a condition rather than a start date: nothing records a date move
   yet, so naming the month one begins would be a fact the fixture does not
   hold — and the month it used to name had not happened at the reading. */
const LIMITS = [
  ["Open work over time", "Nothing was written down about how much was open in earlier weeks, so there is nothing yet to compare this against."],
  ["How a date moved", "When a date gets moved, nothing keeps a record of it yet. Once something does, only moves from that day on will be in it."],
  ["Decisions still open", "Notes doesn’t keep a list of which decisions are still open, so nothing here can count them. That would be a change in Notes."],
];

function movementThree() {
  const ghostCols = [38, 52, 44, 61, 47, 58, 50, 66, 54, 62, 57, 70]
    .map((h) => `<i style="--h:${h}"></i>`).join("");
  return `
    <section class="band" aria-labelledby="m3">
      <div class="band-head">
        <h2 class="t-sect" id="m3" data-type="sect">What this can&rsquo;t tell you</h2>
        <span class="grow"></span>
        <p class="t-label dim" data-type="label">Three refusals</p>
      </div>
      <div class="limits">
        ${LIMITS.map(([head, why]) => `
        <div class="limit rise" style="--i:1">
          ${label("Not yet")}
          <p class="t-head" data-type="head">${head}</p>
          <p class="t-small dim-2" data-type="small">${why}</p>
        </div>`).join("")}
      </div>
      <figure class="ghost rise" style="--i:2">
        <div class="ghost-plot" aria-hidden="true">${ghostCols}</div>
        <figcaption class="ghost-say">
          <p class="t-head" data-type="head">Open work over time — the chart that would go here</p>
          <p class="t-small dim" data-type="small">Once open work starts being counted each week, it fills in after about a month.</p>
        </figcaption>
      </figure>
    </section>`;
}

/* ── The seven states ───────────────────────────────────────────────── */
const SOURCES = {
  full:        { tasks: "answered", timeline: "answered", notes: "answered, for you" },
  partial:     { tasks: "answered", timeline: "did not answer", notes: "answered, for you" },
  quiet:       { tasks: "answered", timeline: "answered", notes: "answered, for you" },
  "first-run": { tasks: "answered", timeline: "answered", notes: "answered, for you" },
  empty:       { tasks: "answered, nothing recorded", timeline: "not read", notes: "not read" },
  loading:     { tasks: "reading", timeline: "reading", notes: "reading" },
  error:       { tasks: "did not answer", timeline: "not read", notes: "not read" },
};
let sources = SOURCES.full;

function shell(inner) {
  return `
  <div class="app">
    <nav class="rail" aria-hidden="true">
      <i class="on">${RAIL.home}</i><i>${RAIL.notes}</i><i>${RAIL.tasks}</i><i>${RAIL.timeline}</i>
    </nav>
    <div class="canvas"><div class="scroll"><div class="page">
      <header class="top">
        <div class="top-row">
          <h1 class="t-sect" data-type="sect">Home</h1>
          <p class="t-body ws" data-type="body">${esc(D.workspace)} &middot; ${esc(D.owner)}</p>
        </div>
        <nav class="tabs" aria-label="Home views">
          <a class="tab t-body" data-type="control" href="#">Today&rsquo;s Signal</a>
          <a class="tab t-body" data-type="control" href="#">Full Briefing</a>
          <a class="tab t-body" data-type="control" href="#" aria-current="page">Lately</a>
        </nav>
        <div class="reading">
          <p class="t-label" data-type="label">Read at ${esc(D.readingLong)}</p>
          <span class="rule"></span>
          <p class="t-label" data-type="label">Twelve weeks</p>
        </div>
      </header>
      <main>${inner}</main>
      <footer class="coverage t-label" data-type="label" aria-label="What this reading was built from">
        <span><b>Tasks</b> ${esc(sources.tasks)}</span>
        <span><b>Timeline</b> ${esc(sources.timeline)}</span>
        <span><b>Notes</b> ${esc(sources.notes)}</span>
        <span><b>Read</b> ${esc(D.readingLong)}</span>
        <span><b>Lab</b> counts and ages are lab-authored</span>
        <span><b>Bound</b> workspace, owner, reading date and the ${D.open}</span>
      </footer>
    </div></div></div>
  </div>`;
}

const VIEW = {
  full: () => shell(movementOne() + movementTwo() + movementThree()),

  partial: () => shell(movementOne() + movementTwo({ partial: true }) + movementThree()),

  /* Nothing slipping. The band does not vanish — an absent band reads as a
     bug — it states the absence once, with its arithmetic. */
  quiet: () => shell(movementOne() + `
    <section class="band" aria-labelledby="m2q">
      <div class="band-head">
        <h2 class="t-sect" id="m2q" data-type="sect">What&rsquo;s quietly slipping</h2>
      </div>
      <div class="card rise" style="--i:1">
        <div class="center">
          <span class="glyph" aria-hidden="true" style="color:var(--emerald)">${ICON.clear}</span>
          <p class="t-head" data-type="head">Nothing is sitting</p>
          <p class="t-body dim-2" data-type="body">${D.open === 1 ? "The one open job has" : `All ${D.open} open jobs have`} moved inside a fortnight, none is past its day, every one has a name on it, and none is waiting on anything else.</p>
        </div>
      </div>
      ${strip()}
    </section>` + movementThree()),

  /* Under four weeks of work: no comparison is attempted, and the date the
     comparison arrives is named rather than left as a mystery. */
  "first-run": () => shell(`
    <section class="band" aria-labelledby="m1f">
      <div class="band-head">
        <h2 class="t-sect" id="m1f" data-type="sect">What you did</h2>
      </div>
      <div class="card hero rise" style="--i:1">
        <div class="hero-fig">
          <div class="stack">
            <div class="hero-n"><span class="t-hero" data-type="hero">${D.thisWeek}</span></div>
            <p class="t-body dim-2 hero-note" data-type="body">jobs finished since you started, ${esc(D.workspace)}</p>
          </div>
          <p class="t-small dim hero-note" data-type="small">Four weeks of records make a comparison worth printing. Yours arrive on ${esc(D.comparisonArrives)}.</p>
        </div>
        <div class="chart">
          <div class="plot solo" aria-hidden="true">
            <span class="baseline"></span>
            <span class="cols"><span class="colw"><span class="bar part" style="--h:100;--i:0"></span><span class="bar-val t-label" data-type="label" style="--h:100">${D.thisWeek} so far</span></span></span>
          </div>
          <div class="xaxis" aria-hidden="true"><span class="t-label" data-type="label">${D.weeks.length ? esc(D.weeks[0].start) : ""}</span></div>
          <p class="sr">This week so far: ${D.thisWeek} jobs finished${D.weeks.length ? `, week commencing ${esc(D.weeks[0].start)}` : ""}. There is no earlier week to compare it with; twelve weeks of history are not recorded yet.</p>
        </div>
      </div>
    </section>` + movementTwo() + movementThree()),

  /* One instruction, once. Four templated "nothing here" lines is the
     defect this state exists to avoid. */
  empty: () => shell(`
    <section class="band" aria-labelledby="mEmpty">
      <div class="card rise" style="--i:0">
        <div class="center">
          <h2 class="t-sect" id="mEmpty" data-type="sect">No work recorded yet</h2>
          <p class="t-body dim-2" data-type="body">Add the first job in Tasks and this view fills itself in as you finish things.</p>
          <button type="button" class="btn t-body" data-type="control">Open Tasks</button>
        </div>
      </div>
    </section>`),

  /* Skeletons at the real geometry of the sections that will actually
     render — never a promise of a section that never arrives. */
  loading: () => shell(
    `<div class="sk-wrap" aria-hidden="true">${movementOne() + movementTwo()}</div>` +
    `<p class="sr" role="status">Loading this reading.</p>` +
    /* The refusals need no source, so they arrive whole rather than as
       skeleton, and the frame becomes the height of the page that
       follows instead of two thirds of it. */
    movementThree()),

  /* Names the source, offers the one useful move, and shows nothing it
     cannot stand behind. */
  error: () => shell(`
    <section class="band" aria-labelledby="mError">
      <div class="card rise" style="--i:0">
        <div class="center">
          <div role="alert">
            <h2 class="t-sect" id="mError" data-type="sect">Tasks did not answer</h2>
            <p class="t-body dim-2" data-type="body">This reading needs the Tasks records and they did not come back. Nothing below is shown, because a part of this screen would be guessing.</p>
          </div>
          <button type="button" class="btn t-body" data-type="control" id="retry">Try again</button>
        </div>
      </div>
    </section>`),
};

/* The keys were read at the top of this script, above the accessor, so
   that a state could own its own facts. What is left here is the render. */
const root = document.getElementById("root");
const tip = document.getElementById("tip");

if (fatal) {
  window.__LATELY_FATAL = fatal;
  document.documentElement.setAttribute("data-fatal", fatal);
  document.title = `Lately · unknown ${fatal}`;
  root.innerHTML = `
    <div class="fatal">
      <p class="t-label" data-type="label">This surface did not render</p>
      <p class="t-sect" data-type="sect">Unknown ${esc(fatal)}</p>
      <p class="t-body dim-2" data-type="body">This master serves ${STATES.join(", ")} at ${VARIANTS.join(" and ")}, with motion ${MOTIONS.join(" or ")}. It stops on anything else rather than showing you the default and letting you believe you asked for it.</p>
    </div>`;
} else {
  document.body.dataset.state = state;
  document.body.dataset.v = variant;
  sources = SOURCES[state];
  root.innerHTML = VIEW[state]();

  /* The hero counts up, because the figure is the moment. It counts from a
     number near enough that the reader never sees a wrong total settle. */
  const counter = state === "loading" ? null : document.getElementById("count");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (counter && !reduced && PLAY) {
    const target = Number(counter.textContent);
    const from = Math.max(0, target - 12);
    const started = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - started) / 700);
      const eased = 1 - Math.pow(1 - t, 3);
      counter.textContent = String(Math.round(from + (target - from) * eased));
      if (t < 1) requestAnimationFrame(tick);
      else counter.textContent = String(target);
    };
    requestAnimationFrame(tick);
  }

  /* De-swarm. Two jobs three days apart overlap into a single blob at 390,
     and a strip that draws eight marks for nine jobs is lying about the
     count the card beside it states. Position on the axis stays exact —
     only the vertical, which carries no meaning here, absorbs the
     collision. Measured after layout, because the threshold is a pixel
     distance and the axis is a percentage. */
  const deswarm = () => {
    const strip = root.querySelector(".strip");
    if (!strip) return;
    const w = strip.clientWidth;
    if (!w) return;
    /* 20px, against a 17px expander half-width, so no mark's box can
       reach another mark's centre at any density. */
    const MIN = 20;
    const rows = [];
    Array.from(root.querySelectorAll(".dot"))
      .map((el) => ({ el, x: (parseFloat(el.style.getPropertyValue("--x")) / 100) * w }))
      .sort((a, b) => a.x - b.x)
      .forEach(({ el, x }) => {
        let r = 0;
        while (rows[r] !== undefined && x - rows[r] < MIN) r += 1;
        rows[r] = x;
        el.style.setProperty("--row", r);
      });
    strip.style.minHeight = `${Math.max(112, 92 + (rows.length - 1) * 20)}px`;
  };
  /* The reading line's connector, measured after layout. */
  const reading = root.querySelector(".reading");
  const measureReading = () => {
    if (!reading) return;
    reading.removeAttribute("data-wrapped");
    const tops = Array.from(reading.querySelectorAll("p")).map((p) => Math.round(p.getBoundingClientRect().top));
    if (new Set(tops).size > 1) reading.setAttribute("data-wrapped", "");
  };
  /* The fortnight label, measured against the strip it belongs to. */
  const measureFortnight = () => {
    const rule = root.querySelector(".fortnight");
    const strip = root.querySelector(".strip");
    if (!rule || !strip) return;
    rule.removeAttribute("data-flip");
    const span = rule.querySelector("span");
    const box = strip.getBoundingClientRect();
    const r = span.getBoundingClientRect();
    if (r.right > box.right + 0.5) rule.setAttribute("data-flip", "");
  };
  const relayout = () => { deswarm(); measureReading(); measureFortnight(); };
  relayout();
  /* Again once the faces have swapped. A measurement taken against the
     fallback face is a measurement of a page nobody sees, and the
     reading line wraps at a different width in each. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  /* A resize re-lays the marks and the browser does not follow focus, so
     a reader loses the ring and the mark's title — which lives nowhere
     else on this screen — with no way back but Tab. */
  window.addEventListener("resize", () => {
    const held = document.activeElement;
    relayout();
    if (held && held !== document.body && root.contains(held)) {
      const b = held.getBoundingClientRect();
      if (b.top < 0 || b.bottom > window.innerHeight) held.scrollIntoView({ block: "nearest" });
    }
    queueMove();
  });

  /* Pointer AND touch, and they are not the same interaction.
     A tooltip bound to hover does not exist under a coarse pointer: a tap
     raises it and the browser's own compatibility mouse sequence sends a
     pointerleave a frame later, so it flashes and is gone. Under touch the
     tip is PINNED — tap to raise, tap again or tap away to dismiss — and
     hover is left alone on a fine pointer. The mark's title lives nowhere
     else on the screen, so this is the whole reading on a phone. */
  let pinned = null;
  /* Filling and placing are separated so the scroll handler can reposition
     without re-parsing the tip's markup on every frame. */
  const fill = (el) => { tip.innerHTML = el.dataset.tip; };
  const place = (el) => {
    tip.classList.add("on");
    const box = el.getBoundingClientRect();
    const own = tip.getBoundingClientRect();
    tip.style.left = `${Math.max(8, Math.min(window.innerWidth - own.width - 8, box.left + box.width / 2 - own.width / 2))}px`;
    const above = box.top - own.height - 8;
    tip.style.top = `${above >= 8 ? above : Math.min(window.innerHeight - own.height - 8, box.bottom + 8)}px`;
  };
  let showing = null;
  const show = (el, pin = false) => { showing = el; fill(el); place(el); if (pin) pinned = el; };
  const hide = (force = false) => { if (pinned && !force) return; tip.classList.remove("on"); showing = null; };
  const drop = () => { pinned = null; showing = null; tip.classList.remove("on"); };

  /* The surface scrolls inside .scroll, not the document, so no scroll
     event reaches a window listener without capture. A focus-raised tip
     is hidden and restored when its mark comes back; only a touch pin is
     retired, because dropping a focused mark's label leaves a visibly
     focused mark with no name anywhere on the screen. */
  let queued = false;
  const onMove = () => {
    queued = false;
    if (!showing) return;
    const b = showing.getBoundingClientRect();
    if (b.bottom < 0 || b.top > window.innerHeight) {
      if (pinned) drop(); else tip.classList.remove("on");
      return;
    }
    if (pinned === showing || document.activeElement === showing) tip.classList.add("on");
    if (tip.classList.contains("on")) place(showing);
  };
  const queueMove = () => { if (!queued) { queued = true; requestAnimationFrame(onMove); } };
  window.addEventListener("scroll", queueMove, { capture: true, passive: true });

  document.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch" && !e.target.closest("[data-tip]")) drop();
  }, true);

  for (const el of root.querySelectorAll("[data-tip]")) {
    el.addEventListener("pointerenter", (e) => { if (e.pointerType !== "touch") show(el); });
    el.addEventListener("pointerleave", (e) => { if (e.pointerType !== "touch") hide(); });
    el.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "touch") return;
      e.preventDefault();
      const again = pinned === el;
      drop();
      if (!again) show(el, true);
    });
    el.addEventListener("focus", () => show(el));
    el.addEventListener("blur", () => hide());
    el.addEventListener("click", (e) => e.preventDefault());
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") drop(); });

  /* The skeleton is the real composition with its ink out, so it arrives
     carrying the real composition's controls and its screen-reader lines.
     Neither belongs to a state that has no data yet: a control is a promise
     the surface cannot keep, and a spoken sentence about nine open jobs is
     a claim about numbers nobody has read. Both are stripped, in place, so
     the geometry survives and the semantics do not lie. */
  /* A state that says it is still reading may not publish the reading.
     Every magnitude is neutralised in place — heights, fills, ages, the
     partial-week treatment and the previous-best tag — so the geometry
     survives and the numbers do not leak. Done before the de-swarm, so
     nothing downstream has to be re-run. */
  if (state === "loading") {
    const wrap = root.querySelector(".sk-wrap");
    if (wrap) {
      for (const b of wrap.querySelectorAll(".bar")) { b.style.setProperty("--h", 46); b.classList.remove("part"); }
      for (const v of wrap.querySelectorAll(".bar-val")) v.style.setProperty("--h", 46);
      for (const m of wrap.querySelectorAll(".meter i")) { m.style.setProperty("--f", 0.4); m.classList.remove("zero"); }
      const dots = Array.from(wrap.querySelectorAll(".dot"));
      dots.forEach((d, i) => d.style.setProperty("--x", ((i + 0.5) / dots.length) * 100));
    }
  }
  for (const el of root.querySelectorAll(".sk-wrap .sr")) el.remove();
  for (const el of root.querySelectorAll(".sk-wrap a, .sk-wrap button")) {
    const inert = document.createElement("span");
    inert.className = el.className;
    if (el.getAttribute("style")) inert.setAttribute("style", el.getAttribute("style"));
    inert.append(...el.childNodes);
    el.replaceWith(inert);
  }
  window.__LATELY_READY = true;
}
</script>
