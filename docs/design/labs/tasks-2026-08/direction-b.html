<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier · Tasks direction B</title>
<link rel="stylesheet" href="./foundation.css">
<style>
/* ═══════════════════════════════════════════════════════════════════
   DIRECTION B · ATELIER

   Thesis: Timeline already earned a register this company can be proud
   of — big confident type, real air, one accent spent once. Tasks reads
   like a competent kanban from a category Signal Studio says it is not
   in. This direction brings the studio register across: the project is
   named at a size you can read across a room, the day is stated in one
   plain sentence, and the board underneath is a wall of work with air
   around it rather than five boxes pressed together.

   Chrome: the black top rail is gone and its jobs move to a white
   masthead the PRODUCT owns — search, share, planning, account, and the
   project's own truth. The left rail stays the one spine, narrows to
   64px, drops its labels, and earns its width back with material: an
   inverted white plate for the page you are on, a name plate on hover,
   and a real expansion to 224px on hover-intent that spells everything
   out, wordmark included.

   Deliberate sacrifice: vertical canvas. The masthead costs ~104px that
   Direction A spends on work.
   ═══════════════════════════════════════════════════════════════════ */

:root {
  --b-rail: 64px;
  --b-rail-open: 224px;
  --b-sidebar: 244px;
  --b-chrome: #101012;
  --b-ink: rgba(255,255,255,0.58);
  --b-ink-strong: #fff;
  /* proposed, additive: one warm ground for Tasks so white cards have
     something to sit on without a shadow. Paper stays #fff. */
  --b-ground: #fbfbfa;
}

body { background: var(--b-ground); }

.shell { display: grid; grid-template-columns: var(--b-rail) minmax(0,1fr); height: 100dvh; position: relative; }

/* ── the spine ─────────────────────────────────────────────────── */
.rail {
  background:
    linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0) 220px),
    var(--b-chrome);
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0 14px;
  position: relative;
  z-index: 5;
}
.railWord {
  height: 44px; width: 44px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 21px; font-weight: 600; letter-spacing: -0.05em;
  color: var(--b-ink-strong);
  margin-bottom: 14px;
}
.railWord::after {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); margin-left: 1.5px; transform: translateY(6px);
}
.railGroup { display: grid; gap: 4px; }
.railTile {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: grid; place-items: center;
  color: var(--b-ink);
  position: relative;
  transition: background-color var(--motion-fast) var(--ease-out),
              color var(--motion-fast) var(--ease-out);
}
.railTile svg { width: 20px; height: 20px; position: relative; z-index: 1; }
.railTile:hover { color: var(--b-ink-strong); background: rgba(255,255,255,0.07); }
/* The page you are on is inverted: a white plate, ink glyph. Nothing else
   in the chrome is white, so it cannot be misread. */
.railTile[data-active] { background: #fff; color: var(--ink); }
.railTile[data-tip]::after {
  content: attr(data-tip);
  position: absolute; left: calc(100% + 10px); top: 50%;
  transform: translateY(-50%) translateX(-4px);
  background: #1c1c1f; color: #fff;
  font-size: 12px; letter-spacing: -0.005em;
  padding: 5px 9px; border-radius: var(--radius-md);
  white-space: nowrap; pointer-events: none;
  opacity: 0;
  transition: opacity var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out);
}
.railTile:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }
.railDivider { width: 22px; height: 1px; background: rgba(255,255,255,0.12); margin: 12px 0; }
.railSpacer { flex: 1; }

/* ── projects sidebar ──────────────────────────────────────────── */
.side {
  background: var(--paper);
  border-right: 1px solid var(--hairline);
  display: flex; flex-direction: column;
  min-width: 0;
}
.sideHead { padding: 26px 20px 10px; display: flex; align-items: baseline; }
.sideEyebrow {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint);
}
.sideHead button { margin-left: auto; color: var(--ink-faint); width: 24px; height: 24px; display: grid; place-items: center; }
.sideHead button svg { width: 16px; height: 16px; }
.sideList { padding: 0 12px; display: grid; gap: 1px; }
.sideRow {
  display: flex; align-items: center; gap: 11px;
  height: 36px; padding: 0 10px;
  border-radius: var(--radius-md);
  font-size: 13.5px; color: var(--ink-soft); letter-spacing: -0.01em;
}
.sideRow svg { width: 17px; height: 17px; color: var(--ink-faint); flex: none; }
.sideRow em { font-style: normal; margin-left: auto; font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.sideRow:hover { background: var(--paper-soft); color: var(--ink); }
.sideRow[data-active] { background: var(--paper-deep); color: var(--ink); font-weight: 550; }
.sideAdd { display: flex; align-items: center; gap: 9px; height: 36px; margin: 4px 12px 0; padding: 0 10px; font-size: 13px; color: var(--ink-faint); border-radius: var(--radius-md); }
.sideAdd svg { width: 16px; height: 16px; }
.sideAdd:hover { color: var(--ink); background: var(--paper-soft); }

/* ── the masthead ──────────────────────────────────────────────── */
.canvas { display: flex; flex-direction: column; min-width: 0; background: var(--b-ground); }
.masthead {
  flex: none;
  background: var(--paper);
  border-bottom: 1px solid var(--hairline);
  padding: 22px 28px 0;
}
.mastTop { display: flex; align-items: flex-start; gap: 20px; }
.mastKicker {
  display: flex; align-items: baseline; gap: 12px;
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint);
  margin: 0 0 9px;
}
/* Identity did not disappear with the black bar — it moved onto the paper,
   at the head of the page it names, in the wordmark's own grammar. */
.mastWord {
  font-family: var(--font-sans);
  font-size: 15px; font-weight: 600; letter-spacing: -0.045em;
  text-transform: none; color: var(--ink);
  display: inline-flex; align-items: baseline;
  padding-right: 12px;
  border-right: 1px solid var(--hairline);
}
.mastWord::after {
  content: ""; width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent); margin-left: 1.5px;
}
.mastName {
  font-size: 34px; font-weight: 600; letter-spacing: -0.034em; line-height: 1.04;
  margin: 0;
}
.mastLine { margin: 9px 0 0; font-size: 14px; color: var(--ink-soft); letter-spacing: -0.008em; }
.mastLine .over { color: var(--status-blocked); }
.mastLine b { font-weight: 550; color: var(--ink); }
.mastActions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex: none; }
.ghost {
  display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 10px;
  border-radius: var(--radius-md);
  font-size: 13px; color: var(--ink-soft); letter-spacing: -0.008em;
  white-space: nowrap;
}
.ghost svg { width: 16px; height: 16px; color: var(--ink-faint); }
.ghost:hover { background: var(--paper-soft); color: var(--ink); }
.ghost em { font-style: normal; font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.ghost kbd {
  font-family: var(--font-mono); font-size: 10px;
  border: 1px solid var(--hairline); border-radius: var(--radius-sm);
  padding: 2px 4px; color: var(--ink-faint);
}
.primary {
  display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 14px 0 11px;
  border-radius: var(--radius-md);
  background: var(--ink); color: var(--paper);
  font-size: 13px; font-weight: 550; letter-spacing: -0.008em;
  margin-left: 4px;
}
.primary svg { width: 15px; height: 15px; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--ink); color: var(--paper);
  display: grid; place-items: center;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em;
  margin-left: 8px; flex: none;
}
.mastFoot { display: flex; align-items: center; margin-top: 18px; }
.seg { display: inline-flex; gap: 2px; }
.segItem {
  display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 12px;
  font-size: 13.5px; color: var(--ink-faint); letter-spacing: -0.01em;
  position: relative;
}
.segItem svg { width: 16px; height: 16px; }
.segItem:hover { color: var(--ink-soft); }
.segItem[data-active] { color: var(--ink); font-weight: 550; }
.segItem[data-active]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink);
}
.mastTools { margin-left: auto; display: flex; gap: 2px; }

/* ── board ─────────────────────────────────────────────────────── */
.board {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 20px;
  padding: 26px 28px 0;
  overflow: auto;
}
.lane { min-width: 0; display: flex; flex-direction: column; }
.laneHead { flex: none; padding: 0 2px 12px; }
.laneRule { height: 2px; border-radius: 2px; background: var(--ink-ghost); margin-bottom: 11px; }
.lane[data-tone="flight"] .laneRule { background: var(--status-flight); }
.lane[data-tone="done"] .laneRule { background: var(--x-status-done); }
.laneTop { display: flex; align-items: baseline; gap: 8px; }
.laneName { font-size: 13.5px; font-weight: 600; letter-spacing: -0.014em; }
.laneCount { margin-left: auto; font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.laneNote { margin: 4px 0 0; font-size: 12px; color: var(--ink-faint); letter-spacing: -0.004em; }
.laneBody { overflow: auto; padding-bottom: 26px; display: grid; gap: 10px; align-content: start; }

.card {
  background: var(--paper);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  padding: 13px 14px 12px;
  display: grid; gap: 6px;
  position: relative;
  transition: border-color var(--motion-fast) var(--ease-out);
}
.card:hover { border-color: rgba(17,17,17,0.2); }
.cardTop { display: flex; align-items: flex-start; gap: 10px; }
.tick {
  width: 16px; height: 16px; border-radius: 50%; flex: none;
  box-shadow: inset 0 0 0 1.4px var(--ink-ghost);
  margin-top: 1.5px;
  display: grid; place-items: center; color: transparent;
}
.tick svg { width: 10px; height: 10px; stroke-width: 2.4; }
.card:hover .tick { box-shadow: inset 0 0 0 1.4px var(--ink-faint); }
.cardTitle {
  font-size: 14px; line-height: 1.36; font-weight: 550;
  letter-spacing: -0.015em; min-width: 0;
}
.cardNote {
  font-size: 12.5px; line-height: 1.45; color: var(--ink-faint);
  margin: 0; letter-spacing: -0.004em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.cardMeta {
  display: flex; align-items: center; flex-wrap: wrap; gap: 3px 10px;
  font-size: 11.5px; color: var(--ink-faint); letter-spacing: -0.003em;
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
}
.cardMeta .hi { color: var(--ink-soft); font-weight: 500; }
.cardMeta .due-overdue { color: var(--status-blocked); }
.cardMeta .due-today { color: #a16207; }
.cardMeta .cm { display: inline-flex; align-items: center; gap: 4px; }
.cardMeta .cm svg { width: 12px; height: 12px; }
.tag {
  display: inline-flex; align-items: center;
  height: 20px; padding: 0 7px;
  border-radius: var(--radius-sm);
  background: var(--paper-deep);
  font-size: 11px; color: var(--ink-soft); letter-spacing: -0.004em;
}
.cardDots {
  position: absolute; top: 8px; right: 8px;
  width: 26px; height: 26px; border-radius: var(--radius-sm);
  display: grid; place-items: center; color: var(--ink-faint);
  opacity: 0; transition: opacity var(--motion-instant) var(--ease-out);
}
.cardDots svg { width: 16px; height: 16px; }
.card:hover .cardDots { opacity: 1; }

/* The one earned indigo: the thing that happens next. */
.card[data-next] { border-color: var(--accent-soft); }
.card[data-next]::before {
  content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px;
  width: 2px; border-radius: 0 2px 2px 0; background: var(--accent);
}
.nextKicker {
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
  margin: 0;
}

.card[data-done] { background: var(--paper-soft); border-color: transparent; }
.card[data-done] .cardTitle { color: var(--ink-faint); font-weight: 450; }
.card[data-done] .tick { background: var(--x-status-done); box-shadow: none; color: #fff; }
.card[data-done] .tag { background: rgba(17,17,17,0.045); }

/* No dashed panel. Board pass 3 killed it and it deserved to die: an
   empty lane is a fact, not a slot waiting to be filled. */
.laneEmpty {
  padding: 4px 2px 2px;
  font-size: 12.5px; color: var(--ink-faint);
}
.laneAdd {
  display: flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 12px;
  border-radius: var(--radius-md);
  font-size: 13px; color: var(--ink-faint);
}
.laneAdd svg { width: 15px; height: 15px; }
.laneAdd:hover { color: var(--ink); background: rgba(17,17,17,0.035); }

/* ── planning drawer ───────────────────────────────────────────── */
/* Planning floats. Five columns with real air plus a 396px panel do not
   both fit under about 1620px, and this direction's whole argument is
   that the work gets the air. Above that width it docks in flow. */
.drawer {
  width: 396px; flex: none;
  background: var(--paper);
  border-left: 1px solid var(--hairline);
  display: flex; flex-direction: column;
  position: absolute; right: 0; top: 0; bottom: 0;
  box-shadow: var(--shadow-modal);
  z-index: 6;
}
@media (min-width: 1620px) {
  .drawer { position: static; box-shadow: none; }
}
.drawerHead { padding: 24px 24px 18px; }
.drawerTop { display: flex; align-items: baseline; }
.drawerKicker { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }
.drawerHead h2 { margin: 10px 0 3px; font-size: 21px; font-weight: 600; letter-spacing: -0.028em; }
.drawerLine { margin: 0; font-size: 13px; color: var(--ink-faint); }
.axis { margin: 22px 0 8px; height: 2px; background: var(--hairline); position: relative; }
.axis i { position: absolute; inset: 0 auto 0 0; width: 11.3%; background: var(--ink); }
.axis b { position: absolute; left: 11.3%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--paper); }
.axisEnds { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.drawerSummary { margin: 14px 0 0; font-size: 13.5px; color: var(--ink-soft); }
.drawerTabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--hairline); }
.drawerTab { height: 38px; padding: 0 4px; margin-right: 14px; font-size: 13.5px; color: var(--ink-faint); position: relative; letter-spacing: -0.01em; }
.drawerTab[data-active] { color: var(--ink); font-weight: 550; }
.drawerTab[data-active]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
.drawerTab em { font-style: normal; font-size: 11.5px; margin-left: 6px; color: var(--ink-faint); }
.drawerHelp { padding: 16px 24px 10px; margin: 0; font-size: 12.5px; color: var(--ink-faint); line-height: 1.5; }
.drawerHelp a { color: var(--accent); text-decoration: none; float: right; margin-left: 12px; }
.drawerRows { overflow: auto; padding: 0 16px; display: grid; gap: 6px; align-content: start; }
.drawerRow {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 10px;
  border-radius: var(--radius-md);
  font-size: 13px; line-height: 1.4; letter-spacing: -0.008em;
}
.drawerRow:hover { background: var(--paper-soft); }
.box { width: 15px; height: 15px; border-radius: 4px; box-shadow: inset 0 0 0 1.4px var(--ink-ghost); flex: none; }
.drawerRow button { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-soft); }
.drawerRow button svg { width: 14px; height: 14px; color: var(--ink-faint); }
.drawerAdd { margin: 8px 24px 20px; display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-faint); }
.drawerAdd svg { width: 15px; height: 15px; }

/* ── loading ───────────────────────────────────────────────────── */
.loadMast { background: var(--paper); border-bottom: 1px solid var(--hairline); padding: 22px 28px 0; }
.sk { display: block; background: var(--paper-deep); border-radius: 4px; animation: bBreathe 1.7s var(--ease-in-out) infinite; }
@keyframes bBreathe { 0%,100% { opacity: 1 } 50% { opacity: .5 } }
.loadBoard { flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 20px; padding: 26px 28px 0; }
.loadCard { background: var(--paper); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 13px 14px; display: grid; gap: 8px; }
.loadSay { padding: 0 28px 22px; font-size: 13px; color: var(--ink-faint); }

/* ── responsive ────────────────────────────────────────────────── */
@media (max-width: 1180px) {
  /* Below the point where five columns can still hold a readable card, the
     board stops squeezing and starts scrolling. */
  .board, .loadBoard { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(248px, 1fr); }
  .mastName { font-size: 29px; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto; }
  .rail {
    grid-row: 2; flex-direction: row; justify-content: space-around; align-items: center;
    padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
    background: var(--b-chrome);
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .railWord, .railDivider, .railSpacer { display: none; }
  .railGroup { display: flex; flex: 1; justify-content: space-around; }
  .railTile[data-tip]::after { left: 50%; top: auto; bottom: calc(100% + 8px); transform: translateX(-50%); }
  .railTile:hover::after { transform: translateX(-50%); }
  .canvas { grid-row: 1; min-height: 0; }

  .masthead { padding: 16px 18px 0; }
  .mastTop { flex-direction: column; gap: 0; }
  .mastName { font-size: 25px; letter-spacing: -0.03em; }
  .mastLine { font-size: 13px; }
  .mastActions { margin: 14px 0 0; width: 100%; }
  .mastActions .primary { margin-left: auto; }
  .mastFoot { margin-top: 12px; overflow-x: auto; }
  .mastTools { display: none; }
  .board {
    padding: 18px 18px 0;
    gap: 14px;
    grid-auto-columns: 84%;
    scroll-snap-type: x mandatory;
    /* Without this the snap lands lane one on the scrollport edge and
       eats the board's own left margin. */
    scroll-padding-left: 18px;
  }
  .lane { scroll-snap-align: start; }
  /* Icon-only actions on a phone, so the account avatar is never the
     thing that falls off the end of the row. */
  .mastActions .ghost span, .mastActions .ghost kbd, .mastActions .ghost em { display: none; }
  .mastActions .ghost { padding: 0 8px; }
  .mastActions .primary span { display: inline; }
  .railTile[data-tip="Inbox"], .railTile[data-tip="Help and settings"] { display: none; }
  .drawer { width: 100%; }
  .loadBoard { grid-auto-columns: 84%; padding: 18px; gap: 14px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="./data.js"></script>
<script src="./icons.js"></script>
<script>
const state = new URLSearchParams(location.search).get("state") || "board";
const B = window.BOARD;
const I = window.ICON;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function tasksFor(lane) {
  if (state === "empty") return [];
  let all = B.tasks.slice();
  if (state === "dense") all = all.concat(window.DENSE_EXTRA.map((t, i) => ({ ...t, id: "x" + i })));
  return all.filter((t) => t.lane === lane);
}

function rail() {
  const tile = (key, label, active) =>
    `<a class="railTile" data-tip="${label}"${active ? " data-active" : ""}>${I[key]}</a>`;
  return `
  <nav class="rail" aria-label="Signal Studio">
    ${tile("home", "Home", false)}
    <span class="railDivider"></span>
    <div class="railGroup">
      ${B.rail.products.map((p) => tile(p.key, p.label, p.active)).join("")}
      ${tile("more", "More products", false)}
    </div>
    <span class="railDivider"></span>
    ${tile("inbox", "Inbox", false)}
    <span class="railSpacer"></span>
    ${tile("help", "Help and settings", false)}
  </nav>`;
}

function sidebar() {
  return `
  <aside class="side">
    <div class="sideHead"><span class="sideEyebrow">Places</span><button>${I.panel}</button></div>
    <div class="sideList">
      ${B.sidebar.places.map((p) => `<a class="sideRow">${I[p.icon]}<span>${p.label}</span>${p.count ? `<em>${p.count}</em>` : ""}</a>`).join("")}
    </div>
    <div class="sideHead" style="padding-top:28px"><span class="sideEyebrow">${esc(B.sidebar.folder)}</span></div>
    <div class="sideList">
      ${B.sidebar.projects.map((p) => `<a class="sideRow"${p.active ? " data-active" : ""}>${I.board}<span>${esc(p.label)}</span><em>${p.count}</em></a>`).join("")}
    </div>
    <button class="sideAdd">${I.plus}<span>Add project</span></button>
  </aside>`;
}

function masthead() {
  const p = B.progress;
  const total = state === "empty" ? 0 : state === "dense" ? p.total + window.DENSE_EXTRA.length : p.total;
  const done = state === "empty" ? 0 : p.done;
  const sentence = state === "empty"
    ? "Nothing on the board yet. Add the first thing you have to do."
    : `<b>${done} of ${total}</b> done · <span class="over">${p.overdue} overdue</span> · day ${p.day} of ${p.of}, ${p.left} days left`;
  const icons = { Board: I.board, List: I.list, Schedule: I.schedule, Calendar: I.calendar };
  return `
  <header class="masthead">
    <div class="mastTop">
      <div style="min-width:0">
        <p class="mastKicker"><span class="mastWord">tasks</span>${esc(B.season)} · ${esc(B.period)}</p>
        <h1 class="mastName">${esc(B.workspace)}</h1>
        <p class="mastLine">${sentence}</p>
      </div>
      <div class="mastActions">
        <button class="ghost">${I.board}<span>Projects</span></button>
        <button class="ghost">${I.search}<span>Search</span><kbd>⌘K</kbd></button>
        <button class="ghost">${I.share}<span>Share</span></button>
        <button class="ghost">${I.planning}<span>Planning</span>${state === "empty" ? "" : `<em>${p.undated}</em>`}</button>
        <button class="ghost" aria-label="More">${I.dots}</button>
        <button class="primary">${I.plus}<span>Add task</span></button>
        <span class="avatar" title="${esc(B.operator.role)}">${B.operator.initials}</span>
      </div>
    </div>
    <div class="mastFoot">
      <nav class="seg">
        ${B.views.map((v) => `<a class="segItem"${v === "Board" ? " data-active" : ""}>${icons[v]}<span>${v}</span></a>`).join("")}
      </nav>
      <div class="mastTools">
        <button class="ghost">${I.filter}<span>Filter</span></button>
        <button class="ghost">${I.sort}<span>Sort</span></button>
        <button class="ghost">${I.display}<span>Display</span></button>
      </div>
    </div>
  </header>`;
}

function card(t) {
  const done = t.lane === "done";
  const next = Boolean(t.milestone);
  const meta = [];
  if (t.priority && !done) meta.push(`<span class="hi">${esc(t.priority)}</span>`);
  if (t.due) meta.push(`<span class="due-${t.dueTone}">${esc(t.due)}</span>`);
  if (t.contact) meta.push(`<span>${esc(t.contact)}</span>`);
  if (t.comments) meta.push(`<span class="cm">${I.comment}${t.comments}</span>`);
  return `
  <article class="card"${done ? " data-done" : ""}${next ? " data-next" : ""}>
    ${next ? `<p class="nextKicker">Next milestone · ${esc(t.milestone.replace("Milestone due ", ""))}</p>` : ""}
    <div class="cardTop">
      <span class="tick">${I.check}</span>
      <p class="cardTitle">${esc(t.title)}</p>
    </div>
    ${t.note && !done ? `<p class="cardNote">${esc(t.note)}</p>` : ""}
    <div class="cardMeta">
      ${t.tag ? `<span class="tag">${esc(t.tag)}</span>` : ""}
      ${meta.join("")}
    </div>
    ${t.quiet ? `<p class="cardMeta" style="color:#a16207">${esc(t.quiet)}</p>` : ""}
    <button class="cardDots" aria-label="Task actions">${I.dots}</button>
  </article>`;
}

function board() {
  return `
  <div class="board">
    ${B.columns.map((c) => {
      const rows = tasksFor(c.id);
      return `
      <section class="lane" data-tone="${c.tone}">
        <div class="laneHead">
          <div class="laneRule"></div>
          <div class="laneTop"><span class="laneName">${esc(c.name)}</span><span class="laneCount">${rows.length}</span></div>
          <p class="laneNote">${esc(c.note)}</p>
        </div>
        <div class="laneBody">
          ${rows.length ? rows.map(card).join("") : `<p class="laneEmpty">${esc(c.empty || "Nothing here yet")}</p>`}
          <button class="laneAdd">${I.plus}<span>Add task</span></button>
        </div>
      </section>`;
    }).join("")}
  </div>`;
}

function drawer() {
  const p = B.planning;
  return `
  <aside class="drawer">
    <div class="drawerHead">
      <div class="drawerTop"><span class="drawerKicker">${esc(p.title)}</span><button class="ghost" style="margin-left:auto" aria-label="Close">${I.close}</button></div>
      <h2>${esc(p.project)}</h2>
      <p class="drawerLine">${esc(p.line)}</p>
      <div class="axis"><i></i><b></b></div>
      <div class="axisEnds"><span>6 Jul</span><span>10 Oct</span></div>
      <p class="drawerSummary">${esc(p.summary)}</p>
    </div>
    <div class="drawerTabs">
      <button class="drawerTab" data-active>Unscheduled<em>${p.unscheduled.length}</em></button>
      <button class="drawerTab">Milestones<em>${p.milestones.length}</em></button>
    </div>
    <p class="drawerHelp"><a>Select all</a>${esc(p.help)}</p>
    <div class="drawerRows">
      ${p.unscheduled.map((t) => `<div class="drawerRow"><span class="box"></span><span>${esc(t)}</span><button>Schedule ${I.chevron}</button></div>`).join("")}
    </div>
    <button class="drawerAdd">${I.plus}<span>Add unscheduled task</span></button>
  </aside>`;
}

function loading() {
  return `
  <main class="canvas">
    <div class="loadMast">
      <span class="sk" style="width:190px;height:10px"></span>
      <span class="sk" style="width:340px;height:30px;margin-top:12px"></span>
      <span class="sk" style="width:250px;height:12px;margin-top:12px"></span>
      <div style="display:flex;gap:20px;margin-top:20px;padding-bottom:12px">
        ${["58px", "44px", "68px", "70px"].map((w) => `<span class="sk" style="width:${w};height:12px"></span>`).join("")}
      </div>
    </div>
    <div class="loadBoard">
      ${B.columns.map((c, i) => `
        <div>
          <span class="sk" style="width:100%;height:2px;background:var(--ink-ghost)"></span>
          <span class="sk" style="width:${[54, 76, 52, 58, 40][i]}px;height:11px;margin-top:11px"></span>
          <span class="sk" style="width:${[128, 96, 140, 158, 122][i]}px;height:9px;margin-top:8px"></span>
          <div style="display:grid;gap:10px;margin-top:14px">
            ${[0, 1, 2].slice(0, [3, 3, 2, 0, 3][i]).map(() => `
              <div class="loadCard">
                <span class="sk" style="width:88%;height:12px"></span>
                <span class="sk" style="width:64%;height:10px"></span>
                <span class="sk" style="width:38%;height:9px"></span>
              </div>`).join("")}
          </div>
        </div>`).join("")}
    </div>
    <p class="loadSay">Opening The Orchard, events</p>
  </main>`;
}

const canvas = state === "loading" ? loading() : `<main class="canvas">${masthead()}${board()}</main>`;

document.getElementById("root").innerHTML = `
  <div class="shell" style="${state === "planning" && window.innerWidth >= 1620 ? "grid-template-columns: var(--b-rail) minmax(0,1fr) auto;" : ""}">
    ${rail()}
    ${canvas}
    ${state === "planning" ? drawer() : ""}
  </div>`;
</script>
</body>
</html>
