<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Signal Chat Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap">
<style>
/* Layout: the real app shell sits behind one chat panel that docks to the right edge.
   Phone: a sheet sized to the visible area. Tablet and laptop: one stacked column whose three
   levels slide. Large screens: list, conversation and thread as side-by-side panes, and the page
   shifts left so nothing hides. Dark-first, v3 tokens, Geist 400/600, one type scale. */
:root {
  color-scheme: dark;
  --shell: #121212; --canvas: #1c1c1c; --surface: #1f1f1f; --raised: #2a2a2a; --sunken: #181818;
  --hover: rgba(255,255,255,.055); --selected: rgba(255,255,255,.085);
  --border: #2c2c2c; --border-strong: #3b3b3b;
  --text: #ececec; --text-2: #b8b8b8; --text-3: #9a9a9a;
  --accent: #8b87f8; --accent-hover: #a3a0fa; --accent-soft: rgba(139,135,248,.16); --accent-text: #aaa7f8; --on-accent: #0e0e12;
  --signal: #6860ff; --badge: #ececec; --ink: #17171a; --ink-edge: rgba(255,255,255,.08);
  --danger: #f0646a; --danger-text: #f48f93; --warning: #e8b64c; --success: #4cc38a; --presence: #3fb37f;

  --scrim: rgba(0,0,0,.5);
  --shadow-pop: 0 24px 64px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3), 0 0 0 1px var(--border-strong);
  --tip-bg: #ededef; --tip-fg: #141414; --tip-action: #4338ca; --success-text: #4cc38a; --exit: 220ms; --avatar-edge: transparent;
  --tone-olive-bg: #393d2c; --tone-olive-fg: #c2c98a; --proj-1: #3b8fd4; --proj-2: #7aa32a; --on-badge: #141414;
  --tone-slate-bg: #333a40; --tone-slate-fg: #adbccb; --tone-teal-bg: #2b3f3c; --tone-teal-fg: #6ecabc;
  --tone-green-bg: #304035; --tone-green-fg: #86cc9c; --tone-stone-bg: #3a3833; --tone-stone-fg: #c9c0b0;
  --tone-rose-bg: #47363b; --tone-rose-fg: #ec9eb4; --tone-clay-bg: #4a3a33; --tone-clay-fg: #eaab8e;
  --side-bg: #141414; --side-text: #b8b8b8; --side-strong: #ececec; --side-hover: rgba(255,255,255,.06); --side-border: #262626;
  --font: "Geist", -apple-system, system-ui, "Segoe UI", sans-serif;
  --t-meta: 11.5px; --t-sub: 12.5px; --t-body: 13.5px; --t-title: 15px;
  --arrival: 480ms; --ack: 140ms; --settle: 1150ms;
  --glide: cubic-bezier(.16,1,.3,1); --soft: cubic-bezier(.32,.72,0,1); --snap: cubic-bezier(.2,.9,.2,1.2);
  --r: 8px; --r-lg: 12px; --r-xl: 16px;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --shell: #ffffff; --canvas: #ffffff; --surface: #ffffff; --raised: #ffffff; --sunken: #f5f5f5;
  --hover: rgba(20,20,20,.045); --selected: rgba(20,20,20,.065); --border: #e5e5e5; --border-strong: #cfcfcf;
  --text: #141414; --text-2: #474747; --text-3: #636363;
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: rgba(79,70,229,.09); --accent-text: #4338ca; --on-accent: #ffffff;
  --ink-edge: transparent; --danger: #cd2b31; --danger-text: #ac272c; --warning: #b87d14; --success: #2f9e6a; --presence: #2f9e6a;
  --scrim: rgba(10,10,12,.3);
  --shadow-pop: 0 24px 64px rgba(20,20,20,.14), 0 2px 8px rgba(20,20,20,.06), 0 0 0 1px var(--border-strong);
  --tip-bg: #141414; --tip-fg: #ffffff; --tip-action: #a5a1ff; --success-text: #1f7a50; --avatar-edge: rgba(20,20,20,.1);
  --tone-olive-bg: #f0f1e4; --tone-olive-fg: #4d5a12; --proj-1: #0369a1; --proj-2: #4d7c0f; --badge: #141414; --on-badge: #ffffff;
  --tone-slate-bg: #eceff2; --tone-slate-fg: #475569; --tone-teal-bg: #e7f1f0; --tone-teal-fg: #0f766e;
  --tone-green-bg: #e8f0eb; --tone-green-fg: #166534; --tone-stone-bg: #f1efea; --tone-stone-fg: #57534e;
  --tone-rose-bg: #f8e8ef; --tone-rose-fg: #be185d; --tone-clay-bg: #f6ebe5; --tone-clay-fg: #9a3412;
} }
:root[data-theme="light"] {
  color-scheme: light;
  --shell: #ffffff; --canvas: #ffffff; --surface: #ffffff; --raised: #ffffff; --sunken: #f5f5f5;
  --hover: rgba(20,20,20,.045); --selected: rgba(20,20,20,.065); --border: #e5e5e5; --border-strong: #cfcfcf;
  --text: #141414; --text-2: #474747; --text-3: #636363;
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: rgba(79,70,229,.09); --accent-text: #4338ca; --on-accent: #ffffff;
  --ink-edge: transparent; --danger: #cd2b31; --danger-text: #ac272c; --warning: #b87d14; --success: #2f9e6a; --presence: #2f9e6a;
  --scrim: rgba(10,10,12,.3);
  --shadow-pop: 0 24px 64px rgba(20,20,20,.14), 0 2px 8px rgba(20,20,20,.06), 0 0 0 1px var(--border-strong);
  --tip-bg: #141414; --tip-fg: #ffffff; --tip-action: #a5a1ff; --success-text: #1f7a50; --avatar-edge: rgba(20,20,20,.1);
  --tone-olive-bg: #f0f1e4; --tone-olive-fg: #4d5a12; --proj-1: #0369a1; --proj-2: #4d7c0f; --badge: #141414; --on-badge: #ffffff;
  --tone-slate-bg: #eceff2; --tone-slate-fg: #475569; --tone-teal-bg: #e7f1f0; --tone-teal-fg: #0f766e;
  --tone-green-bg: #e8f0eb; --tone-green-fg: #166534; --tone-stone-bg: #f1efea; --tone-stone-fg: #57534e;
  --tone-rose-bg: #f8e8ef; --tone-rose-fg: #be185d; --tone-clay-bg: #f6ebe5; --tone-clay-fg: #9a3412;
}
html, body, #root { height: 100%; }
body { margin: 0; background: var(--shell); color: var(--text); font: 400 var(--t-body)/1.4 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { flex: none; display: block; }
b, strong { font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; grid-template-rows: minmax(0, 1fr); height: 100%; transition: grid-template-columns var(--arrival) var(--glide); }
.side { background: var(--side-bg); color: var(--side-text); display: flex; flex-direction: column; gap: 18px; padding: 14px 10px; border-right: 1px solid var(--side-border); min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; color: var(--side-strong); font-weight: 600; font-size: var(--t-title); letter-spacing: -.01em; }
.side-search { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--side-border); border-radius: var(--r); color: #9a9a9a; font-size: var(--t-sub); }
.side-search kbd { margin-left: auto; font: 400 var(--t-meta) var(--font); font-variant-numeric: tabular-nums; border: 1px solid var(--side-border); border-radius: 4px; padding: 0 5px; }
.side nav { display: flex; flex-direction: column; gap: 1px; }
.side h3 { margin: 0 0 4px; padding: 0 10px; font-size: var(--t-meta); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #9a9a9a; }
.nav { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--r); background: none; border: 0; color: var(--side-text); text-align: left; width: 100%; }
.nav:hover { background: var(--side-hover); }
.nav[aria-current] { background: rgba(255,255,255,.08); color: var(--side-strong); }
.nav .tile { width: 14px; height: 14px; border-radius: 4px; }
.nav .count { margin-left: auto; font: 600 var(--t-meta)/18px var(--font); min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--badge); color: var(--on-badge); text-align: center; font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--shell); transition: margin-right var(--arrival) var(--glide); }
:root[data-chat="closed"] .main { transition: margin-right var(--exit) var(--soft); }
.madeby { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; font-size: var(--t-meta); font-weight: 400; color: var(--text-3); vertical-align: 1px; }
.top { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--border); }
.crumb { color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb b { color: var(--text); font-weight: 600; }
.crumb button { border: 0; background: none; color: var(--text-3); padding: 0; }
.crumb button:hover { color: var(--text); }
.grow { flex: 1; min-width: 0; }
.btn-new { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: var(--r); border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: var(--t-sub); white-space: nowrap; }
.page { padding: 32px 40px; overflow: auto; flex: 1; }
.page-in { max-width: 860px; }
.page h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; text-wrap: balance; }
.chip { font-size: var(--t-sub); font-weight: 400; color: var(--text-2); border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px 10px; letter-spacing: 0; white-space: nowrap; }
.sum { margin: 8px 0 28px; color: var(--text-2); }
.sum b { color: var(--text); font-weight: 600; } .sum .late { color: var(--danger-text); }
.page h2 { margin: 24px 0 6px; font-size: var(--t-body); font-weight: 600; display: flex; gap: 8px; }
.page h2 span { color: var(--text-3); font-weight: 400; }
.trow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--border); background: none; text-align: left; }
.trow:hover { background: var(--hover); }
.trow .t { font-weight: 600; }
.trow .m { font-size: var(--t-sub); color: var(--text-3); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.trow .m i { width: 7px; height: 7px; border-radius: 2px; background: var(--proj-1); }
.trow .d { margin-left: auto; font-size: var(--t-sub); color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.trow .d.late { color: var(--danger-text); }
.tdetail .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 24px; }
.tdetail p { color: var(--text-2); line-height: 1.55; max-width: 62ch; }
.check { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.check .bx { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--text-3); display: grid; place-items: center; color: transparent; }
.check.done .bx { background: var(--success); border-color: var(--success); color: #0e0e12; }
.check.done span { color: var(--text-3); text-decoration: line-through; }
.thread-cta { margin-top: 28px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--r-lg); color: var(--text-2); }
.b1 { height: 32px; padding: 0 12px; border-radius: var(--r); border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: var(--t-sub); transition: background var(--ack); white-space: nowrap; }
.b1:hover { background: var(--accent-hover); }
.b1:disabled { opacity: .45; cursor: default; }
.b1.danger { background: var(--danger); color: #fff; }
.b2 { height: 32px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--border-strong); background: none; color: var(--text-2); font-size: var(--t-sub); white-space: nowrap; transition: background var(--ack), color var(--ack); }
.b2:hover { background: var(--hover); color: var(--text); }
.linkbtn { position: relative; border: 0; background: none; color: var(--text); font-size: var(--t-sub); padding: 0; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 2px; }

/* ---------- launcher, pills, peek ---------- */
.launcher { position: fixed; right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--ink); color: #ececec; display: grid; place-items: center; box-shadow: 0 10px 28px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.1); z-index: 30; transition: transform var(--ack) var(--glide); animation: popin var(--arrival) var(--glide) 120ms both; }
.launcher:hover { transform: translateY(-1px); } .launcher:active { transform: scale(.95); }
.badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: var(--badge); color: var(--on-badge); font: 600 var(--t-meta)/20px var(--font); text-align: center; box-shadow: 0 0 0 2px var(--shell); font-variant-numeric: tabular-nums; animation: snapin 260ms var(--snap); }
@keyframes snapin { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.badge, .cnt, .raildot { animation-duration: var(--ack) !important; }
@keyframes popin { from { transform: scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
.launcher .ripple { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--text-3); pointer-events: none; animation: ripple var(--settle) var(--glide) forwards; }
@keyframes ripple { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.55); } }
.pills { position: fixed; right: calc(80px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; z-index: 29; flex-direction: row-reverse; }
.pill { height: 44px; width: 220px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 8px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-pop); animation: arrive var(--arrival) var(--glide); }
.pill > button:first-child { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; height: 100%; }
.pill .nm { font-weight: 600; font-size: var(--t-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.pill .cnt { min-width: 18px; height: 18px; border-radius: 9px; background: var(--badge); color: var(--on-badge); font: 600 var(--t-meta)/18px var(--font); text-align: center; padding: 0 5px; }
.peek { position: fixed; right: calc(80px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 300px; max-width: calc(100vw - 112px); display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px 12px 12px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-pop); border: 0; text-align: left; z-index: 31; animation: peekin var(--arrival) var(--glide); }
.peek.out { animation: peekout 220ms var(--soft) forwards; }
@keyframes peekin { from { opacity: 0; transform: translate(10px, 6px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes peekout { to { opacity: 0; transform: translate(8px, 4px) scale(.98); } }
.peek .who { font-weight: 600; font-size: var(--t-sub); display: block; }
.peek .txt { color: var(--text-2); font-size: var(--t-sub); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- panel ---------- */
.panel { position: fixed; z-index: 28; background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-pop); overflow: hidden; display: flex; transform-origin: calc(100% - 24px) calc(100% + 24px); }
.panel.mode-wide { transition: width var(--arrival) var(--glide); }
.panel.dragging { transition: none; }
.panel.mode-phone { border-radius: 0; box-shadow: none; transform-origin: 50% 100%; }
.resize { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 8; }
.resize::after { content: ""; position: absolute; left: 2px; top: 50%; width: 3px; height: 36px; margin-top: -18px; border-radius: 2px; background: var(--border-strong); opacity: 0; transition: opacity var(--ack); }
.resize:hover::after, .resize.dragging::after, .resize:focus-visible::after { opacity: 1; }
.resize:focus-visible { outline: none; }
.panes { position: relative; display: flex; flex: 1; min-width: 0; }
.pane { position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--surface); }
.pane + .pane { border-left: 1px solid var(--border); }
.stack { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--surface); transition: transform var(--arrival) var(--soft); will-change: transform; }
.stack[data-dir="back"] .view { transition-duration: 300ms; }
.view[data-pos="right"] { transform: translateX(100%); }
.view[data-pos="left"] { transform: translateX(-24%); }
.view::after { content: ""; position: absolute; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--arrival) var(--soft); }
.view[data-pos="left"]::after { opacity: .6; }
.stack[data-dir="back"] .view::after { transition-duration: 300ms; }

.vhead { display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--border); flex: none; }
.vhead h2 { margin: 0; font-size: var(--t-title); font-weight: 600; letter-spacing: -.01em; }
.ibtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r); border: 0; background: none; color: var(--text-2); transition: background var(--ack), color var(--ack); position: relative; flex: none; }
.ibtn:hover { background: var(--hover); color: var(--text); }
.ibtn[aria-pressed="true"] { color: var(--accent-text); background: var(--accent-soft); }
[data-tip] { position: relative; }
@media (hover: hover) { [data-tip]:hover::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); right: 0; white-space: nowrap; font-size: var(--t-meta); font-weight: 400; padding: 4px 8px; border-radius: 6px; background: var(--tip-bg); color: var(--tip-fg); pointer-events: none; z-index: 20; animation: fadein 140ms 300ms both; } }
[data-tip-up]:hover::after { top: auto !important; bottom: calc(100% + 8px); right: auto !important; left: 50%; transform: translateX(-50%); }
.acts > button:last-child[data-tip-up]:hover::after { left: auto !important; right: 0 !important; transform: none; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeout { to { opacity: 0; } }
.who-head { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.who-head .nm { font-weight: 600; font-size: var(--t-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
.who-head .st { font-size: var(--t-meta); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: var(--t-meta); line-height: 16px; padding: 0 7px; border-radius: 9px; border: 1px solid var(--border-strong); color: var(--text-2); white-space: nowrap; font-weight: 400; }
.catch { height: 28px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px 0 6px; border-radius: 14px; border: 1px solid var(--border-strong); background: none; color: var(--text-2); font-size: var(--t-sub); white-space: nowrap; flex: none; transition: background var(--ack), color var(--ack); }
.catch:hover { background: var(--hover); color: var(--text); }

/* list */
.searchbar { margin: 10px 12px 6px; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: var(--r); background: var(--sunken); border: 1px solid var(--border); color: var(--text-3); flex: none; }
.searchbar:focus-within { border-color: var(--border-strong); }
.searchbar input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--text); }
.searchbar input::placeholder { color: var(--text-3); }
.filters { display: flex; gap: 4px; padding: 0 12px 6px; flex: none; }
.filters button { height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--border); background: none; color: var(--text-2); font-size: var(--t-sub); }
.filters button[aria-pressed="true"] { background: var(--selected); color: var(--text); border-color: var(--border-strong); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.sect { height: 28px; display: flex; align-items: flex-end; padding: 0 16px 4px; font-size: var(--t-meta); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.row { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; width: calc(100% - 16px); min-height: 48px; margin: 0 8px; padding: 6px 8px; border: 0; border-radius: var(--r-lg); background: none; text-align: left; transition: background var(--ack); --row-bg: var(--surface); }
.row:hover { background: var(--hover); }
.row[aria-current="true"] { background: var(--selected); }
.row .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }

mark { background: var(--selected); color: var(--text); border-radius: 3px; padding: 0 1px; box-shadow: inset 0 -2px 0 var(--border-strong); }

.welcome { margin: 12px; padding: 18px; border-radius: var(--r-lg); background: var(--sunken); border: 1px solid var(--border); }

/* stream */

@media (hover: hover) {

}
.msg:focus-within > .acts { opacity: 1; transform: none; pointer-events: auto; }
.acts button { height: 26px; min-width: 26px; padding: 0 6px; border: 0; border-radius: 6px; background: none; color: var(--text-2); display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-sub); }

.makechip { box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 26px; padding: 3px 4px 3px 8px; margin-top: 6px; border-radius: var(--r-lg); border: 1px dashed var(--border-strong); color: var(--text-2); font-size: var(--t-sub); transition: opacity var(--ack) var(--soft); }
/* its room exists from the start; it only fades */
.makechip.pending, .makechip.gone { opacity: 0; pointer-events: none; }
.makechip > button:first-child { border: 0; background: none; padding: 0; display: inline-flex; align-items: center; gap: 6px; color: inherit; min-width: 0; text-align: left; }

.card { margin-top: 6px; border: 1px solid var(--border-strong); border-radius: var(--r-lg); background: var(--sunken); overflow: hidden; max-width: 360px; }

.taskcard:hover { background: var(--hover); }

.file { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }

/* Ping */
.steps { margin-top: 4px; display: flex; flex-direction: column; gap: 3px; font-size: var(--t-sub); color: var(--text-3); }
.steps .st { display: flex; align-items: center; gap: 8px; animation: fadein 140ms both; }

.steps.folding { opacity: 0; transition: opacity var(--ack) var(--soft); }

.quote .qopen { position: relative; margin-left: auto; color: var(--text-2); font-weight: 600; }

.choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.choice { min-height: 30px; padding: 4px 12px; border-radius: var(--r-lg); border: 1px solid var(--border-strong); background: none; color: var(--text); font-size: var(--t-sub); display: inline-flex; align-items: center; gap: 6px; text-align: left; transition: background var(--ack), border-color var(--ack), opacity var(--ack); animation: fadein var(--ack) var(--soft) backwards; }
.choice small { color: var(--text-3); font-size: var(--t-meta); white-space: nowrap; }
.choice:hover:not(:disabled) { background: var(--hover); border-color: var(--text-3); }
.choice:disabled { cursor: default; opacity: .45; }
.choice.picked { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
.ctxlabel { margin-top: 10px; font-size: var(--t-meta); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.planres .card { margin-top: 8px; }
.card.fresh { animation: arrive var(--arrival) var(--glide) both; box-shadow: inset 2px 0 0 var(--success); }
.stepsum:hover { color: var(--text-2); }
.caret.out { opacity: 0; transition: opacity 140ms linear; }
.ctxbar { flex: none; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 0; border-bottom: 1px solid var(--border); background: var(--sunken); color: var(--text-2); font-size: var(--t-sub); text-align: left; width: 100%; }
.ctxbar:hover { color: var(--text); }
.ctxbar span:not(.cnt) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctxbar b { font-weight: 600; color: var(--text); }
.rail { width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 2px 0 24px; -webkit-mask-image: linear-gradient(#000 calc(100% - 24px), transparent); mask-image: linear-gradient(#000 calc(100% - 24px), transparent); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.railtip { position: absolute; left: 70px; transform: translateY(-50%); white-space: nowrap; font-size: var(--t-meta); padding: 4px 8px; border-radius: 6px; background: var(--tip-bg); color: var(--tip-fg); pointer-events: none; z-index: 20; animation: fadein 140ms 200ms both; }
.railbtn { position: relative; width: 44px; height: 44px; border-radius: 12px; border: 0; background: none; display: grid; place-items: center; color: var(--text-2); flex: none; }
.railbtn:hover { background: var(--hover); }
.railbtn[aria-current="true"] { background: var(--selected); box-shadow: inset 0 0 0 1px var(--border-strong); }
.raildot { position: absolute; top: 2px; right: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--badge); box-shadow: 0 0 0 2px var(--surface); animation: snapin 260ms var(--snap); }

.travel.solo { animation: soloPulse 900ms var(--soft) infinite; }
@keyframes soloPulse { 50% { transform: scale(1.6); opacity: .6; } }
.travel.tocaret { animation: none; transition: opacity var(--ack) var(--soft); }
.caret { display: inline-block; width: 2px; height: 15px; background: var(--text-2); vertical-align: -2px; margin-left: 1px; border-radius: 1px; animation: caretin 140ms var(--snap); }
@keyframes caretin { from { transform: scaleY(.3); } to { transform: none; } }
.travel { position: absolute; left: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--signal); z-index: 4; pointer-events: none; transition: top var(--move, 220ms) var(--glide), opacity 80ms linear; box-shadow: 0 0 0 3px rgba(104,96,255,.18); }
.plan { margin-top: 8px; border: 1px solid var(--border-strong); border-radius: var(--r-lg); background: var(--sunken); max-width: 420px; overflow: clip; }
.plan ol { transition: opacity var(--ack) var(--soft); }

.plan.undoing .box, .plan.undoing .box.done { animation: none; }

.plan .ph { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 4px; }

.plan li:nth-child(2) { animation-delay: 60ms; } .plan li:nth-child(3) { animation-delay: 120ms; } .plan li:nth-child(4) { animation-delay: 180ms; }

.fields { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; }

.box:disabled { cursor: default; }
.plan .pf { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); min-height: 32px; position: sticky; bottom: -10px; background: var(--sunken); z-index: 1; }

@media (max-width: 399px) { .plan .pf .grow.hint { visibility: hidden; } }
.answer { margin-top: 6px; display: flex; flex-direction: column; gap: 8px; }
.ans-group b { display: block; font-size: var(--t-meta); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 2px; }
.ans-group ul { margin: 0; padding-left: 16px; line-height: 1.5; }

/* the typing line keeps its height, so a reply replacing it never bounces the chat */
.typing { display: flex; align-items: center; gap: 8px; height: 20px; padding: 0 12px 0 50px; font-size: var(--t-meta); color: var(--text-3); flex: none; overflow: hidden; transition: opacity var(--ack) var(--soft); }
.typing.idle { opacity: 0; }
.dots { display: inline-flex; gap: 3px; }

        tasks[id] = { id, title: s.title, due: s.due, owner: s.owner, status: "todo", project: "The Orchard, events", about: `Made by Ping from ${s.source}.`, checks: [], made: true };
        s.taskId = id; if (s.srcMid) S.ping.made[s.srcMid] = { id, t: clock }; S.ping.topic = id; logPing("created", id, { key: p.key });
      } else if (s.kind === "update") {

        t[s.field] = s.to; if (s.field === "due") { t.late = false; if (t.status === "late") t.status = "todo"; }
        S.ping.topic = s.taskId; logPing("updated", s.taskId, { field: s.field, to: s.to });
      } else if (s.kind === "send" || s.kind === "nudge" || s.kind === "comment") {

        if (!cv && s.kind === "comment") { cv = { id: "t-" + s.taskId, kind: "task", task: s.taskId, unread: 0, messages: [] }; S.convos.push(cv); }

      } else if (s.kind === "archive") { tasks[s.taskId].archived = true; logPing("archived", s.taskId); }
      else if (s.kind === "check") { const t = tasks[s.taskId]; s.prevCheck = t.checks[s.idx][1]; t.checks[s.idx][1] = true; S.ping.topic = s.taskId; logPing("ticked", s.taskId, { item: t.checks[s.idx][0] }); }

    const created = p.steps.filter((s) => s.status === "done" && s.kind === "create");
    const one = p.steps.filter((s) => s.status === "done" && s.kind !== "link");
    const NOTE = { send: (s) => `Sent to ${toName(s.to)}`, nudge: (s) => `Nudged ${toName(s.to)}`, comment: () => "Comment added", archive: (s) => `Archived “${short(tasks[s.taskId].title, 36)}”`, check: (s) => `Ticked “${short(tasks[s.taskId].checks[s.idx][0], 36)}”` };
    p.doneNote = p.stop ? `Stopped after ${doneN} of ${order.length}` : one.length === 1 ? (NOTE[one[0].kind] ? NOTE[one[0].kind](one[0]) : created.length ? `Created “${short(one[0].title, 40)}”` : one[0].field === "status" ? `Marked “${short(one[0].title, 36)}” done` : `Saved the change to “${short(one[0].title, 30)}”`) : `${order.length} changes applied`;
    p.results = [...new Set(p.steps.filter((s) => s.status === "done" && s.taskId && s.kind !== "archive" && s.kind !== "nudge").map((s) => s.taskId))]; p.next = p.stop ? null : nextStep(p);
    p.origText = m.text;
    if (!p.stop && one.length === 1 && NOTE[one[0].kind]) { m.text = `Done. ${NOTE[one[0].kind](one[0])}.${one[0].kind === "archive" ? " Undo brings it back." : ""}`; m.shown = m.text.length; }
    // the words above the plan catch up with what happened

function undoPlan(m) {

      else if (s.kind === "update" && s.prev) { Object.assign(tasks[s.taskId], s.prev); logPing("undone", s.taskId); }
      else if (s.msgId) { const cv = byId(s.cid); if (cv) cv.messages = cv.messages.filter((x) => x.id !== s.msgId); if (s.kind === "nudge") delete S.ping.nudged[s.taskId]; logPing("undone", s.taskId || null, { title: s.title }); }

      else if (s.kind === "check") { tasks[s.taskId].checks[s.idx][1] = s.prevCheck; logPing("undone", s.taskId); }

}

/* ================= sending ================= */
function submit(key, c, threadRoot) {
  const text = (S.drafts[key] || "").trim(); const files = S.files[key] || []; const link = S.links[key];
  if (!text && !files.length && !link) return;
  if (S.editing && S.editing.key === key) {
    const [, m] = findMsg(S.editing.id); if (m) { m.text = text; m.edited = true; }
    S.editing = null; S.drafts[key] = ""; toast("Message updated"); commit(); return;
  }
  const list = threadRoot ? threadRoot.thread : c.messages; const t = tick();
  // a request to Ping inside a shared chat stays private to you, like Ping's reply
  // @Ping in a shared chat: the part before it goes to the chat, the part from @Ping on stays private
  const atPing = c.kind !== "ping" && S.viewer === "orla" ? text.search(/@ping\b/i) : -1; const toPing = atPing >= 0;
  const pub = toPing ? text.slice(0, atPing).trim() : text; const priv = toPing ? text.slice(atPing).trim() : "";
  // offline: the message stays here, marked not sent, with Retry
  if (pub || link) { const m = M(ME(), t, pub, { pending: !S.offline, own: true, failed: !!S.offline }); if (link) m.taskRef = link; list.push(m); if (!S.offline) later(240, () => { m.pending = false; }); }
  if (priv) list.push(M(ME(), t, priv, { own: true, privateTo: ME() }));
  files.forEach((f) => list.push(M(ME(), t, "", { file: f, own: true })));
  S.drafts[key] = ""; S.files[key] = []; delete S.links[key]; S.newPill = 0; S.scrollToEnd = Date.now(); S.askAt = Date.now();
  commit();
  if (c.kind === "ping") return pingRun(c, text);
  if (pub && !threadRoot && !S.offline) simulateReply(c);
  if (toPing) return pingRun(c, priv.replace(/@ping/gi, "").trim(), { target: list, threadRoot });
  if (threadRoot && c.id === "niamh" && !S.offline) { const k = "th-" + threadRoot.id; later(1200, () => { S.typing[k] = "niamh"; }); later(3000, () => { S.typing[k] = null; threadRoot.thread.push(M("niamh", tick(), "Sorted. They'll be there at 1pm.", { fresh: true })); }); }
}

  const late = open.filter((t) => t.late); const today = open.filter((t) => !t.late && dueOffset(t.due) === 0); const later = open.filter((t) => !t.late && dueOffset(t.due) > 0).sort((x, y) => dueOffset(x.due) - dueOffset(y.due));
  const doneN = 5 + Object.values(tasks).filter((t) => t.status === "done").length;
  return html`<div className="page-in"><h1>Good morning, Orla <span className="chip">Thursday 16 July</span></h1>
    <p className="sum"><b>${late.length + today.length}</b> things need you today${late.length ? html` · <span className="late"><b className="late">${late.length}</b> late</span>` : null} in The Orchard · <b>${doneN}</b> done this week</p>
    ${late.length ? html`<h2>Late <span>${late.length}</span></h2>${late.map(row)}` : null}<h2>Due today <span>${today.length}</span></h2>${today.map(row)}<h2>Coming up <span>${later.length}</span></h2>${later.map(row)}</div>`;
}
function TaskPage({ id }) {
  const t = tasks[id]; const c = S.convos.find((x) => x.kind === "task" && x.task === id);
  if (!t) return html`<div className="page-in"><h1>This task was removed</h1><p className="sum">It was undone. Nothing else changed.</p></div>`;
  return html`<div className="page-in tdetail"><h1>${t.title}</h1><div className="meta"><span className="chip" style=${{ display: "inline-flex", gap: 6, alignItems: "center" }}><${StatusGlyph} status=${t.status} size=${12} />${t.status === "prog" ? "In progress" : t.status === "late" ? "Late" : t.status === "done" ? "Done" : "To do"}</span><span className="chip">Due ${t.due}</span><span className="chip">${t.owner === "orla" ? "You" : people[t.owner].name}</span><span className="chip">${t.project}</span></div>
    <p>${t.about}</p>${t.checks.length ? html`<h2>Checklist</h2>` : null}${t.checks.map(([l, d], i) => html`<div key=${i} className=${"check" + (d ? " done" : "")}><span className="bx"><${Ic} n="tick" s=${11} w=${2.4} /></span><span>${l}</span></div>`)}
    <div className="thread-cta"><${Ic} n="reply" /><span className="grow">${c && c.messages.length ? `${c.messages.length} ${c.messages.length === 1 ? "comment" : "comments"} in this task's thread` : "No comments yet"}</span><button className="b2" type="button" onClick=${() => { openPanel(); let tc = c; if (!tc) { tc = { id: "t-" + id, kind: "task", task: id, unread: 0, messages: [] }; S.convos.push(tc); } openConvo(tc.id); }}>${c ? "Open thread" : "Comment"}</button></div></div>`;
}

function App() {
  useStore(); const v = useViewport();
  // landscape phones are phones: the same composer, menus and targets as portrait
  document.documentElement.classList.toggle("phone", modeFor(v.w) === "phone");
  // on a phone with chat open, the Prototype menu sits in the list's header so it stays reachable
  document.documentElement.classList.toggle("listopen", !!S.open && S.view === "list");
  // the keyboard is up when typing and the visible height has dropped well below the tallest seen at this width
  const tall = (S.tallest = S.tallestW === v.w ? Math.max(S.tallest || 0, v.h) : v.h); S.tallestW = v.w;
  const typing = document.activeElement && document.activeElement.tagName === "TEXTAREA";
  document.documentElement.classList.toggle("kb", !!typing && (v.vh < v.h - 100 || v.h < tall - 100));
  useEffect(() => {
    const k = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "j") { e.preventDefault(); S.open ? closePanel() : openPanel(); return; }
      if (e.altKey && e.key === "ArrowDown" && S.open) { const next = visibleConvos().filter((c) => c.unread && c.id !== S.convoId).sort((a, b) => lastT(b) - lastT(a))[0]; if (next) { e.preventDefault(); openConvo(next.id); } return; }
      if (e.key === "Escape" && S.open) {
        if (S.dictating && S.dictFinish) { S.dictFinish(false); return; }
        if (S.sheet) { S.sheet = null; commit(); return; } if (S.menu) { S.menu = null; S.confirmBlock = false; commit(); setTimeout(() => { const b = document.querySelector('.panel [aria-label="More"]'); b && b.focus(); }, 0); return; }
        if (S.confirmBlock) { S.confirmBlock = false; commit(); return; }
        // Esc empties the search before it closes anything
        if (S.view === "list" && S.query) { S.query = ""; commit(); return; }
        if (S.view !== "list") back(); else closePanel();
      }
    };
    addEventListener("keydown", k); return () => removeEventListener("keydown", k);
  }, []);
  const [protoOpen, setProtoOpen] = useState(false);
  const peek = S.peek; const [peekOut, setPeekOut] = useState(false); const peekPause = useRef(false);
  useEffect(() => { if (!peek) return; setPeekOut(false); let t; const run = () => { t = setTimeout(() => { if (peekPause.current) return run(); setPeekOut(true); setTimeout(() => { if (S.peek === peek) { S.peek = null; commit(); } }, 230); }, 6000); }; run(); return () => clearTimeout(t); }, [peek && peek.key]);
  const n = unreadTotal(); if (n > (S.lastN || 0)) S.badgeKey = (S.badgeKey || 0) + 1; S.lastN = n; const taskId = S.page.startsWith("task:") ? S.page.slice(5) : null;
  const sims = [["aoife", "Byrne Events just rang the bar. They want an answer on the sides by 12."], ["niamh", "Couple's florist is arriving at 9 on Saturday, not 10."], ["dara", "Tasting menu is drafted. I'll share it Monday."]];
  return html`<${Fragment}>
    <div className=${"app" + (sideW(v.w) === 56 ? " compact" : "")}>
      <aside className="side" aria-label="Sidebar">
        <div className="brand"><${BrandMark} size=${18} />Signal Studio</div>
        <div className="side-search"><${Ic} n="search" s=${14} />Search or jump to…<kbd>Ctrl K</kbd></div>
        ${S.viewer !== "orla" ? html`<nav aria-label="Main"><button className="nav" type="button" aria-current="page"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" aria-hidden="true"><path d="M2.75 7 8 2.75 13.25 7v6.25H2.75Z" /></svg>Your wedding</button></nav>` : html`<${Fragment}>
        <nav aria-label="Main"><button className="nav" type="button" aria-current=${S.page === "home" ? "page" : undefined} onClick=${() => { S.page = "home"; commit(); }}><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" aria-hidden="true"><path d="M2.75 7 8 2.75 13.25 7v6.25H2.75Z" /></svg>Home</button>
          <button className="nav" type="button"><${Ic} n="chart" />Analytics</button><button className="nav" type="button"><${Ic} n="file" />Files</button></nav>
        <nav aria-label="Workspace"><h3>Workspace</h3><button className="nav" type="button"><${Ic} n="folder" />Projects</button><button className="nav" type="button" aria-current=${taskId ? "page" : undefined}><${Ic} n="task" />Tasks</button><button className="nav" type="button"><${Ic} n="timeline" />Timeline</button></nav>
        <nav aria-label="Projects"><h3>Projects</h3><button className="nav" type="button"><span className="tile" style=${{ background: "var(--proj-1)" }}></span>The Orchard, events</button><button className="nav" type="button"><span className="tile" style=${{ background: "var(--proj-2)" }}></span>Spring open day</button></nav><//>`}
        <nav aria-label="Chat shortcut"><button className="nav" type="button" onClick=${() => (S.open ? closePanel() : openPanel())}><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" aria-hidden="true"><path d=${P.bubble} /></svg>Chat${n ? html`<span className="count">${n}</span>` : null}</button></nav>
        ${S.viewer === "orla" ? html`<div className="side-foot"><button className="nav" type="button"><${Ic} n="gear" />Settings</button></div>` : null}
      </aside>
      <main className="main" style=${{ marginRight: "var(--push, 0px)" }}>
        <div className="top"><span className="crumb">${S.viewer !== "orla" ? html`The Orchard / <b>Your wedding</b>` : taskId ? html`<button type="button" onClick=${() => { S.page = "home"; commit(); }}>Home</button> / The Orchard, events / <b>${tasks[taskId] ? tasks[taskId].title : "Task"}</b>` : html`Signal Studio / <b>Home</b>`}</span><span className="grow"></span>
          ${S.viewer === "orla" ? html`<button className="btn-new" type="button"><${Ic} n="plus" s=${14} w=${1.75} /><span>New task</span></button>` : null}<button className="acct" type="button" aria-label=${`Your account, ${people[S.viewer].name}`}><${Person} id=${S.viewer} size=${28} hidden=${true} /></button></div>
        <div className="page">${S.viewer !== "orla" ? html`<${GuestPage} />` : taskId ? html`<${TaskPage} id=${taskId} />` : html`<${HomePage} />`}</div>
      </main>
    </div>
    <div className="proto"><button type="button" aria-expanded=${protoOpen} onClick=${() => setProtoOpen(!protoOpen)}>Prototype<${Ic} n="chev" s=${12} /></button>
      ${protoOpen ? html`<div className="menu" role="menu">
        <button type="button" role="menuitem" onClick=${() => { setProtoOpen(false); S.offline = !S.offline; if (!S.offline) { const n = S.convos.reduce((k, x) => k + x.messages.filter((m) => m.failed).length, 0); if (n) toast(`Back online. ${n === 1 ? "One message is" : num(n) + " messages are"} waiting: press Retry to send.`); } commit(); }}>${S.offline ? "Go back online" : "Go offline"}</button>
        <button type="button" role="menuitem" onClick=${() => { setProtoOpen(false); const [who, text] = sims[(S.simI = (S.simI || 0) + 1) % sims.length]; const c = S.convos.find((x) => x.kind === "dm" && x.with[0] === who); S.typing[c.id] = who; commit(); later(900, () => { S.typing[c.id] = null; deliver(c, M(who, tick(), text, { fresh: true })); }); }}>Simulate a new message</button>
        <button type="button" role="menuitem" onClick=${() => { setProtoOpen(false); S.viewer = S.viewer === "orla" ? "mara" : "orla"; S.chips = {}; S.convoId = null; S.view = "list"; S.open = true; S.toast = null; S.menu = null; S.reading = null; S.page = "home"; S.convos.forEach((x) => x.messages.forEach((m) => { m.citedRun = 0; m.citeSettle = 0; })); commit(); }}>${S.viewer === "orla" ? "View as the couple (Mara)" : "View as Orla (venue)"}</button>
        <button type="button" role="menuitem" onClick=${() => { setProtoOpen(false); S.page = taskId ? "home" : "task:runsheet"; commit(); }}>${taskId ? "Back to Home" : "Open a task page"}</button>
        <button type="button" role="menuitem" onClick=${() => { setProtoOpen(false); const l = document.documentElement.dataset.theme !== "light"; document.documentElement.dataset.theme = l ? "light" : "dark"; try { localStorage.setItem("sc-theme", l ? "light" : "dark"); } catch (_) {} commit(); }}>${document.documentElement.dataset.theme === "light" ? "Dark theme" : "Light theme"}</button>
        <button type="button" role="menuitem" onClick=${() => { setProtoOpen(false); reset(); commit(); }}>Reset<small>Ctrl J toggles chat</small></button></div>` : null}</div>
    ${S.pills.length && !S.open ? html`<div className="pills">${S.pills.map((id) => { const c = byId(id); return html`<div key=${id} className="pill"><button type="button" onClick=${() => { openPanel(); openConvo(id); }}><${ConvoAvatar} c=${c} size=${28} noPresence=${true} /><span className="nm">${title(c)}</span>${c.unread ? html`<span className="cnt">${c.unread}</span>` : null}</button><button className="ibtn" style=${{ width: 28, height: 28 }} type="button" aria-label=${"Close " + title(c)} onClick=${() => { S.pills = S.pills.filter((p) => p !== id); commit(); }}><${Ic} n="close" s=${12} /></button></div>`; })}</div>` : null}
    ${peek && !S.open ? html`<button className=${"peek" + (peekOut ? " out" : "")} style=${S.pills.length ? { bottom: "calc(76px + env(safe-area-inset-bottom, 0px))" } : undefined} type="button" onMouseEnter=${() => (peekPause.current = true)} onMouseLeave=${() => (peekPause.current = false)} onClick=${() => { S.peek = null; openPanel(); openConvo(peek.id); }}><${Person} id=${peek.m.by} size=${32} hidden=${true} /><span style=${{ minWidth: 0 }}><span className="who">${people[peek.m.by].name}</span><span className="txt">${peek.m.text}</span></span></button>` : null}
    ${!S.open ? html`<button className="launcher" type="button" aria-label=${n ? `Open chat, ${n} unread` : "Open chat"} onClick=${openPanel}>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" aria-hidden="true"><path d=${P.bubble} /></svg>
      ${n ? html`<span key=${S.badgeKey || 0} className="badge">${n > 9 ? "9+" : n}</span>` : null}${S.launcherRipple && Date.now() - S.launcherRipple < 1300 ? html`<span key=${S.launcherRipple} className="ripple"></span>` : null}</button>` : null}
    <${Panel} />
    <div className="sr" aria-live="polite" id="live"></div>
  <//>`;
}

try { const th = localStorage.getItem("sc-theme"); if (th) document.documentElement.dataset.theme = th; else document.documentElement.dataset.theme = "dark"; const w = JSON.parse(localStorage.getItem("sc-w") || "null"); if (w) { S.width = w[0]; S.wideConvo = w[1] || 400; } } catch (_) { document.documentElement.dataset.theme = "dark"; }
const h = (location.hash || "").slice(1); if (h === "closed") S.open = false; else if (h && byId(h)) { S.open = true; openConvo(h); }
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();

</script>
