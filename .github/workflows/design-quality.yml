name: Design quality

# `registry-and-drift` is a REQUIRED status check on main. A required check that
# is path-filtered never reports on a PR outside those paths, and GitHub blocks
# the merge waiting for a job that will never run — a docs-only PR was therefore
# unmergeable. `docs/**` is listed so the check always reports; on a docs change
# it passes trivially, which is the point.
on:
  pull_request:
    paths:
      - "docs/**"
      - "src/app/**"
      - "src/components/**"
      - "src/ds/**"
      - "src/lib/**"
      - "src/server/**"
      - "src/proxy.ts"
      - "src/env.ts"
      - "src/instrumentation*.ts"
      - "src/preview/**"
      - "public/**"
      - "next.config.*"
      - "experience/**"
      - ".gitattributes"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/experience/**"
      - "scripts/design/extract-floor-css*"
      - ".github/workflows/design-quality.yml"
      - ".github/pull_request_template.md"
  push:
    branches: [main, release/january-2027]
    paths:
      - "docs/**"
      - "src/app/**"
      - "src/components/**"
      - "src/ds/**"
      - "src/lib/**"
      - "src/server/**"
      - "src/proxy.ts"
      - "src/env.ts"
      - "src/instrumentation*.ts"
      - "src/preview/**"
      - "public/**"
      - "next.config.*"
      - "experience/**"
      - ".gitattributes"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/experience/**"
      - "scripts/design/extract-floor-css*"
      - ".github/workflows/design-quality.yml"
      - ".github/pull_request_template.md"

permissions:
  contents: read

concurrency:
  group: design-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-and-drift:
    runs-on: ubuntu-latest
    # The added fixtures cover 68 route states, three React lifecycle checks
    # and scoped Floor/project-label contrast after the built-browser matrix.
    timeout-minutes: 20
    steps:
      # Full history, because this job is the only one that runs the council,
      # and the council verifies that the commit its external baseline was
      # reviewed against is genuinely reachable — a receipt pinned to a commit
      # nobody can find is not a receipt. The default shallow checkout has one
      # commit in it, so that check could never pass on a runner.
      #
      # This was latent long before it was visible: the previous baseline pinned
      # a commit from 9 August and the same check failed on it every run,
      # swallowed by the `continue-on-error` mask. Removing the mask (D-029) is
      # what surfaced it, which is the mask's whole indictment — it was hiding a
      # real integrity check that had never once been evaluated.
      #
      # The check is not relaxed to fit the runner. The runner is given the
      # history the check needs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove the evidence gates reject drift
        run: pnpm experience:self-test

      - name: Validate the Tasks experience registry
        run: pnpm experience:validate

      - name: Validate critical fixture coverage
        run: pnpm experience:fixtures

      - name: Install the deterministic browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Notes recovery and cold navigation consumers
        run: pnpm test:notes-recovery:browser

      - name: Capture critical rendered evidence
        run: pnpm experience:test

      # The preceding build supplies the local Geist assets required by this
      # fixture. Its explicit framework/identity adapters remain documented;
      # these results do not establish real Clerk or production continuity.
      - name: Verify recipient routes, React context and theme contrast
        run: pnpm test:recipient-context:browser

      # Actual component and HTTP handler, with explicit fixture identity/module
      # ports. Includes unsuccessful download and same-page recovery controls.
      - name: Verify independent profile account export and retry
        run: pnpm test:event-export:browser

      - name: Verify settings hydration across locales
        run: pnpm test:settings-hydration

      - name: Verify Timeline project switching
        run: pnpm experience:test:timeline-switcher

      - name: Prepare the current council review matrix
        run: pnpm experience:council:prepare

      # D-029 (F4). The mask is gone: `continue-on-error` used to collapse a
      # broken validator, an honest NO-PASS and a stale external baseline into
      # one green tick, which is D-024's complaint exactly. The validator now
      # tells those states apart itself — red only when the instrument is
      # wrong, green with the verdict printed when the answer is simply "not
      # 9.5 yet". A green tick here is never a 9.5 claim.
      - name: Report the council certification status
        run: pnpm experience:council:ci

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasks-critical-experience-evidence
          path: |
            experience/output/critical-evidence.json
            experience/output/evidence-attestation.json
            experience/output/quality-council-input.json
            experience/output/playwright-report
            experience/output/playwright-results
            experience/output/timeline-project-switcher-results
            experience/output/notes-recovery
            experience/output/recipient-project-work/routes
            experience/output/recipient-project-work/realtime-react
            experience/output/recipient-project-work/floor-theme
            experience/output/recipient-project-work/floor-calendar
            experience/output/recipient-project-work/wedding-date-readback
            experience/output/event-account-export
          if-no-files-found: ignore
          retention-days: 14
