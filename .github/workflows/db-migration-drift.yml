name: db-migration-drift

# Production migration-drift alarm for Signal Tasks. Applying migrations is a
# separate, receipt-gated operator action, so a merge can otherwise deploy code
# before its production database is current. This job is read-only.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: db-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: prod migrations current
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Assert production DB is fully migrated
        env:
          TASKS_DATABASE_URL: ${{ secrets.TASKS_DATABASE_URL }}
          TASKS_AUTH_TOKEN: ${{ secrets.TASKS_AUTH_TOKEN }}
        run: node scripts/db/check-prod-migrated.mjs
