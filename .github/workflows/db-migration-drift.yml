name: db-migration-drift

# Production migration-drift gate for Signal Tasks.
#
# A merge to main can add drizzle/ migrations, but applying them to the prod
# Turso DB is a SEPARATE receipt-gated operator step (scripts/db/migrate.mjs).
# On 2026-07-22 a merge shipped code needing migrations 0017-0020 while prod
# sat at 0016, and every signed-in /app render 500'd ("no such column:
# theme_mode") until it was noticed. This job turns that silent drift into a
# red check: it queries prod (read-only) and fails when migrations are pending.
#
# Runs right after each push to main (when a migration-adding merge lands),
# daily as a backstop, and on demand.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily backstop
  workflow_dispatch:

concurrency:
  group: db-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: prod migrations current
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Assert production DB is fully migrated
        env:
          TASKS_DATABASE_URL: ${{ secrets.TASKS_DATABASE_URL }}
          TASKS_AUTH_TOKEN: ${{ secrets.TASKS_AUTH_TOKEN }}
        run: node scripts/db/check-prod-migrated.mjs
