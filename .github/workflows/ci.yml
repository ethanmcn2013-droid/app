name: ci

# Production safety gate for Signal Tasks.
# Rewritten 2026-06-18 (production-readiness audit): the previous version
# used `npm ci` / package-lock.json, but this repo is pnpm-only now
# (pnpm-lock.yaml) — the old workflow could not install. Required gates:
# typecheck + test (both green). The parser smoke and lint run as
# informational steps: the parser test is date-sensitive (Show HN beat)
# and the e2e smoke needs a running dev server (see deploy.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref so a fresh push supersedes
# the previous one — saves CI minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      # SDS 2.0 drift gate — banned colours, system-token redefinition,
      # non-Geist fonts hard-fail; hex/easing debt ratchets via
      # .ds-grandfather.json (may only shrink).
      - name: Design-system drift gate
        run: pnpm run ds:check

      - name: Test
        run: pnpm test

      - name: Parser unit test (informational — date-sensitive)
        run: pnpm run test:parser
        continue-on-error: true

      - name: Lint (informational — does not block)
        run: pnpm run lint
        continue-on-error: true
