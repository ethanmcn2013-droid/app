name: ci

# Production safety gate for Signal Tasks.
# Rewritten 2026-06-18 (production-readiness audit): the previous version
# used `npm ci` / package-lock.json, but this repo is pnpm-only now
# (pnpm-lock.yaml) — the old workflow could not install. Required gates:
# lint + typecheck + design-system drift + tests (all blocking). The parser
# test remains informational because it is date-sensitive (Show HN beat).

on:
  push:
    branches: [main, release/january-2027]
  pull_request:
    branches: [main, release/january-2027]

# Cancel in-progress runs for the same ref so a fresh push supersedes
# the previous one — saves CI minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migration ledger contract
        run: pnpm db:contract

      - name: Isolated January migration rehearsal
        run: node scripts/db/verify-january-rehearsal.mjs

      - name: Typecheck
        run: pnpm typecheck

      # The D-022 access-term differential test (venue-access-term.test.ts)
      # hard-fails in CI without a live studio checkout to compare against.
      # Checked out here, after typecheck, so no other gate
      # ever scans a second repository's sources.
      - name: Checkout studio for access-term parity
        uses: actions/checkout@v4
        with:
          repository: ethanmcn2013-droid/studio
          ref: ${{ (github.base_ref == 'release/january-2027' || github.ref_name == 'release/january-2027') && 'release/january-2027' || 'main' }}
          path: studio-parity

      - name: Test (includes calendar, Signal, Timeline, and suite truth gates)
        run: pnpm test
        env:
          STUDIO_REPO_PATH: ${{ github.workspace }}/studio-parity

      # The parity checkout exists only for the differential step above;
      # removed so lint never sweeps a second repository's sources.
      - name: Remove parity checkout
        run: rm -rf studio-parity

      - name: Project Drive lifecycle and recovery
        run: pnpm test:project-drive

      - name: Parser unit test (informational — date-sensitive)
        run: pnpm run test:parser
        continue-on-error: true

      - name: Lint
        run: pnpm run lint
