name: db-migrate-retired

# Keep workflow ID 322566025 disabled. This current-ref refusal is defense
# in depth; a manually selected old ref may still contain the old raw upload.
on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'db-migrate is retired; use db-migrate-encrypted on main.'
          exit 1
