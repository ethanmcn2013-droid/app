name: timeline-db-migrate-encrypted
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Production Timeline operation; no Tasks database access'
        type: choice
        options: [status, measure, backup, execute]
        required: true
        default: status
      release_sha:
        description: 'Exact reviewed main SHA; must match the workflow checkout'
        type: string
        required: true
concurrency:
  group: timeline-db-migrate-production
  cancel-in-progress: false
jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TIMELINE_RELEASE_SHA: ${{ inputs.release_sha }}
      # Independently received production URL hash; missing/invalid fails closed.
      TIMELINE_DATABASE_URL_SHA256: ${{ vars.TIMELINE_DATABASE_URL_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read-only Timeline status or measurement
        if: inputs.command == 'status' || inputs.command == 'measure'
        env:
          TIMELINE_DATABASE_URL: ${{ secrets.TIMELINE_DATABASE_URL }}
          TIMELINE_AUTH_TOKEN: ${{ secrets.TIMELINE_AUTH_TOKEN }}
          COMMAND: ${{ inputs.command }}
        run: node scripts/db/timeline-production-backup-custody.mjs "$COMMAND"
      - name: Require recovery recipient before database access
        if: inputs.command == 'backup' || inputs.command == 'execute'
        env:
          DB_BACKUP_AGE_RECIPIENT: ${{ vars.DB_BACKUP_AGE_RECIPIENT }}
        run: |
          test -n "$DB_BACKUP_AGE_RECIPIENT"
          case "$DB_BACKUP_AGE_RECIPIENT" in age1*) ;; *) exit 1;; esac
      - name: Install checksum-pinned age v1.3.2
        if: inputs.command == 'backup' || inputs.command == 'execute'
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/age-v1.3.2-linux-amd64.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  '"$RUNNER_TEMP/age-v1.3.2-linux-amd64.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/age-v1.3.2-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
      - name: Prepare verified encrypted Timeline backup and rehearsal
        if: inputs.command == 'backup' || inputs.command == 'execute'
        env:
          TIMELINE_DATABASE_URL: ${{ secrets.TIMELINE_DATABASE_URL }}
          TIMELINE_AUTH_TOKEN: ${{ secrets.TIMELINE_AUTH_TOKEN }}
          DB_BACKUP_AGE_RECIPIENT: ${{ vars.DB_BACKUP_AGE_RECIPIENT }}
          AGE_BINARY: ${{ runner.temp }}/age/age
          BACKUP_MODE: ${{ inputs.command }}
        run: node scripts/db/timeline-production-backup-custody.mjs prepare
      - name: Upload only ciphertext and sanitized Timeline receipt
        id: encrypted_backup
        if: inputs.command == 'backup' || inputs.command == 'execute'
        uses: actions/upload-artifact@v4
        with:
          name: timeline-encrypted-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/timeline-production-cipher/backup.age
            ${{ runner.temp }}/timeline-production-cipher/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Acknowledge encrypted Timeline upload
        if: inputs.command == 'backup' || inputs.command == 'execute'
        env:
          BACKUP_ARTIFACT_ID: ${{ steps.encrypted_backup.outputs.artifact-id }}
          BACKUP_ARTIFACT_DIGEST: ${{ steps.encrypted_backup.outputs.artifact-digest }}
        run: node scripts/db/timeline-production-backup-custody.mjs acknowledge
      - name: Apply Timeline only after encrypted upload acknowledgment
        id: production_apply
        if: inputs.command == 'execute'
        env:
          TIMELINE_DATABASE_URL: ${{ secrets.TIMELINE_DATABASE_URL }}
          TIMELINE_AUTH_TOKEN: ${{ secrets.TIMELINE_AUTH_TOKEN }}
          DB_BACKUP_AGE_RECIPIENT: ${{ vars.DB_BACKUP_AGE_RECIPIENT }}
          BACKUP_ARTIFACT_ID: ${{ steps.encrypted_backup.outputs.artifact-id }}
          BACKUP_ARTIFACT_DIGEST: ${{ steps.encrypted_backup.outputs.artifact-digest }}
        run: node scripts/db/timeline-production-backup-custody.mjs apply
      - name: Retain sanitized Timeline result
        if: ${{ always() && inputs.command == 'execute' && steps.encrypted_backup.outcome == 'success' && steps.production_apply.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: timeline-encrypted-migration-result-${{ github.run_id }}
          path: ${{ runner.temp }}/timeline-production-result/receipt.json
          if-no-files-found: error
          retention-days: 90
