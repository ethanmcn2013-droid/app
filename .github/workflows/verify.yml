name: Verify Tasks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tasks-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:contract
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test (includes calendar, Signal, Timeline, and suite truth gates)
        run: pnpm test
      - run: pnpm build
      # E08.10 — performance budgets, measured from the build above so this
      # costs no extra build time. The check ratchets: it fails when a
      # measured value exceeds the ceiling recorded in
      # contracts/venue-surface-performance-budgets.v1.json. Ceilings may
      # only be lowered; raising one is a founder decision.
      - name: Performance budgets (bundle ratchet)
        run: pnpm perf:budgets
