name: Verify Tasks

on:
  pull_request:
  push:
    branches: [main, release/january-2027]

concurrency:
  group: tasks-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.checkout == 'head' && github.event_name == 'pull_request' && 'verify-exact-head' || 'verify' }}
    strategy:
      fail-fast: false
      matrix:
        checkout: ${{ fromJSON(github.event_name == 'pull_request' && '["merge","head"]' || '["head"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.checkout == 'head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - name: Record verified source
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: CI workflow contract
        run: node --test scripts/ci-workflow.test.mjs
      - name: Production deployment preflight refusals
        run: node --test scripts/deploy-preflight.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:contract
      - name: Isolated January migration rehearsal
        run: node scripts/db/verify-january-rehearsal.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      # The D-022 access-term differential test (venue-access-term.test.ts)
      # hard-fails in CI without a live studio checkout to compare against.
      # Checked out here, after lint and typecheck, so no other gate ever
      # scans a second repository's sources.
      - name: Checkout studio for access-term parity
        uses: actions/checkout@v4
        with:
          repository: ethanmcn2013-droid/studio
          # Every trigger needs this reviewed compatible fixture runtime.
          ref: 4ed9be64be4f351c5a3e7aa2b396e92d9be570bf
          path: studio-parity

      - name: Install immutable paired Studio dependencies
        working-directory: studio-parity
        run: corepack pnpm install --frozen-lockfile
      - name: Record paired Studio revision
        run: git -C studio-parity rev-parse HEAD
      - name: Project Drive suite is wired into pnpm test
        run: node -e "const s=require('./package.json').scripts.posttest||''; if(!/(^|&& )pnpm test:project-drive( &&|$)/.test(s)){console.error('posttest must run pnpm test:project-drive; it is the only CI entry point for the Project Drive suite');process.exit(1)}"
      - name: Test (includes calendar, Signal, Timeline, and suite truth gates)
        run: pnpm test
        env:
          STUDIO_REPO_PATH: ${{ github.workspace }}/studio-parity

      - name: Actual Venue payment-evidence to use and erasure rehearsal
        run: |
          pnpm test:venue-rehearsal --studio-root studio-parity
          pnpm test:sponsored-use:paired --studio-root studio-parity
      # The parity checkout exists only for the differential step above;
      # removed so the build and later gates never see a second repository.
      - name: Remove parity checkout
        run: rm -rf studio-parity
      - name: Parser unit test (informational — date-sensitive)
        run: pnpm run test:parser
        continue-on-error: true
      # Project Drive remains required once via pnpm test's posttest lifecycle.
      - name: Install Chromium for isolated task Provider proof
        run: pnpm exec playwright install --with-deps chromium
      - name: Timeline follow keyboard transitions
        run: pnpm test:timeline-follow:browser
      - name: Disabled Ping typed and voice receiving
        run: |
          pnpm test:ping-typed:browser
          pnpm test:ping-voice:browser
          pnpm test:ping-voice:tasks-browser
      - name: Task Provider ordering and snapshot freshness
        run: node --test src/lib/tasks/task-provider-ordering.test.mjs src/lib/tasks/authoritative-refresh.browser.test.mjs
      - run: pnpm build
      # E08.10 — performance budgets, measured from the build above so this
      # costs no extra build time. The check ratchets: it fails when a
      # measured value exceeds the ceiling recorded in
      # contracts/venue-surface-performance-budgets.v1.json. Ceilings may
      # only be lowered; raising one is a founder decision.
      # E08.11 — every segment of the sponsored journey is either covered by test
      # files this suite actually runs, or declared uncovered with a reason and an
      # owner. A test file that exists but is wired into nothing fails here.
      - name: Sponsored journey coverage (self-test)
        run: pnpm journey:coverage:self-test
      - name: Sponsored journey coverage
        run: pnpm journey:coverage
      # The checker's own rules — the ratchet, and the refusal to report a green
      # from an empty population — proven without needing a build.
      - name: Performance budgets (self-test)
        run: pnpm perf:budgets:self-test
      - name: Performance budgets (bundle ratchet)
        run: pnpm perf:budgets

  # Preserve the existing required context without repeating installation,
  # lint, typecheck, migration rehearsals, paired Studio or the full test suite.
  # needs.verify aggregates BOTH PR matrix jobs; every non-success fails closed.
  legacy-status:
    name: typecheck · test
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all canonical verification jobs
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          if [[ "$VERIFY_RESULT" != "success" ]]; then
            printf 'Canonical verification did not succeed: %s\n' "$VERIFY_RESULT"
            exit 1
          fi
          printf 'All canonical verification jobs passed.\n'
